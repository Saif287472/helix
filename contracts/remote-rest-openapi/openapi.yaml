openapi: 3.0.0
info:
  title: Helix Remote REST API
  description: Contract-first REST API definitions for Helix Remote (Phase 8).
  version: 1.0.0
servers:
  - url: https://api.remote.helix.com/api/v1
    description: Production server
paths:
  /auth/register:
    post:
      summary: Register a new account
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - identity_public_key
              properties:
                username:
                  type: string
                  pattern: '^[a-zA-Z0-9._-]{3,32}$'
                identity_public_key:
                  type: string
                  description: Hex-encoded Ed25519 public key
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - account_id
                  - created_at
                properties:
                  account_id:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid username or key format
        '409':
          description: Username already taken

  /auth/login:
    post:
      summary: Authenticate device and get session tokens
      operationId: loginDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - device_public_key
                - device_name
                - signature
              properties:
                username:
                  type: string
                device_public_key:
                  type: string
                  description: Hex-encoded X25519 public key
                device_name:
                  type: string
                signature:
                  type: string
                  description: Signature of challenge or timestamp signed with identity key
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - refresh_token
                  - device_id
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  device_id:
                    type: integer
        '401':
          description: Invalid credentials or signature

  /auth/token/refresh:
    post:
      summary: Rotate auth token using refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - refresh_token
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
        '401':
          description: Invalid or expired refresh token

  /devices:
    get:
      summary: List all active devices for the account
      operationId: listDevices
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          description: Unauthorized

  /devices/{deviceId}:
    delete:
      summary: Revoke a specific device
      operationId: revokeDevice
      security:
        - BearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '404':
          description: Device not found

  /devices/link/request:
    post:
      summary: Request linking a new device from an active device
      operationId: requestDeviceLink
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device_id
                - device_public_key
                - device_name
              properties:
                device_id:
                  type: string
                device_public_key:
                  type: string
                device_name:
                  type: string
      responses:
        '200':
          description: Pending link request and out-of-band verification code
        '401':
          description: Unauthorized
        '403':
          description: Device id already registered or requester inactive

  /devices/link/verify:
    post:
      summary: Approve a pending device link using the out-of-band code
      operationId: verifyDeviceLink
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - link_id
                - verification_code
              properties:
                link_id:
                  type: string
                verification_code:
                  type: string
      responses:
        '200':
          description: Link request approved
        '403':
          description: Verification failed

  /devices/link/complete:
    post:
      summary: Register the approved linked device public key
      operationId: completeDeviceLink
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - link_id
              properties:
                link_id:
                  type: string
      responses:
        '200':
          description: Device linked and ready for challenge login
        '403':
          description: Link request is not approved

  /devices/lost-device:
    post:
      summary: Report a lost device and purge its pending mailbox
      operationId: reportLostDevice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device_id
              properties:
                device_id:
                  type: string
      responses:
        '200':
          description: Lost device revoked
        '401':
          description: Unauthorized

  /keys/prekeys:
    post:
      summary: Upload a new batch of prekeys
      operationId: uploadPreKeys
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signed_prekey
                - signed_prekey_signature
                - one_time_prekeys
              properties:
                signed_prekey:
                  type: string
                signed_prekey_signature:
                  type: string
                one_time_prekeys:
                  type: array
                  items:
                    type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized

  /keys/prekeys/{accountId}/{deviceId}:
    get:
      summary: Get prekey bundle for a device to establish E2EE session
      operationId: getPreKeyBundle
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreKeyBundle'
        '401':
          description: Unauthorized
        '404':
          description: Bundle not found

  /contacts/requests:
    post:
      summary: Send a contact/friend request
      operationId: sendContactRequest
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_username
              properties:
                target_username:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - status
                properties:
                  request_id:
                    type: string
                  status:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Target user not found

  /contacts/requests/{requestId}/accept:
    post:
      summary: Accept a pending contact request
      operationId: acceptContactRequest
      security:
        - BearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '404':
          description: Request not found

  /attachments/upload:
    post:
      summary: Request a pre-signed URL to upload an encrypted attachment
      operationId: requestAttachmentUpload
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_size
                - file_hash
              properties:
                file_size:
                  type: integer
                file_hash:
                  type: string
                  description: SHA-256 hash of the ciphertext file
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                  - file_id
                  - upload_url
                  - headers
                properties:
                  file_id:
                    type: string
                  upload_url:
                    type: string
                  headers:
                    type: object
                    additionalProperties:
                      type: string
        '401':
          description: Unauthorized

  /attachments/download/{fileId}:
    get:
      summary: Request a pre-signed URL to download an encrypted attachment
      operationId: requestAttachmentDownload
      security:
        - BearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                  - download_url
                properties:
                  download_url:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: File not found

  /backups:
    post:
      summary: Upload an opaque encrypted, versioned account backup envelope
      operationId: uploadBackup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptedBackupUpload'
      responses:
        '200':
          description: Backup stored
        '400':
          description: Missing metadata, unsupported version, or key material supplied
        '401':
          description: Unauthorized
    get:
      summary: Download the caller account's opaque encrypted backup envelope
      operationId: downloadBackup
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Backup envelope metadata and opaque ciphertext
        '404':
          description: No backup exists for this account
        '401':
          description: Unauthorized

  /account:
    delete:
      summary: Request account deletion (marks data for erasure)
      operationId: requestAccountDeletion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmation_phrase
              properties:
                confirmation_phrase:
                  type: string
      responses:
        '204':
          description: Deletion scheduled
        '401':
          description: Unauthorized
        '400':
          description: Invalid confirmation phrase

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Device:
      type: object
      required:
        - device_id
        - device_name
        - device_public_key
        - created_at
      properties:
        device_id:
          type: integer
        device_name:
          type: string
        device_public_key:
          type: string
        created_at:
          type: string
          format: date-time
    PreKeyBundle:
      type: object
      required:
        - account_id
        - device_id
        - identity_key
        - signed_prekey
        - signed_prekey_signature
      properties:
        account_id:
          type: string
        device_id:
          type: integer
        identity_key:
          type: string
        signed_prekey:
          type: string
        signed_prekey_signature:
          type: string
        one_time_prekey:
          type: string
          description: A single OTK fetched and consumed. Can be null if exhausted.
    EncryptedBackupUpload:
      type: object
      required:
        - backup_id
        - version
        - kdf
        - salt
        - backup_data
      properties:
        backup_id:
          type: string
        version:
          type: integer
        kdf:
          type: string
          example: PBKDF2-HMAC-SHA256-100000
        salt:
          type: string
          description: Base64url encoded KDF salt
        backup_key_hint:
          type: string
          description: User-visible hint only; never the backup key or phrase
        backup_data:
          type: string
          description: Opaque encrypted backup payload
        deletion_watermark:
          type: integer
          description: Latest deletion timestamp included in the encrypted backup
