name: helix_admin
description: >-
  Helix Admin: the operator console for a Helix Remote v2 server. It runs on
  the v2 admin API only (helix_remote_api/v2.dart).
publish_to: 'none'
version: 2.0.0-dev+1

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  helix_remote_api:
    path: ../packages/helix_remote_api
  helix_remote_protocol:
    path: ../packages/helix_remote_protocol
  helix_remote_ui:
    path: ../packages/helix_remote_ui
  local_auth: ^3.0.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  helix_remote_architecture_rules:
    path: ../packages/helix_remote_architecture_rules
  http: ^1.6.0

flutter:
  uses-material-design: true
