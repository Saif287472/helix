name: helix_remote_tool
description: Repository checks and tooling scripts for helix_remote - governance controls, performance budgets, the SBOM and the Orbit theme-pack signing tool.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  # The pack format and its gate, so `verify` checks a pack with the same code
  # the app does. `cryptography` is here for the half the app must never have:
  # signing with a private key.
  cryptography: ^2.9.0
  helix_remote_domain:
    path: ../packages/helix_remote_domain
