publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  aws_common: ^0.7.15
  aws_signature_v4: ^0.6.13
  crypto: ^3.0.7
  cryptography: ^2.9.0
  googleapis_auth: ^2.3.3
  helix_remote_protocol:
    path: ../packages/helix_remote_protocol
  http: ^1.2.0
  path: ^1.9.1
  postgres: ^3.5.17
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  stream_channel: ^2.1.4
  web_socket_channel: ^3.0.3

dev_dependencies:
  helix_remote_api:
    path: ../packages/helix_remote_api
  helix_remote_architecture_rules:
    path: ../packages/helix_remote_architecture_rules
  test: ^1.31.0
