name: helix_remote_db
description: >-
  Helix Remote v2 local database - drift over SQLCipher, schema, DAOs and
  watch queries. Pure Dart, so the app, the FCM background isolate and the
  CLI can all open it (ADR-027).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  # Exactly the release drift_dev 2.34.0 was built against: later 2.34.x
  # patches changed the drift3 preview API its schema tools compile
  # against. See DEPENDENCY_RISK_REGISTER.md.
  drift: 2.34.0
  helix_remote_protocol:
    path: ../helix_remote_protocol
  meta: ^1.18.0
  sqlite3: ^3.5.2

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  helix_remote_architecture_rules:
    path: ../helix_remote_architecture_rules
  path: ^1.9.1
  test: ^1.31.0
