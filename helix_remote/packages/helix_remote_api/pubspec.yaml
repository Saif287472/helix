name: helix_remote_api
description: >-
  HTTP REST client definitions and WebSocket envelope parser for Helix Remote
  (v1, `lib/api.dart`), and the typed v2 REST and realtime clients
  (`lib/v2.dart`).
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  crypto: ^3.0.7
  helix_remote_domain:
    path: ../helix_remote_domain
  helix_remote_protocol:
    path: ../helix_remote_protocol
  http: ^1.6.0
  meta: ^1.18.0

dev_dependencies:
  fake_async: ^1.3.3
  helix_remote_architecture_rules:
    path: ../helix_remote_architecture_rules
  test: ^1.31.0
