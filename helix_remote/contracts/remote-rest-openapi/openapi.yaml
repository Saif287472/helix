  # ─── WebSocket ────────────────────────────────────────────────
  /api/v1/ws:
    get:
      summary: WebSocket upgrade endpoint for real-time messaging
      operationId: webSocketConnect
      tags: [WebSocket]
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Auth Schemas ───────────────────────────────────────────
    RegisterRequest:
      type: object
      required:
        - account_id
        - username
        - display_name
        - registration_version
        - account_identity_public_key
        - device_id
        - device_signing_public_key
        - device_agreement_public_key
        - account_registration_signature
        - device_registration_signature
        - device_name
      properties:
        registration_version:
          type: integer
          enum: [2]
        account_id:
          type: string
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^(?!helix_)[a-z0-9_]+$'
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        account_identity_public_key:
          type: string
          description: Base64url-encoded Ed25519 account identity public key
        device_id:
          type: string
        device_signing_public_key:
          type: string
          description: Base64url-encoded Ed25519 device authentication public key
        device_agreement_public_key:
          type: string
          description: Base64url-encoded X25519 device agreement public key
        account_registration_signature:
          type: string
          description: Ed25519 signature over the v2 registration transcript using the account identity key
        device_registration_signature:
          type: string
          description: Ed25519 signature over the v2 registration transcript using the device signing key
        device_name:
          type: string

    LoginRequest:
      type: object
      required:
        - account_id
        - device_id
        - signature
      properties:
        account_id:
          type: string
        device_id:
          type: string
        signature:
          type: string
          description: Signature of the bound login challenge signed with the device signing key

    ChallengeResponse:
      type: object
      required:
        - challenge
      properties:
        challenge:
          type: string

    TokenResponse:
      type: object
      required:
        - token
        - refresh_token
      properties:
        token:
          type: string
        refresh_token:
          type: string

    # ─── Device ─────────────────────────────────────────────────
    Device:
      type: object
      required:
        - device_id
        - device_name
        - device_signing_public_key
        - device_agreement_public_key
        - created_at
      properties:
        device_id:
          type: string
        device_name:
          type: string
        device_signing_public_key:
          type: string
        device_agreement_public_key:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time

    # ─── Prekey Schemas ─────────────────────────────────────────
    PrekeyPublishRequest:
      type: object
      required:
        - signed_prekey_id
        - signed_prekey
        - signature
        - one_time_prekeys
      properties:
        signed_prekey_id:
          type: integer
        signed_prekey:
          type: string
        signature:
          type: string
        one_time_prekeys:
          type: array
          items:
            $ref: '#/components/schemas/OneTimePrekey'

    OneTimePrekey:
      type: object
      required:
        - key_id
        - public_key
      properties:
        key_id:
          type: integer
        public_key:
          type: string

    PreKeyBundleResponse:
      type: object
      required:
        - account_id
        - devices
      properties:
        account_id:
          type: string
        devices:
          type: array
          items:
            type: object
            required:
              - device_id
              - identity_key
              - signed_prekey
              - signed_prekey_signature
            properties:
              device_id:
                type: string
              identity_key:
                type: string
              signed_prekey:
                type: string
              signed_prekey_signature:
                type: string
              one_time_prekeys:
                type: array
                items:
                  $ref: '#/components/schemas/OneTimePrekey'

    # ─── Contact Schemas ────────────────────────────────────────
    ContactRequest:
      type: object
      required: [peer_account_id]
      properties:
        peer_account_id:
          type: string

    # Call signaling schemas
    CallSignalPayload:
      type: object
      required:
        - call_id
        - signal_type
      properties:
        call_id:
          type: string
          maxLength: 128
        caller_account_id:
          type: string
          readOnly: true
          description: Server-injected account identity of the authenticated sender.
        caller_device_id:
          type: string
          readOnly: true
          description: Server-injected device identity of the authenticated sender.
        callee_account_id:
          type: string
          description: Required for offers; server may also copy target_account_id into this field.
        target_device_id:
          type: string
          description: Concrete delivery target when the signal is for one device.
        signal_type:
          type: string
          enum: [offer, answer, ice, decline, busy, cancel, end, answered_elsewhere]
        is_video:
          type: boolean
          default: false
        sdp:
          type: string
          maxLength: 65536
        candidate:
          type: string
          maxLength: 4096
        sdp_mid:
          type: string
        mline_index:
          type: integer
          minimum: 0
          maximum: 64
        created_at:
          type: integer
          format: int64
          readOnly: true
        expires_at:
          type: integer
          format: int64
          readOnly: true

    CallSignalResult:
      type: object
      required: [status, call_id]
      properties:
        status:
          type: string
          enum: [delivered, partial, queued, duplicate, rejected, no_active_devices, answered_elsewhere, expired]
        delivered:
          type: boolean
        call_id:
          type: string
        delivered_count:
          type: integer
        queued_count:
          type: integer
        target_device_id:
          type: string
        target_device_ids:
          type: array
          items:
            type: string
        expires_at:
          type: integer
          format: int64
        request_id:
          type: string
        reason:
          type: string

    PendingCall:
      type: object
      required:
        - call_id
        - caller_account_id
        - caller_device_id
        - callee_account_id
        - is_video
        - status
        - created_at
        - expires_at
      properties:
        call_id:
          type: string
        caller_account_id:
          type: string
        caller_device_id:
          type: string
        callee_account_id:
          type: string
        is_video:
          type: integer
          enum: [0, 1]
        status:
          type: string
          enum: [RINGING, ANSWERED, DECLINED, BUSY, CANCELLED, END, EXPIRED]
        created_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        answered_by_device_id:
          type: string

    # ─── Message Schemas ────────────────────────────────────────
    MessageSendRequest:
      type: object
      required:
        - message_id
        - conversation_id
        - envelopes
      properties:
        message_id:
          type: string
        conversation_id:
          type: string
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/MessageEnvelope'

    MessageEnvelope:
      type: object
      required:
        - recipient_device_id
        - ciphertext
      properties:
        recipient_device_id:
          type: string
        ciphertext:
          type: string

    SyncResponse:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              message_id:
                type: string
              sender_device_id:
                type: string
              conversation_id:
                type: string
              sequence:
                type: integer
              ciphertext:
                type: string
              timestamp:
                type: string
                format: date-time

    # ─── Attachment Schemas ─────────────────────────────────────
    AttachmentUploadRequest:
      type: object
      required:
        - file_size
        - file_hash
      properties:
        file_size:
          type: integer
          minimum: 1
        file_hash:
          type: string
          description: SHA-256 hash of the ciphertext file

    # ─── Account Schemas ────────────────────────────────────────
    AccountDeleteRequest:
      type: object
      required:
        - confirmation
      properties:
        confirmation:
          type: string
          description: Must equal "DELETE <accountId>"

    # ─── Backup Schema ──────────────────────────────────────────
    EncryptedBackupUpload:
      type: object
      required:
        - version
        - backup_data
      properties:
        backup_id:
          type: string
        version:
          type: integer
        kdf:
          type: string
          example: Argon2id-v1-m8192-t2-p1
        salt:
          type: string
          description: Base64url encoded KDF salt
        backup_key_hint:
          type: string
        backup_data:
          type: string
          description: Opaque encrypted backup payload

    BackupMediaUploadRequest:
      type: object
      required: [object_id, byte_size, sha256]
      properties:
        object_id:
          type: string
        byte_size:
          type: integer
        sha256:
          type: string
          description: Hex SHA-256 of the encrypted media object

    BackupMediaUploadTarget:
      type: object
      required: [object_id, upload_url, status_url, download_url, headers]
      properties:
        object_id:
          type: string
        upload_url:
          type: string
        status_url:
          type: string
        download_url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
