openapi: 3.0.0
info:
  title: Helix Remote REST API
  description: Contract-first REST API definitions for Helix Remote.
  version: 1.0.0
servers:
  - url: https://api.remote.helix.com/api/v1
    description: Production server
paths:
  # ─── Auth: Accounts ───────────────────────────────────────────
  /accounts/register:
    post:
      summary: Register a new account with an initial device
      operationId: registerAccount
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account and device created
          content:
            application/json:
              schema:
                type: object
                required: [message, account_id, device_id]
                properties:
                  message:
                    type: string
                  account_id:
                    type: string
                  device_id:
                    type: string
        '400':
          description: Invalid input
        '409':
          description: Account or device already exists

  /accounts/challenge:
    get:
      summary: Request a challenge for authentication
      operationId: getChallenge
      tags: [Auth]
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
        - name: device_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Challenge generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'

  /accounts/login:
    post:
      summary: Authenticate device and obtain session tokens
      operationId: loginDevice
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    properties:
                      message:
                        type: string
        '401':
          description: Invalid credentials or signature

  /accounts/refresh:
    post:
      summary: Rotate auth token using refresh token
      operationId: refreshToken
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token

  # ─── Auth: Devices ────────────────────────────────────────────
  /accounts/devices:
    get:
      summary: List all active devices for the authenticated account
      operationId: listDevices
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
        '401':
          description: Unauthorized

  /accounts/devices/revoke:
    post:
      summary: Revoke a specific device
      operationId: revokeDevice
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Device not found

  /accounts/devices/link/request:
    post:
      summary: Request linking a new device from an active device
      operationId: requestDeviceLink
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, device_public_key, device_name]
              properties:
                device_id:
                  type: string
                device_public_key:
                  type: string
                device_name:
                  type: string
      responses:
        '200':
          description: Link request created
          content:
            application/json:
              schema:
                type: object
                required: [link_id, verification_code, status]
                properties:
                  link_id:
                    type: string
                  verification_code:
                    type: string
                  status:
                    type: string
        '401':
          description: Unauthorized

  /accounts/devices/link/request-new:
    post:
      summary: Start linking from a fresh device without creating another account
      operationId: requestNewDeviceLink
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account_id
                - device_id
                - device_name
                - device_signing_public_key
                - device_agreement_public_key
              properties:
                account_id:
                  type: string
                device_id:
                  type: string
                device_name:
                  type: string
                device_signing_public_key:
                  type: string
                device_agreement_public_key:
                  type: string
      responses:
        '200':
          description: Short-lived pending link created
          content:
            application/json:
              schema:
                type: object
                required: [link_id, verification_code, expires_at, status, qr_payload]
                properties:
                  link_id:
                    type: string
                  verification_code:
                    type: string
                  expires_at:
                    type: integer
                  status:
                    type: string
                  qr_payload:
                    type: string
        '403':
          description: Account or device cannot be linked

  /accounts/devices/link/verify:
    post:
      summary: Approve a pending device link using out-of-band code
      operationId: verifyDeviceLink
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_id, verification_code]
              properties:
                link_id:
                  type: string
                verification_code:
                  type: string
      responses:
        '200':
          description: Link verified
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                  approval_transcript:
                    type: string
                  approval_transcript_hash:
                    type: string
        '403':
          description: Verification failed

  /accounts/devices/link/reject:
    post:
      summary: Reject a pending device link using the out-of-band code
      operationId: rejectDeviceLink
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_id, verification_code]
              properties:
                link_id:
                  type: string
                verification_code:
                  type: string
      responses:
        '200':
          description: Link rejected
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        '403':
          description: Rejection failed

  /accounts/devices/link/complete:
    post:
      summary: Complete the device link process
      operationId: completeDeviceLink
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_id]
              properties:
                link_id:
                  type: string
      responses:
        '200':
          description: Device linked
          content:
            application/json:
              schema:
                type: object
                required: [status, device_id]
                properties:
                  status:
                    type: string
                  device_id:
                    type: string
        '403':
          description: Link not approved

  /accounts/devices/link/complete-new:
    post:
      summary: Complete a trusted device link from the fresh device
      operationId: completeNewDeviceLink
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_id, signature]
              properties:
                link_id:
                  type: string
                signature:
                  type: string
      responses:
        '200':
          description: Device linked and session tokens issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    required: [status, account_id, device_id]
                    properties:
                      status:
                        type: string
                      account_id:
                        type: string
                      device_id:
                        type: string
                      refresh_expires_at:
                        type: integer
        '403':
          description: Link not approved, expired, replayed, or signature invalid

  /accounts/devices/lost-device:
    post:
      summary: Report a lost device and purge its data
      operationId: reportLostDevice
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
      responses:
        '200':
          description: Lost device reported
          content:
            application/json:
              schema:
                type: object
                required: [message, device_id]
                properties:
                  message:
                    type: string
                  device_id:
                    type: string
        '401':
          description: Unauthorized

  /accounts/devices/push-token:
    put:
      summary: Register or refresh the FCM/APNs push token for the authenticated device
      operationId: updateDevicePushToken
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token]
              properties:
                push_token:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: FCM or APNs device registration token. Looked up at delivery time; never stored in the outbox payload.
      responses:
        '200':
          description: Push token updated
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: updated
        '400':
          description: Invalid push_token (empty or over 256 characters)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /accounts/username:
    post:
      summary: Update or set the display username
      operationId: updateUsername
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: '^(?!helix_)[a-z0-9_]+$'
      responses:
        '200':
          description: Username updated
          content:
            application/json:
              schema:
                type: object
                required: [message, username]
                properties:
                  message:
                    type: string
                  username:
                    type: string
        '401':
          description: Unauthorized

  # ─── Prekeys ──────────────────────────────────────────────────
  /accounts/profile:
    post:
      summary: Update display profile fields for the authenticated account
      operationId: updateProfile
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  maxLength: 80
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    type: object
                    required:
                      - account_id
                      - display_name
                      - updated_at
                      - profile_version
                    properties:
                      account_id:
                        type: string
                      display_name:
                        type: string
                      updated_at:
                        type: integer
                      profile_version:
                        type: integer
        '400':
          description: Invalid profile data
        '401':
          description: Unauthorized

  /prekeys/publish:
    post:
      summary: Publish signed prekey and one-time prekeys
      operationId: publishPreKeys
      tags: [Prekeys]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrekeyPublishRequest'
      responses:
        '200':
          description: Prekeys published
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized

  /prekeys/bundle:
    get:
      summary: Get prekey bundle for an account to establish E2EE
      operationId: getPreKeyBundle
      tags: [Prekeys]
      security:
        - BearerAuth: []
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Prekey bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreKeyBundleResponse'
        '401':
          description: Unauthorized
        '404':
          description: Account not found

  # ─── Contacts ─────────────────────────────────────────────────
  /contacts/:
    get:
      summary: List contacts for the authenticated account
      operationId: listContacts
      tags: [Contacts]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Contact list
          content:
            application/json:
              schema:
                type: object
                required: [contacts]
                properties:
                  contacts:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized

  /contacts/requests:
    get:
      summary: List pending contact requests
      operationId: listContactRequests
      tags: [Contacts]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized
    post:
      summary: Send a contact request
      operationId: sendContactRequest
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      responses:
        '201':
          description: Request sent
          content:
            application/json:
              schema:
                type: object
                required: [request_id, status]
                properties:
                  request_id:
                    type: string
                  status:
                    type: string
        '401':
          description: Unauthorized
        '404':
          description: Target user not found

  /contacts/requests/accept:
    post:
      summary: Accept a pending contact request
      operationId: acceptContactRequest
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id:
                  type: string
      responses:
        '200':
          description: Request accepted
        '401':
          description: Unauthorized
        '404':
          description: Request not found

  /contacts/requests/reject:
    post:
      summary: Reject a pending contact request
      operationId: rejectContactRequest
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id:
                  type: string
      responses:
        '200':
          description: Request rejected
        '401':
          description: Unauthorized
        '404':
          description: Request not found

  /contacts/requests/cancel:
    post:
      summary: Cancel an outgoing contact request
      operationId: cancelContactRequest
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id:
                  type: string
      responses:
        '200':
          description: Request cancelled
        '401':
          description: Unauthorized
        '404':
          description: Request not found

  /contacts/add:
    post:
      summary: Add a contact directly
      operationId: addContact
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_account_id]
              properties:
                peer_account_id:
                  type: string
                nickname:
                  type: string
      responses:
        '200':
          description: Contact added
        '401':
          description: Unauthorized

  /contacts/remove:
    post:
      summary: Remove a contact
      operationId: removeContact
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_account_id]
              properties:
                peer_account_id:
                  type: string
      responses:
        '200':
          description: Contact removed
        '401':
          description: Unauthorized

  /contacts/block:
    post:
      summary: Block a contact
      operationId: blockContact
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_account_id]
              properties:
                peer_account_id:
                  type: string
      responses:
        '200':
          description: Contact blocked
        '401':
          description: Unauthorized

  /contacts/unblock:
    post:
      summary: Unblock a contact
      operationId: unblockContact
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_account_id]
              properties:
                peer_account_id:
                  type: string
      responses:
        '200':
          description: Contact unblocked
        '401':
          description: Unauthorized

  /contacts/search:
    get:
      summary: Fuzzy search for discoverable users by display name
      operationId: searchContacts
      tags: [Contacts]
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Display-name search results ranked by similarity
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      required: [account_id, display_name, similarity]
                      properties:
                        account_id:
                          type: string
                        display_name:
                          type: string
                        similarity:
                          type: number
                          format: double
        '401':
          description: Unauthorized

  /contacts/privacy:
    get:
      summary: Get privacy settings
      operationId: getPrivacySettings
      tags: [Contacts]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Privacy settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  search_discoverable:
                    type: boolean
                  presence_visibility:
                    type: string
                  last_seen_visibility:
                    type: string
        '401':
          description: Unauthorized
    post:
      summary: Update privacy settings
      operationId: updatePrivacySettings
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                search_discoverable:
                  type: boolean
                presence_visibility:
                  type: string
                last_seen_visibility:
                  type: string
      responses:
        '200':
          description: Settings updated
        '401':
          description: Unauthorized

  /contacts/presence:
    post:
      summary: Send presence heartbeat
      operationId: presenceHeartbeat
      tags: [Contacts]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Heartbeat received
        '401':
          description: Unauthorized

  /contacts/presence/{accountId}:
    get:
      summary: Get presence status for a contact
      operationId: getPresence
      tags: [Contacts]
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Presence status
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  status:
                    type: string
                  last_seen:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized

  /contacts/report:
    post:
      summary: Report a contact
      operationId: reportContact
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reported_account_id:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Report submitted
        '401':
          description: Unauthorized

  /contacts/reports/action:
    post:
      summary: Take action on a report (admin)
      operationId: takeReportAction
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                report_id:
                  type: string
                action:
                  type: string
      responses:
        '200':
          description: Action taken
        '403':
          description: Admin privileges required

  # ─── Messages ─────────────────────────────────────────────────
  /messages/conversations/create:
    post:
      summary: Create a new conversation
      operationId: createConversation
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, type, members]
              properties:
                conversation_id:
                  type: string
                type:
                  type: string
                  enum: [direct, group]
                title:
                  type: string
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      account_id:
                        type: string
                      device_id:
                        type: string
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation_id:
                    type: string
                  status:
                    type: string
        '401':
          description: Unauthorized

  /messages/send:
    post:
      summary: Send a message with encrypted envelopes
      operationId: sendMessage
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSendRequest'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  sequence:
                    type: integer
        '401':
          description: Unauthorized

  /messages/sync:
    get:
      summary: Sync messages for a conversation since a sequence number
      operationId: syncMessages
      tags: [Messages]
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: query
          required: true
          schema:
            type: string
        - name: since_sequence
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Synced messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '401':
          description: Unauthorized

  /messages/cursor:
    post:
      summary: Update the read cursor for a conversation
      operationId: updateCursor
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, sequence]
              properties:
                conversation_id:
                  type: string
                sequence:
                  type: integer
      responses:
        '200':
          description: Cursor updated
        '401':
          description: Unauthorized

  /messages/delete:
    post:
      summary: Delete a message
      operationId: deleteMessage
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id:
                  type: string
      responses:
        '200':
          description: Message deleted
        '401':
          description: Unauthorized

  # ─── Attachments ──────────────────────────────────────────────
  /messages/edit:
    post:
      summary: Edit an encrypted message by publishing a replacement ciphertext
      operationId: editMessage
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id, conversation_id, ciphertext]
              properties:
                message_id:
                  type: string
                conversation_id:
                  type: string
                revision_id:
                  type: string
                ciphertext:
                  type: string
      responses:
        '200':
          description: Edit accepted
        '401':
          description: Unauthorized
        '403':
          description: Sender is not allowed to edit this message
        '404':
          description: Message not found

  /messages/reactions:
    post:
      summary: Add an encrypted-message reaction event
      operationId: addReaction
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id, reaction]
              properties:
                message_id:
                  type: string
                revision_id:
                  type: string
                reaction:
                  type: string
      responses:
        '200':
          description: Reaction accepted
        '401':
          description: Unauthorized
        '404':
          description: Message not found

  /messages/receipts:
    post:
      summary: Publish a delivery or read receipt
      operationId: publishReceipt
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id, conversation_id, receipt_type]
              properties:
                message_id:
                  type: string
                conversation_id:
                  type: string
                account_id:
                  type: string
                device_id:
                  type: string
                receipt_type:
                  type: string
                  enum: [DELIVERY, READ]
      responses:
        '200':
          description: Receipt accepted
        '401':
          description: Unauthorized
        '403':
          description: Sender is not a conversation member

  /messages/typing:
    post:
      summary: Publish transient typing state
      operationId: publishTyping
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, is_typing]
              properties:
                conversation_id:
                  type: string
                account_id:
                  type: string
                device_id:
                  type: string
                is_typing:
                  type: boolean
      responses:
        '200':
          description: Typing state accepted
        '401':
          description: Unauthorized
        '403':
          description: Sender is not a conversation member

  /attachments/upload:
    post:
      summary: Request pre-signed URL for attachment upload
      operationId: requestAttachmentUpload
      tags: [Attachments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
      responses:
        '200':
          description: Upload URL generated
          content:
            application/json:
              schema:
                type: object
                required: [upload_url]
                properties:
                  upload_url:
                    type: string
                  file_id:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized

  /attachments/upload/status/{fileId}:
    get:
      summary: Check upload status for a file
      operationId: getUploadStatus
      tags: [Attachments]
      security:
        - BearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload status
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id:
                    type: string
                  status:
                    type: string
                  uploaded_bytes:
                    type: integer
                  total_bytes:
                    type: integer
        '401':
          description: Unauthorized

  /attachments/upload/file/{fileId}:
    put:
      summary: Upload file bytes at a given offset
      operationId: uploadFileChunk
      tags: [Attachments]
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Chunk uploaded
        '206':
          description: Partial upload accepted
        '401':
          description: Unauthorized

  /attachments/download/{fileId}:
    get:
      summary: Request pre-signed URL for attachment download
      operationId: requestAttachmentDownload
      tags: [Attachments]
      security:
        - BearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Download URL generated
          content:
            application/json:
              schema:
