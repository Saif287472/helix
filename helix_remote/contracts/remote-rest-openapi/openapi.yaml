openapi: 3.0.0
info:
  title: Helix Remote REST API
  description: >-
    Contract-first REST API definitions for Helix Remote.


    Paths are relative to the `/api/v1` server base, except the two app-link
    routes (`/.well-known/assetlinks.json`, `/open`), which are served at the
    server root and override `servers` accordingly. The auth router is
    mounted twice, at `/api/v1/accounts` and `/api/v1/devices`; only the
    `/accounts` form is listed.


    Auth: operations with `BearerAuth` need a session access token (1 hour;
    rotate with POST /accounts/refresh). Operations without a `security`
    entry are public - they are exactly the exemption list in
    `_authMiddleware` (backend/lib/src/server_impl.dart). Admin routes
    (/admin, /ops) accept `AdminAuth` or the session of an admin account;
    /s2s routes use `S2SSignature`.


    Errors: unless an operation says otherwise, every 4xx/5xx body is an
    `ErrorResponse` (`{error, code?, details?}`). The middleware adds 401
    `token_invalid` / `device_inactive`, 403 `account_blocked`, 403
    `account_suspended` (with `X-Helix-Account-Status: suspended`) on
    activity routes of a suspended account, 429 for the global per-IP rate
    limit, and 503 `{status: maintenance}` with Retry-After while
    maintenance mode is on (except /health, /ops, /admin, /server). Every
    response carries `x-correlation-id`.


    2026-09-29 (v1.1.0): synced with the backend router - added password
    sign-in, recovery, device rename/security-history/revoke-others, history
    backups, device events, contacts people/sync (still uncommitted in the
    backend working tree), call push tokens and metrics, group epoch keys,
    group calls, admin/ops, s2s and app-link routes; corrected request and
    response fields, status codes (e.g. register answers 200) and the
    WebSocket path; removed POST /ops/feature-flags (now
    POST /ops/feature-flags/{name}).
  version: 1.1.0
servers:
  - url: https://api.remote.helix.com/api/v1
    description: Production server
tags:
  - name: Auth
    description: Registration, sign-in (device key, password, recovery), devices, phone OTP, invites, profile
  - name: Prekeys
  - name: Contacts
    description: Contacts, requests, discovery, privacy, presence, reports. The request/accept flow is expected to change.
  - name: Messages
  - name: Attachments
  - name: Calls
  - name: GroupCalls
    description: Multi-party call rooms, call links and scheduled calls
  - name: Groups
  - name: Backups
  - name: Health
  - name: Server
  - name: Telemetry
  - name: Privacy
  - name: Account
  - name: WebSocket
  - name: AppLinks
    description: Shared-link support served at the server root
  - name: Admin
    description: Admin console API under /admin (same handlers as /ops, plus auth/login)
  - name: Ops
    description: Operator API under /ops (same handlers as /admin)
  - name: S2S
    description: Signed server-to-server federation
paths:
  # ─── Auth: Accounts ───────────────────────────────────────────
  # The auth router is mounted at both /api/v1/accounts and /api/v1/devices,
  # so every /accounts/* path below is also served under /devices/* (e.g.
  # /devices/devices/revoke). Only the /accounts form is documented.
  /accounts/register:
    post:
      summary: >-
        Register a new account with an initial device, or (Helix Global only)
        sign an existing account in on a new device
      description: >-
        On personal/self-hosted servers this always creates a new account and
        requires a redeemable `invite_code` plus a valid `otp_code`.

        Helix Global requires no invite. After verifying the SMS OTP for
        `phone_hash` the server decides from the phone hash alone whether the
        number is new or already owns an account. A new number creates the
        account and this device. An existing number does NOT create anything:
        the request is treated as a phone-authenticated login, the account's
        identity key rotates to this device and previously-linked devices are
        revoked (see the account-recovery semantics), and the response carries
        the real `account_id` with `existing_account: true`. The client must
        use the returned `account_id` for the subsequent challenge/login calls
        rather than the one it proposed.

        Re-sending an identical registration that already succeeded (lost
        response retry) returns 200 again with `existing_account: false`.
      operationId: registerAccount
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Account and device created (or existing account signed in on Global)
          content:
            application/json:
              schema:
                type: object
                required: [message, account_id, device_id, existing_account]
                properties:
                  message:
                    type: string
                  account_id:
                    type: string
                  device_id:
                    type: string
                  existing_account:
                    type: boolean
                    description: >-
                      True when Helix Global matched an existing account for
                      this phone number and signed this device in instead of
                      creating a new account.
                  display_name:
                    type: string
                    description: >-
                      Present on an existing-account login; the account's
                      current display name, which the client should keep.
        '400':
          description: >-
            Missing fields, invalid keys/signatures, invalid display name or
            account id (`bad_request`), missing invite on a personal server,
            Terms not accepted (`terms_acceptance_required`) or outdated
            (`terms_version_outdated`) on Global
        '403':
          description: >-
            Invalid, expired or used invite; OTP failed (`invalid_otp`); phone
            number blocked (`phone_blocked`); account blocked; existing
            account id that must be linked from an active device
        '409':
          description: >-
            Phone number already registered on a personal server
            (`phone_already_registered`), or account/device id conflict

  /accounts/challenge:
    get:
      summary: Request a signed-login challenge for a device
      description: >-
        Challenges live in memory for 5 minutes, one per account/device pair.
        The device signs the returned `challenge` string with its Ed25519
        signing key and posts it to /accounts/login.
      operationId: getChallenge
      tags: [Auth]
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
        - name: device_id
          in: query
          required: true
          schema:
            type: string
        - name: purpose
          in: query
          required: false
          schema:
            type: string
            default: login
      responses:
        '200':
          description: Challenge generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '400':
          description: Missing account_id or device_id
        '429':
          description: Too many pending login challenges (`quota_exceeded`)

  /accounts/login:
    post:
      summary: Authenticate device and obtain session tokens
      operationId: loginDevice
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    properties:
                      message:
                        type: string
        '400':
          description: Missing account_id, device_id or signature
        '403':
          description: >-
            Challenge missing/expired/mismatched, signature invalid, device not
            registered or signed out (`device_revoked`), account blocked
            (`account_blocked`)

  /accounts/refresh:
    post:
      summary: Rotate the session using the refresh token
      description: >-
        Every refresh revokes the presented refresh token and issues a new
        pair. Presenting an already-rotated token revokes every refresh token
        of that device.
      operationId: refreshToken
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Missing refresh_token
        '403':
          description: >-
            Invalid, expired, unknown or replayed refresh token; device signed
            out (`device_revoked`); account blocked (`account_blocked`)

  # ─── Auth: Password sign-in ───────────────────────────────────
  /accounts/password/params:
    post:
      summary: Look up whether a phone number has an account and password, and its KDF parameters
      description: >-
        Public and rate limited per IP. The app stretches the password with
        Argon2id using `kdf_params` and `kdf_salt`, then derives an auth key
        (sent) and a wrap key (never sent).
      operationId: getPasswordParams
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_hash]
              properties:
                phone_hash:
                  type: string
      responses:
        '200':
          description: Password parameters
          content:
            application/json:
              schema:
                type: object
                required: [account_exists, has_password]
                properties:
                  account_exists:
                    type: boolean
                  has_password:
                    type: boolean
                  kdf_params:
                    $ref: '#/components/schemas/PasswordKdfParams'
                  kdf_salt:
                    type: string
                    description: Base64url salt; present only when has_password is true
        '400':
          description: Missing phone_hash
        '403':
          description: Phone number blocked (`phone_blocked`)
        '429':
          description: Too many attempts from this IP (`quota_exceeded`)

  /accounts/password/login:
    post:
      summary: Sign a new device in with phone number and password
      description: >-
        Registers the device next to the account's existing devices (nobody
        is signed out) and returns the wrapped identity key so the device can
        unlock the account identity. `device_signature` is an Ed25519
        signature, by the new device signing key, over the newline-joined
        transcript `helix.remote.password-login.v1`, phone_hash, device_id,
        device_signing_public_key, device_agreement_public_key, device_name.
        Five wrong passwords lock the account for 15 minutes, doubling up to
        24 hours.
      operationId: passwordLogin
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone_hash
                - auth_key
                - device_id
                - device_name
                - device_signing_public_key
                - device_agreement_public_key
                - device_signature
              properties:
                phone_hash:
                  type: string
                auth_key:
                  type: string
                  description: Base64url password auth key (32 bytes)
                device_id:
                  type: string
                  maxLength: 128
                device_name:
                  type: string
                  minLength: 1
                  maxLength: 80
                device_signing_public_key:
                  type: string
                  description: Base64url Ed25519 public key
                device_agreement_public_key:
                  type: string
                  description: Base64url X25519 public key
                device_signature:
                  type: string
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    required: [account_id, device_id, account_identity_public_key, wrapped_identity_key]
                    properties:
                      account_id:
                        type: string
                      device_id:
                        type: string
                      account_identity_public_key:
                        type: string
                      wrapped_identity_key:
                        type: string
                        description: AES-256-GCM ciphertext of the identity private key under the wrap key
                      display_name:
                        type: string
        '400':
          description: Missing or invalid sign-in fields or device keys
        '403':
          description: >-
            Wrong phone number or password (`password_incorrect`, with
            `details.attempts_before_lockout`), phone blocked (`phone_blocked`),
            account blocked (`account_blocked`), device signature invalid
        '409':
          description: Device id already registered
        '429':
          description: >-
            IP rate limit (`quota_exceeded`) or account locked
            (`password_locked`, with `details.locked_until` in ms)

  /accounts/password/verify:
    post:
      summary: Check a password without signing in
      description: Counts toward the same lockout as a real sign-in.
      operationId: passwordVerify
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_hash, auth_key]
              properties:
                phone_hash:
                  type: string
                auth_key:
                  type: string
      responses:
        '200':
          description: Password is correct
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid:
                    type: boolean
                    enum: [true]
        '400':
          description: Missing phone_hash or auth_key
        '403':
          description: Wrong phone number or password (`password_incorrect`)
        '429':
          description: IP rate limit (`quota_exceeded`) or account locked (`password_locked`)

  /accounts/password:
    get:
      summary: Whether the signed-in account has a password
      operationId: getPasswordStatus
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Password status
          content:
            application/json:
              schema:
                type: object
                required: [has_password, default_kdf_params]
                properties:
                  has_password:
                    type: boolean
                  updated_at:
                    type: integer
                    format: int64
                  default_kdf_params:
                    $ref: '#/components/schemas/PasswordKdfParams'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Set the first password, or change it
      description: >-
        Setting the first password needs only the session. Changing an
        existing one also needs `current_auth_key`, or `otp_code` (plus
        optional `otp_challenge_id`) for the account's phone number. The
        identity key is unchanged, so no device is signed out. KDF params must
        be argon2id, memory_kib 19456..262144, iterations 1..10, parallelism
        1..4, length 64.
      operationId: setPassword
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kdf_params, kdf_salt, auth_key, wrapped_identity_key]
              properties:
                kdf_params:
                  $ref: '#/components/schemas/PasswordKdfParams'
                kdf_salt:
                  type: string
                  description: Base64url, 16-64 bytes
                auth_key:
                  type: string
                  description: Base64url, exactly 32 bytes
                wrapped_identity_key:
                  type: string
                  maxLength: 2048
                current_auth_key:
                  type: string
                otp_code:
                  type: string
                otp_challenge_id:
                  type: string
      responses:
        '200':
          description: Password stored
          content:
            application/json:
              schema:
                type: object
                required: [has_password]
                properties:
                  has_password:
                    type: boolean
        '400':
          description: Invalid password fields
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Current password wrong or missing (`password_incorrect`), OTP
            failed (`invalid_otp`), account has no phone number
        '404':
          description: Account not found
        '429':
          description: Account locked (`password_locked`)

  # ─── Auth: Account recovery ───────────────────────────────────
  /accounts/recovery/lookup:
    post:
      summary: Check a recovery code without redeeming it
      description: >-
        Public, rate limited per IP. An unknown or wrong code is reported as
        `valid: false` with 200, never as an error.
      operationId: lookupRecoveryCode
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, recovery_code]
              properties:
                account_id:
                  type: string
                recovery_code:
                  type: string
                phone_hash:
                  type: string
                  description: Optional; when sent the response says whether it is the account's number
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid:
                    type: boolean
                  reason:
                    type: string
                    enum: [invalid, blocked]
                  server_name:
                    type: string
                  sms_required:
                    type: boolean
                    description: True when redeem will require an SMS OTP
                  phone_matches:
                    type: boolean
        '400':
          description: Missing account_id or recovery_code
        '429':
          description: Too many recovery code lookups (`quota_exceeded`)

  /accounts/recovery/redeem:
    post:
      summary: Redeem a recovery code and reset the account onto this device
      description: >-
        Revokes every other device and its refresh tokens, optionally rotates
        the account identity key, registers this device and signs it in. A
        suspended account is reactivated. When the server has an SMS provider,
        `otp_code` (and preferably `otp_challenge_id`) for `phone_hash` is
        required.
      operationId: redeemRecoveryCode
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account_id
                - recovery_code
                - phone_hash
                - device_id
                - device_signing_public_key
                - device_agreement_public_key
              properties:
                account_id:
                  type: string
                recovery_code:
                  type: string
                phone_hash:
                  type: string
                  description: Must equal the account's phone hash
                otp_code:
                  type: string
                otp_challenge_id:
                  type: string
                device_id:
                  type: string
                device_signing_public_key:
                  type: string
                device_agreement_public_key:
                  type: string
                device_name:
                  type: string
                  default: Recovered Device
                account_identity_public_key:
                  type: string
                  description: New identity key; the old one is kept when omitted
      responses:
        '200':
          description: Account recovered onto this device
          content:
            application/json:
              schema:
                type: object
                required: [account_id, device_id, access_token, refresh_token, token_type, expires_in]
                properties:
                  account_id:
                    type: string
                  device_id:
                    type: string
                  access_token:
                    type: string
                    description: Session access token (named `token` in other sign-in responses)
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                    description: Access token lifetime in seconds
                  display_name:
                    type: string
                  identity_public_key:
                    type: string
        '400':
          description: Missing required fields
        '401':
          description: Invalid or expired recovery code
        '403':
          description: >-
            Account blocked, phone number does not match the account, or OTP
            missing/failed (`invalid_otp`)
        '404':
          description: Account not found

  # ─── Auth: Devices ────────────────────────────────────────────
  /accounts/devices:
    get:
      summary: List every device of the authenticated account (active and revoked)
      operationId: listDevices
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Device list, most recently seen first
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/devices/rename:
    post:
      summary: Rename one of the account's active devices
      operationId: renameDevice
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, device_name]
              properties:
                device_id:
                  type: string
                device_name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          description: Device renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid device rename request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Device is inactive

  /accounts/devices/security-history:
    get:
      summary: Security events (sign-ins, links, revocations) for one device
      operationId: getDeviceSecurityHistory
      tags: [Auth]
      security:
        - BearerAuth: []
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        device_id:
                          type: string
                        reason:
                          type: string
                        timestamp:
                          type: integer
                          format: int64
        '400':
          description: Missing device_id
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/devices/revoke:
    post:
      summary: Revoke (sign out) a specific device
      operationId: revokeDevice
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing device_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot revoke the final active device without recovery

  /accounts/devices/revoke-others:
    post:
      summary: Sign out every other active device of the account
      operationId: revokeOtherDevices
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Other devices signed out
          content:
            application/json:
              schema:
                type: object
                required: [revoked_count]
                properties:
                  revoked_count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/devices/link/request:
    post:
      summary: Request linking a new device from an active device
      operationId: requestDeviceLink
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, device_public_key, device_name]
              properties:
                device_id:
                  type: string
                device_public_key:
                  type: string
                device_name:
                  type: string
      responses:
        '200':
          description: Link request created
          content:
            application/json:
              schema:
                type: object
                required: [link_id, verification_code, status]
                properties:
                  link_id:
                    type: string
                  verification_code:
                    type: string
                  status:
                    type: string
                    enum: [PENDING]
        '400':
          description: Missing device link fields
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Calling device inactive, or device id already registered

  /accounts/devices/link/request-new:
    post:
      summary: Start linking from a fresh device without creating another account
      description: >-
        Public: the new device has no session yet. Gated by the verification
        code, a 10-minute TTL and approval from an existing trusted device.
      operationId: requestNewDeviceLink
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account_id
                - device_id
                - device_name
                - device_signing_public_key
                - device_agreement_public_key
              properties:
                account_id:
                  type: string
                device_id:
                  type: string
                device_name:
                  type: string
                device_signing_public_key:
                  type: string
                device_agreement_public_key:
                  type: string
      responses:
        '200':
          description: Short-lived pending link created
          content:
            application/json:
              schema:
                type: object
                required: [link_id, verification_code, expires_at, status, qr_payload]
                properties:
                  link_id:
                    type: string
                  verification_code:
                    type: string
                  expires_at:
                    type: integer
                    format: int64
                  status:
                    type: string
                    enum: [PENDING]
                  qr_payload:
                    type: string
        '400':
          description: Missing device link fields or invalid device public keys
        '403':
          description: Account not found, no trusted device can approve, or device id already registered

  /accounts/devices/link/verify:
    post:
      summary: Approve a pending device link using out-of-band code
      operationId: verifyDeviceLink
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_id, verification_code]
              properties:
                link_id:
                  type: string
                verification_code:
                  type: string
      responses:
        '200':
          description: Link verified
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [APPROVED]
                  approval_transcript:
                    type: string
                  approval_transcript_hash:
                    type: string
        '400':
          description: Missing link_id or verification_code
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Verification failed

  /accounts/devices/link/reject:
    post:
      summary: Reject a pending device link using the out-of-band code
      operationId: rejectDeviceLink
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_id, verification_code]
              properties:
                link_id:
                  type: string
                verification_code:
                  type: string
      responses:
        '200':
          description: Link rejected
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [REJECTED]
        '400':
          description: Missing link_id or verification_code
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Rejection failed

  /accounts/devices/link/complete:
    post:
      summary: Complete the device link process from the approving device
      operationId: completeDeviceLink
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_id]
              properties:
                link_id:
                  type: string
      responses:
        '200':
          description: Device linked
          content:
            application/json:
              schema:
                type: object
                required: [status, device_id]
                properties:
                  status:
                    type: string
                    enum: [LINKED]
                  device_id:
                    type: string
        '400':
          description: Missing link_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Link not approved or already completed

  /accounts/devices/link/complete-new:
    post:
      summary: Complete a trusted device link from the fresh device
      description: Public, like request-new.
      operationId: completeNewDeviceLink
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_id, signature]
              properties:
                link_id:
                  type: string
                signature:
                  type: string
                  description: New device's Ed25519 signature over the approval transcript
      responses:
        '200':
          description: Device linked and session tokens issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    required: [status, account_id, device_id]
                    properties:
                      status:
                        type: string
                        enum: [LINKED]
                      account_id:
                        type: string
                      device_id:
                        type: string
                      message:
                        type: string
        '400':
          description: Missing link_id or signature
        '403':
          description: Link not approved, expired, already completed, or signature invalid

  /accounts/devices/lost-device:
    post:
      summary: Report a lost device, revoke it and purge its data
      operationId: reportLostDevice
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
      responses:
        '200':
          description: Lost device revoked
          content:
            application/json:
              schema:
                type: object
                required: [message, device_id]
                properties:
                  message:
                    type: string
                  device_id:
                    type: string
        '400':
          description: Missing device_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Device cannot be revoked (e.g. the final active device)

  /accounts/devices/push-token:
    put:
      summary: Register or refresh the FCM/APNs push token for the authenticated device
      operationId: updateDevicePushToken
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token]
              properties:
                push_token:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: FCM or APNs device registration token. Looked up at delivery time; never stored in the outbox payload.
      responses:
        '200':
          description: Push token updated
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: updated
        '400':
          description: Invalid push_token (empty or over 256 characters)
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Auth: Phone OTP & invites ────────────────────────────────
  /accounts/phone/otp/request:
    post:
      summary: >-
        Request a one-time verification code for a phone number, identified
        in the challenge only by its salted hash. The raw `phone_number` is
        used transiently for SMS delivery (never persisted) and the response
        never contains the code.
      description: Limited to 5 requests per hour per phone hash.
      operationId: requestPhoneOtp
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_hash]
              properties:
                phone_hash:
                  type: string
                phone_number:
                  type: string
                  description: >-
                    E.164 phone number. Required only when the server has an
                    SMS provider configured; must hash (with the deployment's
                    discovery salt) to phone_hash.
      responses:
        '200':
          description: Verification challenge issued and SMS delivery requested
          content:
            application/json:
              schema:
                type: object
                required: [challenge_id, expires_at]
                properties:
                  challenge_id:
                    type: string
                  expires_at:
                    type: integer
                    format: int64
        '400':
          description: >-
            Missing phone_hash or phone_number; phone_number does not hash to
            phone_hash with the current salt (`discovery_salt_stale` - re-fetch
            the salt and retry once)
        '403':
          description: Phone number blocked (`phone_blocked`)
        '429':
          description: Too many verification code requests (`quota_exceeded`)
        '502':
          description: SMS gateway rejected or failed the send (`sms_delivery_failed`)
        '503':
          description: SMS delivery is not configured (`sms_delivery_failed`)

  /accounts/phone/otp/verify:
    post:
      summary: Verify a phone OTP without consuming the challenge
      operationId: verifyPhoneOtp
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_hash, otp_code]
              properties:
                phone_hash:
                  type: string
                otp_code:
                  type: string
                  minLength: 6
                  maxLength: 6
                challenge_id:
                  type: string
                  description: >-
                    Optional challenge returned by /accounts/phone/otp/request.
                    When supplied, registration must verify this exact challenge.
      responses:
        '200':
          description: OTP is valid; registration will consume it atomically
          content:
            application/json:
              schema:
                type: object
                required: [valid, challenge_id]
                properties:
                  valid:
                    type: boolean
                  challenge_id:
                    type: string
        '400':
          description: >-
            Missing fields, or invalid, expired, consumed or exhausted OTP
            challenge (`invalid_otp`)

  /accounts/invite/lookup:
    post:
      summary: >-
        Validate an invite code without consuming it, so the client can fail
        fast on a bad/expired code before starting the phone+OTP signup flow.
      description: >-
        Current form; keeps the code out of access logs. Rate limited per IP.
      operationId: lookupInvite
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/InviteLookupResult'
        '400':
          description: Missing invite_code
        '429':
          description: Too many invite lookup attempts (`quota_exceeded`)
    get:
      summary: Validate an invite code (legacy query-string form)
      description: Retained for clients predating the POST form.
      operationId: lookupInviteLegacy
      deprecated: true
      tags: [Auth]
      parameters:
        - name: invite_code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/InviteLookupResult'
        '400':
          description: Missing invite_code
        '429':
          description: Too many invite lookup attempts (`quota_exceeded`)

  /accounts/invite/auto-issue:
    post:
      summary: >-
        Self-issues a free invite for Helix Global's signup path. Gated
        server-side by whether this deployment is actually Helix Global -
        a self-hosted server always rejects this regardless of what the
        client claims.
      operationId: autoIssueInvite
      tags: [Auth]
      responses:
        '200':
          description: Invite issued
          content:
            application/json:
              schema:
                type: object
                required: [invite_code, expires_at]
                properties:
                  invite_code:
                    type: string
                  expires_at:
                    type: integer
                    format: int64
        '403':
          description: This server is not Helix Global
        '429':
          description: Too many invite requests from this address

  # ─── Auth: Profile ────────────────────────────────────────────
  /accounts/profile:
    get:
      summary: Read the authenticated account's display name
      operationId: getProfile
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [account_id, display_name]
                properties:
                  account_id:
                    type: string
                  display_name:
                    type: string
                  next_display_name_change_allowed_at:
                    type: integer
                    format: int64
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Update the display name of the authenticated account
      description: >-
        The display name can change at most once every 30 days. Sibling
        devices receive a `profile_updated` realtime event.
      operationId: updateProfile
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    type: object
                    required:
                      - account_id
                      - display_name
                      - updated_at
                      - profile_version
                    properties:
                      account_id:
                        type: string
                      display_name:
                        type: string
                      updated_at:
                        type: integer
                        format: int64
                      profile_version:
                        type: integer
                      display_name_changed_at:
                        type: integer
                        format: int64
        '400':
          description: Invalid display_name
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account suspended (`account_suspended`)
        '429':
          description: >-
            Display name changed less than 30 days ago. Body is
            `{error, next_allowed_at}` (ms), without a `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  next_allowed_at:
                    type: integer
                    format: int64

  # ─── Prekeys ──────────────────────────────────────────────────
  /prekeys/publish:
    post:
      summary: Publish the calling device's signed prekey and one-time prekeys
      operationId: publishPreKeys
      tags: [Prekeys]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrekeyPublishRequest'
      responses:
        '200':
          description: Prekeys published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing prekey publication fields
        '401':
          $ref: '#/components/responses/Unauthorized'

  /prekeys/bundle:
    get:
      summary: Get prekey bundles for every active device of an account to establish E2EE
      description: >-
        Claims one one-time prekey per device. An `account@domain` id for
        another server is fetched from that server over federation.
      operationId: getPreKeyBundle
      tags: [Prekeys]
      security:
        - BearerAuth: []
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Prekey bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreKeyBundleResponse'
        '400':
          description: Missing account_id parameter
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No active devices found for this account
        '503':
          description: Remote account requested but federation is not configured

  # ─── Contacts ─────────────────────────────────────────────────
  # The request/accept flow below documents the code as of 2026-09-29 and is
  # expected to change.
  /contacts/discovery-salt:
    get:
      summary: >-
        Get the per-deployment, non-secret discovery salt used to hash
        phone numbers for privacy-preserving contact matching. Unauthenticated:
        needed before an account exists (signup) and by contacts sync.
        Self-heals on first call; never rotated afterward.
      description: Rate limited to 60 requests per minute per IP.
      operationId: getContactsDiscoverySalt
      tags: [Contacts]
      responses:
        '200':
          description: Discovery salt
          content:
            application/json:
              schema:
                type: object
                required: [salt, algorithm, iterations]
                properties:
                  salt:
                    type: string
                    description: Base64-encoded 32-byte salt.
                  algorithm:
                    type: string
                    example: hardened_hmac_sha256
                  iterations:
                    type: integer
                    example: 10000
        '429':
          description: Discovery salt request quota exceeded (`quota_exceeded`)

  /contacts/:
    get:
      summary: List contacts (accepted, blocked) of the authenticated account
      operationId: listContacts
      tags: [Contacts]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Contact list
          content:
            application/json:
              schema:
                type: object
                required: [contacts]
                properties:
                  contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        peer_account_id:
                          type: string
                        nickname:
                          type: string
                          nullable: true
                        status:
                          type: string
                          example: ACCEPTED
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/requests:
    get:
      summary: List contact requests sent or received by the account, any status, newest first
      operationId: listContactRequests
      tags: [Contacts]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Contact requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      properties:
                        request_id:
                          type: string
                        requester_account_id:
                          type: string
                        target_account_id:
                          type: string
                        status:
                          type: string
                          example: PENDING
                        created_at:
                          type: integer
                          format: int64
                        updated_at:
                          type: integer
                          format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Send a contact request
      description: >-
        At most 20 requests per account per day. Both sides receive a
        `contact_updated` device event (PendingSent / PendingReceived).
      operationId: sendContactRequest
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      responses:
        '200':
          description: Request sent
          content:
            application/json:
              schema:
                type: object
                required: [request_id, peer_account_id]
                properties:
                  request_id:
                    type: string
                  peer_account_id:
                    type: string
        '400':
          description: Cannot contact yourself
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Contact unavailable (blocked either way), a request is already
            pending (403 with code `conflict`), or account suspended
            (`account_suspended`)
        '404':
          description: Peer account not found (or peer_account_id missing)
        '429':
          description: Daily request quota exceeded (`quota_exceeded`)

  /contacts/requests/accept:
    post:
      summary: Accept a pending contact request (target only)
      operationId: acceptContactRequest
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ContactRequestId'
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing request_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the request's target, or account suspended
        '404':
          description: Request not found

  /contacts/requests/reject:
    post:
      summary: Reject a pending contact request (target only)
      operationId: rejectContactRequest
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ContactRequestId'
      responses:
        '200':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing request_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the request's target
        '404':
          description: Request not found

  /contacts/requests/cancel:
    post:
      summary: Cancel an outgoing contact request (requester only)
      operationId: cancelContactRequest
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ContactRequestId'
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing request_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the requester
        '404':
          description: Request not found

  /contacts/add:
    post:
      summary: Add a contact directly (no request/consent step)
      operationId: addContact
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_account_id]
              properties:
                peer_account_id:
                  type: string
                nickname:
                  type: string
      responses:
        '200':
          description: Contact added
          content:
            application/json:
              schema:
                type: object
                required: [message, peer_account_id]
                properties:
                  message:
                    type: string
                  peer_account_id:
                    type: string
                  nickname:
                    type: string
                    nullable: true
        '400':
          description: Missing peer_account_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account suspended (`account_suspended`)
        '404':
          description: Peer account not found

  /contacts/remove:
    post:
      summary: Remove a contact
      operationId: removeContact
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/PeerAccountId'
      responses:
        '200':
          description: Contact removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing peer_account_id
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/block:
    post:
      summary: Block a contact
      operationId: blockContact
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/PeerAccountId'
      responses:
        '200':
          description: Contact blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing peer_account_id
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/unblock:
    post:
      summary: Unblock a contact
      operationId: unblockContact
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/PeerAccountId'
      responses:
        '200':
          description: Contact unblocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing peer_account_id
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/search:
    get:
      summary: Fuzzy search for discoverable users by display name
      description: >-
        Queries shorter than 3 characters return an empty list. Limited to 30
        searches per account per minute.
      operationId: searchContacts
      tags: [Contacts]
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Display-name search results ranked by similarity
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      required: [account_id, display_name, similarity]
                      properties:
                        account_id:
                          type: string
                        display_name:
                          type: string
                        similarity:
                          type: number
                          format: double
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Search quota exceeded (`quota_exceeded`)

  /contacts/match:
    post:
      summary: >-
        Batch phone-contact discovery: given a set of salted phone hashes
        (see GET /contacts/discovery-salt), returns which belong to
        registered, phone-discoverable accounts. Authenticated and
        rate-limited - even hashed, this is an oracle for "is phone number X
        a Helix user" to anyone who can call it.
      description: >-
        Each account has a daily budget of 5000 hashes. A `full_sync` whose
        hash set is unchanged since the last full sync is answered from cache
        and charged nothing (`unchanged: true`). When the budget runs out part
        way, only the first hashes are looked up and `partial` is true.
      operationId: matchContactPhoneHashes
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_hashes]
              properties:
                phone_hashes:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
                full_sync:
                  type: boolean
                  default: false
      responses:
        '200':
          description: >-
            Matches keyed by phone hash - hashes with no match, or that
            belong to a non-discoverable account, are simply absent.
          content:
            application/json:
              schema:
                type: object
                required: [matches, hashes_charged, hashes_remaining_today]
                properties:
                  matches:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        account_id:
                          type: string
                        display_name:
                          type: string
                  hashes_charged:
                    type: integer
                  hashes_remaining_today:
                    type: integer
                  partial:
                    type: boolean
                  unchanged:
                    type: boolean
                  retry_after_seconds:
                    type: integer
        '400':
          description: Missing phone_hashes, or batch exceeds 1000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: >-
            Daily discovery budget exhausted (`quota_exceeded`, with
            `details.hashes_remaining_today` and `details.retry_after_seconds`)

  /contacts/people:
    post:
      summary: Display names (and phone numbers, once in touch) for account ids seen in chats and calls
      description: >-
        Uncommitted in the working tree as of 2026-09-29. The phone number is
        returned only when the caller shares a conversation or a call with
        that account. Unknown, blocked-status accounts, the caller itself and
        accounts that blocked the caller are omitted.
      operationId: lookupContactPeople
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_ids]
              properties:
                account_ids:
                  type: array
                  maxItems: 200
                  items:
                    type: string
      responses:
        '200':
          description: People
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      required: [account_id, display_name]
                      properties:
                        account_id:
                          type: string
                        display_name:
                          type: string
                        phone_number:
                          type: string
        '400':
          description: account_ids is not a list, or has more than 200 ids
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/sync:
    post:
      summary: Record the account ids in the user's phone book as one-sided contacts
      description: >-
        Uncommitted in the working tree as of 2026-09-29. Only ids are sent.
        Unknown ids, existing contacts and accounts the caller blocked are
        skipped.
      operationId: syncSavedContacts
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peer_account_ids]
              properties:
                peer_account_ids:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
      responses:
        '200':
          description: Contacts added
          content:
            application/json:
              schema:
                type: object
                required: [added]
                properties:
                  added:
                    type: integer
        '400':
          description: peer_account_ids is not a list, or has more than 1000 ids
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/privacy:
    get:
      summary: Get privacy settings
      operationId: getPrivacySettings
      tags: [Contacts]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Privacy settings
          content:
            application/json:
              schema:
                type: object
                required: [privacy]
                properties:
                  privacy:
                    $ref: '#/components/schemas/PrivacySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Replace privacy settings
      description: >-
        Not a partial update: an omitted `search_discoverable` becomes true
        and an omitted visibility becomes CONTACTS. Only `phone_discoverable`
        is left unchanged when omitted. An unknown visibility value is not
        validated as a 400 and currently surfaces as a 500.
      operationId: updatePrivacySettings
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                search_discoverable:
                  type: boolean
                  default: true
                presence_visibility:
                  $ref: '#/components/schemas/Visibility'
                last_seen_visibility:
                  $ref: '#/components/schemas/Visibility'
                phone_discoverable:
                  type: boolean
                  description: Omit to leave the current value unchanged.
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                required: [privacy]
                properties:
                  privacy:
                    $ref: '#/components/schemas/PrivacySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Invalid visibility value (unvalidated FormatException)

  /contacts/presence:
    post:
      summary: Send presence heartbeat (updates the device's last-seen time)
      operationId: presenceHeartbeat
      tags: [Contacts]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Heartbeat received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/presence/{accountId}:
    get:
      summary: Get presence of an account as visible to the caller
      operationId: getPresence
      tags: [Contacts]
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >-
            Presence, or `presence: null` when hidden by the target's privacy
            settings or never seen
          content:
            application/json:
              schema:
                type: object
                required: [presence]
                properties:
                  presence:
                    type: object
                    nullable: true
                    properties:
                      account_id:
                        type: string
                      presence:
                        type: string
                        enum: [RECENTLY_ACTIVE]
                      last_seen_at:
                        type: integer
                        format: int64
                        nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/report:
    post:
      summary: Report an account (no message plaintext allowed)
      operationId: reportContact
      tags: [Contacts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_account_id, category, reason_code]
              properties:
                subject_account_id:
                  type: string
                category:
                  type: string
                reason_code:
                  type: string
                context_hash:
                  type: string
                  description: Hash of the reported context; plaintext is refused
                report_id:
                  type: string
                  description: Client-chosen id; generated when omitted
      responses:
        '200':
          description: Report submitted
          content:
            application/json:
              schema:
                type: object
                required: [report_id]
                properties:
                  report_id:
                    type: string
        '400':
          description: Missing report fields, or body contains message_text/plaintext
        '401':
          $ref: '#/components/responses/Unauthorized'

  /contacts/reports/action:
    post:
      summary: Record a safety action on a report (admin accounts only)
      operationId: takeReportAction
      tags: [Contacts]
      security:
        - BearerAuth: []
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_id, action]
              properties:
                report_id:
                  type: string
                action:
                  type: string
                action_id:
                  type: string
      responses:
        '200':
          description: Action recorded
          content:
            application/json:
              schema:
                type: object
                required: [action_id]
                properties:
                  action_id:
                    type: string
        '400':
          description: Missing safety action fields
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin privileges required

  # ─── Messages ─────────────────────────────────────────────────
  /messages/conversations/create:
    post:
      summary: Create (or replace) a DIRECT conversation
      description: >-
        GROUP conversations are refused here; use POST /groups/create. The
        caller is added to `members` if absent. The store uses INSERT OR
        REPLACE, so posting an existing `conversation_id` resets it and
        replaces its member list.
      operationId: createConversation
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, type, members]
              properties:
                conversation_id:
                  type: string
                type:
                  type: string
                  enum: [DIRECT]
                title:
                  type: string
                members:
                  type: array
                  description: Member account ids
                  items:
                    type: string
      responses:
        '200':
          description: Conversation created
          content:
            application/json:
              schema:
                type: object
                required: [message, conversation_id]
                properties:
                  message:
                    type: string
                  conversation_id:
                    type: string
        '400':
          description: Missing conversation fields, or type GROUP
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account suspended (`account_suspended`)

  /messages/send:
    post:
      summary: Send a message as one ciphertext envelope per recipient device
      description: >-
        The request must carry an envelope for every active device of every
        member (except the sending device and members who blocked the
        sender). Envelopes for recently retired devices of members are
        silently dropped. Envelopes addressed to `account@other-domain` are
        relayed over federation. Re-sending an accepted `message_id` returns
        200 with `idempotent: true`.
      operationId: sendMessage
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSendRequest'
      responses:
        '200':
          description: Message accepted (or already accepted)
          content:
            application/json:
              schema:
                type: object
                required: [message, sequence]
                properties:
                  message:
                    type: string
                  sequence:
                    type: integer
                  envelopes_count:
                    type: integer
                  federated_envelopes_count:
                    type: integer
                  message_id:
                    type: string
                    description: Present on an idempotent replay
                  idempotent:
                    type: boolean
        '400':
          description: >-
            Missing fields, empty envelopes, an envelope without
            recipient_device_id/ciphertext, or an envelope carrying
            plaintext/message_text/body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Not a member (`not_a_member`), envelope targets a non-member
            device or server, recipient mailbox full (`quota_exceeded`,
            5000 outstanding), or account suspended (`account_suspended`)
        '409':
          description: >-
            The sender's device list is stale (`device_list_stale`): refetch
            prekey bundles, re-encrypt and resend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListStaleError'
        '503':
          description: Federated envelopes present but federation is not configured

  /messages/sync:
    get:
      summary: Fetch queued messages for the calling device
      description: >-
        With `conversation_id`, returns that conversation's messages for this
        device after `since_sequence`. Without it, returns every offline
        message queued for the device.
      operationId: syncMessages
      tags: [Messages]
      security:
        - BearerAuth: []
      parameters:
        - name: conversation_id
          in: query
          required: false
          schema:
            type: string
        - name: since_sequence
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Synced messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of the conversation (`not_a_member`)

  /messages/cursor:
    post:
      summary: Update the calling device's sync cursor for a conversation
      operationId: updateCursor
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, sequence]
              properties:
                conversation_id:
                  type: string
                sequence:
                  type: integer
      responses:
        '200':
          description: Cursor updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing cursor update fields
        '401':
          $ref: '#/components/responses/Unauthorized'

  /messages/delete:
    post:
      summary: Delete one of the caller's own messages for everyone
      operationId: deleteMessage
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id:
                  type: string
      responses:
        '200':
          description: Message deleted
          content:
            application/json:
              schema:
                type: object
                required: [message, message_id]
                properties:
                  message:
                    type: string
                  message_id:
                    type: string
        '400':
          description: Missing message_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the sender, or account suspended
        '404':
          description: Message not found

  /messages/edit:
    post:
      summary: Edit an encrypted message by publishing a replacement ciphertext
      operationId: editMessage
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id, conversation_id, ciphertext]
              properties:
                message_id:
                  type: string
                conversation_id:
                  type: string
                revision_id:
                  type: string
                  description: Generated when omitted
                ciphertext:
                  type: string
      responses:
        '200':
          description: Edit accepted
          content:
            application/json:
              schema:
                type: object
                required: [message, message_id, revision_id]
                properties:
                  message:
                    type: string
                  message_id:
                    type: string
                  revision_id:
                    type: string
        '400':
          description: Missing edit fields
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the sender, not a member (`not_a_member`), or account suspended
        '404':
          description: Message not found in that conversation

  /messages/reactions:
    post:
      summary: Add an encrypted-message reaction event
      operationId: addReaction
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id, reaction]
              properties:
                message_id:
                  type: string
                revision_id:
                  type: string
                reaction:
                  type: string
      responses:
        '200':
          description: Reaction accepted
          content:
            application/json:
              schema:
                type: object
                required: [message, revision_id]
                properties:
                  message:
                    type: string
                  revision_id:
                    type: string
        '400':
          description: Missing reaction fields
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member (`not_a_member`), or account suspended
        '404':
          description: Message not found

  /messages/receipts:
    post:
      summary: Publish a delivery or read receipt
      description: The server fills account_id and device_id from the session.
      operationId: publishReceipt
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id, conversation_id, receipt_type]
              properties:
                message_id:
                  type: string
                conversation_id:
                  type: string
                account_id:
                  type: string
                  description: Ignored; taken from the session
                device_id:
                  type: string
                  description: Ignored; taken from the session
                receipt_type:
                  type: string
                  enum: [DELIVERY, READ]
      responses:
        '200':
          description: Receipt accepted
          content:
            application/json:
              schema:
                type: object
                required: [message, receipt_id]
                properties:
                  message:
                    type: string
                  receipt_id:
                    type: string
        '400':
          description: Missing receipt fields or invalid receipt_type
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sender is not a conversation member (`not_a_member`)

  /messages/typing:
    post:
      summary: Publish transient typing state (not persisted)
      operationId: publishTyping
      tags: [Messages]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, is_typing]
              properties:
                conversation_id:
                  type: string
                account_id:
                  type: string
                  description: Ignored; taken from the session
                device_id:
                  type: string
                  description: Ignored; taken from the session
                is_typing:
                  type: boolean
      responses:
        '200':
          description: Typing state accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing typing fields
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sender is not a conversation member (`not_a_member`), or account suspended

  /messages/device-events:
    get:
      summary: Fetch durable device events (receipts, contact, device and group events) after a sequence
      operationId: getDeviceEvents
      tags: [Messages]
      security:
        - BearerAuth: []
      parameters:
        - name: since_sequence
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Events for the calling device in sequence order
          content:
            application/json:
              schema:
                type: object
                required: [events, device_id]
                properties:
                  device_id:
                    type: string
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Attachments ──────────────────────────────────────────────
  /attachments/upload:
    post:
      summary: Reserve an upload slot for an encrypted attachment
      description: >-
        Content-addressed: `file_id` equals `file_hash`. When the same
        ciphertext is already stored and complete, the caller is simply
        granted access and `status: COMPLETED` is returned (nothing to upload).
      operationId: requestAttachmentUpload
      tags: [Attachments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
      responses:
        '200':
          description: Upload target
          content:
            application/json:
              schema:
                type: object
                required: [file_id, upload_url, headers]
                properties:
                  file_id:
                    type: string
                  upload_url:
                    type: string
                    description: Server-relative path, e.g. /api/v1/attachments/upload/file/{fileId}
                  status:
                    type: string
                    enum: [COMPLETED]
                    description: Present only when the content is already stored
                  headers:
                    type: object
                    additionalProperties:
                      type: string
        '400':
          description: >-
            Missing file_size or file_hash, file too large (details
            `max_attachment_bytes`), or account storage quota exceeded (400 with
            code `quota_exceeded`, details `account_quota_bytes`,
            `account_bytes_used`)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account suspended (`account_suspended`)

  /attachments/upload/status/{fileId}:
    get:
      summary: Check how many bytes of an upload the server holds (for resume)
      operationId: getUploadStatus
      tags: [Attachments]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Upload status
          content:
            application/json:
              schema:
                type: object
                required: [file_id, uploaded_bytes, file_size, status]
                properties:
                  file_id:
                    type: string
                  uploaded_bytes:
                    type: integer
                  file_size:
                    type: integer
                  status:
                    type: string
                    enum: [UPLOADING, COMPLETED]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Attachment belongs to another account
        '404':
          description: Attachment not found

  /attachments/upload/file/{fileId}:
    put:
      summary: Upload attachment ciphertext bytes, optionally resuming at an offset
      description: >-
        Offset 0 (re)starts the upload. When the stored size reaches
        `file_size` the SHA-256 is verified and the attachment completes.
      operationId: uploadFileChunk
      tags: [Attachments]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Bytes stored
          content:
            application/json:
              schema:
                type: object
                required: [file_id, uploaded_bytes, status]
                properties:
                  file_id:
                    type: string
                  uploaded_bytes:
                    type: integer
                  status:
                    type: string
                    enum: [UPLOADING, COMPLETED]
        '400':
          description: >-
            Already completed, resume offset does not match the stored bytes,
            size exceeds the expected size, or hash mismatch
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the uploader, or account suspended
        '404':
          description: Attachment not found

  /attachments/download/{fileId}:
    get:
      summary: Get the download path for an attachment the caller may read
      operationId: requestAttachmentDownload
      tags: [Attachments]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Download URL
          content:
            application/json:
              schema:
                type: object
                required: [download_url]
                properties:
                  download_url:
                    type: string
                    description: Server-relative path to /attachments/download/file/{fileId}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No access grant for this attachment
        '404':
          description: Attachment not found or incomplete

  /attachments/download/file/{fileId}:
    get:
      summary: Download attachment ciphertext (supports a single Range header)
      operationId: downloadFile
      tags: [Attachments]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: Range
          in: header
          required: false
          schema:
            type: string
            example: bytes=0-1023
      responses:
        '200':
          description: Full file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (Range request)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No access grant for this attachment
        '404':
          description: Attachment or file not found
        '416':
          description: 'Range not satisfiable (`Content-Range: bytes */<length>`)'

  /attachments/register-reference:
    post:
      summary: Attach an uploaded file to a sent message, granting every conversation member read access
      operationId: registerAttachmentReference
      tags: [Attachments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id, message_id]
              properties:
                file_id:
                  type: string
                message_id:
                  type: string
      responses:
        '200':
          description: Reference registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing file_id or message_id, or referenced message not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Attachment or message belongs to another account, or account suspended
        '404':
          description: Attachment not found

  # ─── Calls ────────────────────────────────────────────────────
  /calls/turn-credentials:
    get:
      summary: Get TURN server credentials for WebRTC calls
      description: >-
        The `X-Helix-Turn-Refresh-In` response header gives the number of
        seconds after which the client should fetch fresh credentials.
      operationId: getTurnCredentials
      tags: [Calls]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: TURN credentials
          headers:
            X-Helix-Turn-Refresh-In:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required: [urls, username, credential, expires_at]
                properties:
                  url:
                    type: string
                    deprecated: true
                    description: First TURN URL retained for older clients; use urls.
                  username:
                    type: string
                    description: TURN REST API username in expiry:account:device form.
                  credential:
                    type: string
                    description: HMAC-SHA1 credential derived from the server TURN secret.
                  urls:
                    type: array
                    items:
                      type: string
                    example:
                      - turn:turn.example.com:3478?transport=udp
                      - turn:turn.example.com:3478?transport=tcp
                      - turns:turn.example.com:5349?transport=tcp
                  expires_at:
                    type: integer
                    description: Unix timestamp in seconds.
                  clock_skew_tolerance_ms:
                    type: integer
                    example: 30000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: >-
            Per-account or per-device TURN credential quota exceeded
            (`quota_exceeded`, details `account_quota_exceeded`,
            `device_quota_exceeded`)
        '503':
          description: 'TURN is not configured (`service_unavailable`, details `turn_configured: false`)'

  /calls/signal:
    post:
      summary: Send an authenticated call signaling message
      description: >-
        The body may carry the signal inside `payload` or at the top level.
        The HTTP status is derived from the result `status`: delivered,
        partial, queued, duplicate and dropped are 200; no_active_devices and
        answered_elsewhere are 409; rate_limited is 429; expired is 410;
        anything else (rejected) is 400. Every non-200 body is a
        CallSignalResult, not ErrorResponse.
      operationId: relayCallSignal
      tags: [Calls]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id:
                  type: string
                  description: Client-generated request ID used for call signal acknowledgement and deduplication.
                target_account_id:
                  type: string
                  description: Peer account for new offers. The backend resolves all active devices for this account.
                target_device_id:
                  type: string
                  description: Concrete device target for answer, ICE, decline, busy, cancel, or end when required.
                payload:
                  $ref: '#/components/schemas/CallSignalPayload'
      responses:
        '200':
          description: Signal delivered, partially delivered, queued, deduplicated or dropped by media policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallSignalResult'
        '400':
          description: 'Malformed, unauthorized, unknown or unsupported signal (`status: rejected`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallSignalResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account suspended (`account_suspended`)
        '409':
          description: No active callee devices or call already answered elsewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallSignalResult'
        '410':
          description: Call expired or no longer pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallSignalResult'
        '429':
          description: 'Call creation rate limit (`status: rate_limited`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallSignalResult'

  /calls/pending:
    get:
      summary: Fetch short-lived pending incoming calls for the authenticated device
      operationId: getPendingCalls
      tags: [Calls]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pending call list
          content:
            application/json:
              schema:
                type: object
                required: [calls]
                properties:
                  calls:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingCall'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Pending call fetch rate limit exceeded (`quota_exceeded`)

  /calls/pending/{call_id}/accept:
    post:
      summary: Mark a pending call accepted by this device
      description: >-
        Other callee devices are told the call was answered elsewhere. A call
        already answered by another device still returns 200 with the current
        call state.
      operationId: acceptPendingCall
      tags: [Calls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CallId'
      responses:
        '200':
          description: Pending call accepted
          content:
            application/json:
              schema:
                type: object
                required: [status, call_id, call]
                properties:
                  status:
                    type: string
                    enum: [accepted]
                  call_id:
                    type: string
                  call:
                    $ref: '#/components/schemas/PendingCall'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account suspended (`account_suspended`)
        '404':
          description: Pending call not found for this callee device

  /calls/pending/{call_id}/decline:
    post:
      summary: Decline a pending call for this account
      operationId: declinePendingCall
      tags: [Calls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CallId'
      responses:
        '200':
          $ref: '#/components/responses/CallStatusResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pending call not found

  /calls/pending/{call_id}/cancel:
    post:
      summary: Cancel an outgoing pending call from the caller device
      operationId: cancelPendingCall
      tags: [Calls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CallId'
      responses:
        '200':
          $ref: '#/components/responses/CallStatusResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pending call not found

  /calls/pending/{call_id}/expire:
    post:
      summary: Expire a pending call session
      operationId: expirePendingCall
      tags: [Calls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CallId'
      responses:
        '200':
          $ref: '#/components/responses/CallStatusResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pending call not found

  /calls/push-token:
    post:
      summary: Register the calling device's call push token (FCM, APNs or APNs VoIP)
      description: >-
        Separate from PUT /accounts/devices/push-token; this store is the one
        incoming-call pushes use.
      operationId: registerCallPushToken
      tags: [Calls]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [push_token]
              properties:
                push_token:
                  type: string
                  maxLength: 4096
                token_type:
                  type: string
                  enum: [FCM, APNS, APNS_VOIP]
                  default: FCM
      responses:
        '200':
          description: Token registered
          content:
            application/json:
              schema:
                type: object
                required: [status, device_id, token_type]
                properties:
                  status:
                    type: string
                    enum: [registered]
                  device_id:
                    type: string
                  token_type:
                    type: string
        '400':
          description: Invalid JSON, missing/oversized push_token, or bad token_type
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Remove the calling device's call push token
      operationId: deregisterCallPushToken
      tags: [Calls]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token removed
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [deregistered]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /calls/metrics:
    post:
      summary: Upload privacy-safe quality metrics for a finished call
      operationId: uploadCallMetrics
      tags: [Calls]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [call_id]
              properties:
                call_id:
                  type: string
                  maxLength: 128
                connection_type:
                  type: string
                setup_time_ms:
                  type: integer
                reconnect_count:
                  type: integer
                  default: 0
                packet_loss_percent:
                  type: number
                peer_rtt_ms:
                  type: number
                call_outcome:
                  type: string
                duration_seconds:
                  type: integer
                  default: 0
      responses:
        '200':
          description: Metrics recorded
          content:
            application/json:
              schema:
                type: object
                required: [status, metric_id]
                properties:
                  status:
                    type: string
                    enum: [recorded]
                  metric_id:
                    type: string
        '400':
          description: Invalid JSON or missing call_id
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Groups ───────────────────────────────────────────────────
  # Every mutating group route is refused with 403 `account_suspended` for a
  # suspended account (except /groups/leave). For a group homed on another
  # server, most actions are proxied to its home server; a failed proxy call
  # answers 502 `federation_error`.
  /groups/create:
    post:
      summary: Create a group (and its GROUP conversation)
      description: At most 5 groups per account per day.
      operationId: createGroup
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, name]
              properties:
                group_id:
                  type: string
                name:
                  type: string
                  minLength: 1
                encryption_key_id:
                  type: string
                initial_member_ids:
                  type: array
                  description: Account ids; `account@domain` for remote members
                  items:
                    type: string
      responses:
        '200':
          description: Group created
          content:
            application/json:
              schema:
                type: object
                required: [group_id, name, members]
                properties:
                  group_id:
                    type: string
                  name:
                    type: string
                  members:
                    type: array
                    items:
                      type: string
        '400':
          description: Missing group_id or name
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account suspended (`account_suspended`)
        '429':
          description: Group creation quota exceeded (body has no `code`)
        '503':
          description: Remote initial members but federation is not configured

  /groups/info:
    get:
      summary: Get group info (home or federated read-model)
      operationId: getGroupInfo
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdQuery'
      responses:
        '200':
          description: Group info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupInfo'
        '400':
          description: Missing group_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of this group
        '404':
          description: Group not found

  /groups/members:
    get:
      summary: List group members (paged)
      operationId: getGroupMembers
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdQuery'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Group members
          content:
            application/json:
              schema:
                type: object
                required: [members, limit, offset]
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id:
                          type: string
                        role:
                          type: string
                          enum: [ADMIN, MEMBER]
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Missing group_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of this group

  /groups/invite:
    post:
      summary: Invite an account to a group (admins only)
      description: At most 20 invites per hour.
      operationId: inviteToGroup
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_id, group_id, invitee_id]
              properties:
                invite_id:
                  type: string
                group_id:
                  type: string
                invitee_id:
                  type: string
      responses:
        '200':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                required: [invite_id, status]
                properties:
                  invite_id:
                    type: string
                  status:
                    type: string
                    enum: [PENDING]
        '400':
          description: Missing fields, or an open invite already exists for this user
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, invitee blocked from the group, or account suspended
        '404':
          description: Group not found
        '429':
          description: Invite quota exceeded (`quota_exceeded`)
        '503':
          description: Remote invitee but federation is not configured

  /groups/invite/respond:
    post:
      summary: Accept or reject a group invite (invitee only)
      operationId: respondToGroupInvite
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_id, accept]
              properties:
                invite_id:
                  type: string
                accept:
                  type: boolean
      responses:
        '200':
          description: Response recorded
          content:
            application/json:
              schema:
                type: object
                required: [invite_id, status]
                properties:
                  invite_id:
                    type: string
                  status:
                    type: string
                    enum: [ACCEPTED, REJECTED]
        '400':
          description: Missing invite_id or accept
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not the invitee, or account suspended
        '404':
          description: Invite not found
        '409':
          description: Invite is no longer pending
        '410':
          description: Invite expired (`conflict`)

  /groups/update:
    post:
      summary: Rename a group (admins only)
      operationId: updateGroup
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id]
              properties:
                group_id:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                type: object
                required: [group_id, updated]
                properties:
                  group_id:
                    type: string
                  updated:
                    type: boolean
        '400':
          description: Missing group_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, or account suspended
        '404':
          description: Group not found

  /groups/member-role:
    post:
      summary: Promote or demote a member (admins only)
      operationId: setGroupMemberRole
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, account_id, role]
              properties:
                group_id:
                  type: string
                account_id:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, MEMBER]
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                type: object
                required: [account_id, role]
                properties:
                  account_id:
                    type: string
                  role:
                    type: string
        '400':
          description: Missing fields or invalid role
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, target is not a member, or account suspended
        '404':
          description: Group not found
        '409':
          description: Cannot demote the final admin, or the original creator (transfer ownership first)

  /groups/leave:
    post:
      summary: Leave a group (allowed while suspended)
      operationId: leaveGroup
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/GroupIdBody'
      responses:
        '200':
          description: Left group
          content:
            application/json:
              schema:
                type: object
                required: [group_id, left]
                properties:
                  group_id:
                    type: string
                  left:
                    type: boolean
        '400':
          description: Missing group_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a member of this group
        '404':
          description: Group not found

  /groups/remove:
    post:
      summary: Remove a member (admins only) and signal a key epoch update
      operationId: removeGroupMember
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, account_id]
              properties:
                group_id:
                  type: string
                account_id:
                  type: string
                epoch:
                  type: integer
                  default: 0
                encryption_key_id:
                  type: string
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                required: [group_id, removed]
                properties:
                  group_id:
                    type: string
                  removed:
                    type: string
                    description: Removed account id
        '400':
          description: Missing group_id or account_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, target is not a member, or account suspended
        '404':
          description: Group not found

  /groups/delete:
    post:
      summary: Delete a group (admins only)
      operationId: deleteGroup
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/GroupIdBody'
      responses:
        '200':
          description: Group deleted
          content:
            application/json:
              schema:
                type: object
                required: [group_id, deleted]
                properties:
                  group_id:
                    type: string
                  deleted:
                    type: boolean
        '400':
          description: Missing group_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, or account suspended
        '404':
          description: Group not found

  /groups/set-add-policy:
    post:
      summary: Set who may add members to the group (admins only)
      operationId: setGroupAddPolicy
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, policy]
              properties:
                group_id:
                  type: string
                policy:
                  type: string
                  enum: [EVERYONE, CONTACTS, CONTACTS_EXCEPT, NOBODY]
      responses:
        '200':
          description: Policy updated
          content:
            application/json:
              schema:
                type: object
                required: [group_id, policy]
                properties:
                  group_id:
                    type: string
                  policy:
                    type: string
        '400':
          description: Missing fields or invalid policy value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, or account suspended
        '404':
          description: Group not found

  /groups/create-join-link:
    post:
      summary: Create a group join link (admins only)
      operationId: createGroupJoinLink
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_id, group_id, token]
              properties:
                link_id:
                  type: string
                group_id:
                  type: string
                token:
                  type: string
                requires_approval:
                  type: boolean
                  default: false
                expires_at:
                  type: integer
                  format: int64
                  description: Defaults to a server-chosen lifetime
      responses:
        '200':
          description: Join link created
          content:
            application/json:
              schema:
                type: object
                required: [link_id, token, expires_at, requires_approval]
                properties:
                  link_id:
                    type: string
                  token:
                    type: string
                  expires_at:
                    type: integer
                    format: int64
                  requires_approval:
                    type: boolean
        '400':
          description: Missing group_id, link_id, or token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, or account suspended
        '429':
          description: Join link creation quota exceeded (`quota_exceeded`)

  /groups/revoke-join-link:
    post:
      summary: Revoke a group join link (admins only)
      operationId: revokeGroupJoinLink
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_id]
              properties:
                link_id:
                  type: string
      responses:
        '200':
          description: Join link revoked
          content:
            application/json:
              schema:
                type: object
                required: [link_id, revoked]
                properties:
                  link_id:
                    type: string
                  revoked:
                    type: boolean
        '400':
          description: Missing link_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, or account suspended
        '404':
          description: Link not found

  /groups/join-via-link:
    post:
      summary: Join a group with a link token, or file a join request when approval is required
      operationId: joinGroupViaLink
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, request_id]
              properties:
                token:
                  type: string
                request_id:
                  type: string
      responses:
        '200':
          description: 'Joined (`status: JOINED`, with group_id) or a request is pending approval (`status: PENDING`, with request_id)'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [JOINED, PENDING]
                  group_id:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Missing token or request_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller cannot join this group, or account suspended
        '409':
          description: Already a member
        '410':
          description: Link revoked, unknown or expired (`conflict`)
        '429':
          description: Too many join requests for this link (`quota_exceeded`)

  /groups/join-requests:
    get:
      summary: List pending join requests for a group (admins only)
      operationId: listGroupJoinRequests
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdQuery'
      responses:
        '200':
          description: Pending join requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          description: Missing group_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin

  /groups/approve-join-request:
    post:
      summary: Approve or reject a pending join request (admins only)
      operationId: approveGroupJoinRequest
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, approve]
              properties:
                request_id:
                  type: string
                approve:
                  type: boolean
      responses:
        '200':
          description: Request resolved
          content:
            application/json:
              schema:
                type: object
                required: [request_id, status]
                properties:
                  request_id:
                    type: string
                  status:
                    type: string
                    enum: [APPROVED, REJECTED]
        '400':
          description: Missing request_id or approve
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, or account suspended
        '404':
          description: Request not found
        '409':
          description: Request is no longer pending

  /groups/transfer-ownership:
    post:
      summary: Transfer group ownership to another member (current owner only)
      operationId: transferGroupOwnership
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, new_owner_id]
              properties:
                group_id:
                  type: string
                new_owner_id:
                  type: string
      responses:
        '200':
          description: Ownership transferred
          content:
            application/json:
              schema:
                type: object
                required: [group_id, new_owner_id, transferred]
                properties:
                  group_id:
                    type: string
                  new_owner_id:
                    type: string
                  transferred:
                    type: boolean
        '400':
          description: Missing group_id or new_owner_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the owner, new owner is not a member, or account suspended
        '404':
          description: Group not found

  /groups/admin-delete-message:
    post:
      summary: Delete a message in a group for everyone (admins only)
      operationId: adminDeleteGroupMessage
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, message_id]
              properties:
                group_id:
                  type: string
                message_id:
                  type: string
      responses:
        '200':
          description: Message removed
          content:
            application/json:
              schema:
                type: object
                required: [message_id, moderated]
                properties:
                  message_id:
                    type: string
                  moderated:
                    type: boolean
        '400':
          description: Missing group_id or message_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, or account suspended
        '404':
          description: Group not found

  /groups/block-member:
    post:
      summary: Remove and block an account from a group (admins only)
      operationId: blockGroupMember
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, account_id]
              properties:
                group_id:
                  type: string
                account_id:
                  type: string
      responses:
        '200':
          description: Member blocked
          content:
            application/json:
              schema:
                type: object
                required: [group_id, blocked]
                properties:
                  group_id:
                    type: string
                  blocked:
                    type: string
                    description: Blocked account id
        '400':
          description: Missing group_id or account_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, or account suspended
        '404':
          description: Group not found

  /groups/epoch-key/deliver:
    post:
      summary: Distribute a group Sender Key epoch, wrapped per recipient device (admins only)
      description: >-
        Each delivery becomes a durable device event for a local device, or is
        batched per domain to /s2s/groups/epoch-key/deliver-batch for remote
        recipients.
      operationId: deliverGroupEpochKey
      tags: [Groups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, epoch, key_id, deliveries]
              properties:
                group_id:
                  type: string
                epoch:
                  type: integer
                key_id:
                  type: string
                deliveries:
                  type: array
                  items:
                    $ref: '#/components/schemas/EpochKeyDelivery'
      responses:
        '200':
          description: Epoch key distributed
          content:
            application/json:
              schema:
                type: object
                required: [group_id, epoch, local_deliveries, federated_domains]
                properties:
                  group_id:
                    type: string
                  epoch:
                    type: integer
                  local_deliveries:
                    type: integer
                  federated_domains:
                    type: integer
        '400':
          description: Missing group_id, epoch, key_id, or deliveries
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin, or account suspended
        '404':
          description: Group not found
        '503':
          description: Remote recipients but federation is not configured

  # ─── Group calls ──────────────────────────────────────────────
  # Every POST/DELETE here is refused with 403 `account_suspended` for a
  # suspended account.
  /group-calls/:
    post:
      summary: Create a group call room hosted by the calling device
      operationId: createGroupCallRoom
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_video:
                  type: boolean
                  default: false
                scheduled_call_id:
                  type: string
                  description: Links the room to one of the caller's scheduled calls
      responses:
        '200':
          description: Room created
          content:
            application/json:
              schema:
                type: object
                required: [status, room_id, is_video]
                properties:
                  status:
                    type: string
                    enum: [created]
                  room_id:
                    type: string
                  is_video:
                    type: boolean
        '400':
          description: Invalid JSON
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account suspended (`account_suspended`)

  /group-calls/links:
    post:
      summary: Create a shareable call link (valid for 7 days)
      operationId: createGroupCallLink
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                room_id:
                  type: string
                requires_approval:
                  type: boolean
                  default: false
                max_uses:
                  type: integer
                  default: 0
                  description: 0 means unlimited
      responses:
        '200':
          description: Link created
          content:
            application/json:
              schema:
                type: object
                required: [status, link_id, link_token, requires_approval]
                properties:
                  status:
                    type: string
                    enum: [created]
                  link_id:
                    type: string
                  link_token:
                    type: string
                  requires_approval:
                    type: boolean
        '400':
          description: Invalid JSON
        '401':
          $ref: '#/components/responses/Unauthorized'

  /group-calls/links/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Resolve a call link to its room
      operationId: resolveGroupCallLink
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Link details; `room` is null when the link has no live room
          content:
            application/json:
              schema:
                type: object
                required: [link_id, requires_approval]
                properties:
                  link_id:
                    type: string
                  requires_approval:
                    oneOf:
                      - type: boolean
                      - type: integer
                  room:
                    type: object
                    nullable: true
                    properties:
                      room_id:
                        type: string
                      status:
                        type: string
                      is_video:
                        type: integer
                      participant_count:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Call link not found
        '409':
          description: Call link use limit reached
        '410':
          description: Call link revoked or expired (`conflict`)
    delete:
      summary: Revoke a call link (creator only)
      operationId: revokeGroupCallLink
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Link revoked
          content:
            application/json:
              schema:
                type: object
                required: [status, link_token]
                properties:
                  status:
                    type: string
                    enum: [revoked]
                  link_token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only the link creator can revoke it
        '404':
          description: Call link not found

  /group-calls/scheduled:
    post:
      summary: Schedule a group call and notify attendees
      operationId: createScheduledGroupCall
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, scheduled_at]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                scheduled_at:
                  type: integer
                  format: int64
                  description: Future time in ms since epoch
                attendee_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Scheduled
          content:
            application/json:
              schema:
                type: object
                required: [status, scheduled_call_id, title]
                properties:
                  status:
                    type: string
                    enum: [created]
                  scheduled_call_id:
                    type: string
                  title:
                    type: string
        '400':
          description: Invalid JSON, bad title, or scheduled_at not in the future
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: List upcoming scheduled calls the account hosts or attends
      operationId: listScheduledGroupCalls
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Upcoming scheduled calls
          content:
            application/json:
              schema:
                type: object
                required: [calls]
                properties:
                  calls:
                    type: array
                    items:
                      type: object
                      properties:
                        scheduled_call_id:
                          type: string
                        room_id:
                          type: string
                          nullable: true
                        host_account_id:
                          type: string
                        title:
                          type: string
                        scheduled_at:
                          type: integer
                          format: int64
                        created_at:
                          type: integer
                          format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'

  /group-calls/scheduled/{id}/rsvp:
    post:
      summary: RSVP to a scheduled call
      operationId: rsvpScheduledGroupCall
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScheduledCallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rsvp]
              properties:
                rsvp:
                  type: string
                  enum: [YES, NO]
      responses:
        '200':
          description: RSVP recorded
          content:
            application/json:
              schema:
                type: object
                required: [status, rsvp]
                properties:
                  status:
                    type: string
                    enum: [rsvp_recorded]
                  rsvp:
                    type: string
        '400':
          description: Invalid JSON or rsvp value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Scheduled call not found
        '410':
          description: Scheduled call was cancelled (`conflict`)

  /group-calls/scheduled/{id}:
    delete:
      summary: Cancel a scheduled call (host only) and notify attendees
      operationId: cancelScheduledGroupCall
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScheduledCallId'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [status, scheduled_call_id]
                properties:
                  status:
                    type: string
                    enum: [cancelled]
                  scheduled_call_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only the host can cancel
        '404':
          description: Scheduled call not found
        '409':
          description: Already cancelled

  /group-calls/{roomId}:
    get:
      summary: Get a room and its participants
      operationId: getGroupCallRoom
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCallRoom'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Room not found

  /group-calls/{roomId}/join:
    post:
      summary: Join a room with the calling device (max 4 active participants)
      operationId: joinGroupCallRoom
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          $ref: '#/components/responses/RoomStatusResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account suspended (`account_suspended`)
        '404':
          description: Room not found
        '409':
          description: Room full (`conflict`, details `max`)
        '410':
          description: Room has ended (`conflict`)

  /group-calls/{roomId}/leave:
    post:
      summary: Leave a room with the calling device
      operationId: leaveGroupCallRoom
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          $ref: '#/components/responses/RoomStatusResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /group-calls/{roomId}/end:
    post:
      summary: End a room for everyone (host only)
      operationId: endGroupCallRoom
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          $ref: '#/components/responses/RoomStatusResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only the host can end the room
        '404':
          description: Room not found

  /group-calls/{roomId}/kick:
    post:
      summary: Remove a participant device from a room (host only)
      operationId: kickGroupCallParticipant
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
      responses:
        '200':
          description: Participant removed
          content:
            application/json:
              schema:
                type: object
                required: [status, device_id]
                properties:
                  status:
                    type: string
                    enum: [kicked]
                  device_id:
                    type: string
        '400':
          description: Invalid JSON or missing device_id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only the host can kick participants
        '404':
          description: Room not found

  /group-calls/{roomId}/key:
    post:
      summary: Store the room media key for an epoch, wrapped per participant device (host only)
      operationId: deliverGroupCallRoomKey
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_id, epoch, keys]
              properties:
                key_id:
                  type: string
                epoch:
                  type: integer
                  minimum: 0
                keys:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [device_id, wrapped_key]
                    properties:
                      device_id:
                        type: string
                      wrapped_key:
                        type: string
                        maxLength: 2048
      responses:
        '200':
          description: Keys stored (invalid entries are skipped)
          content:
            application/json:
              schema:
                type: object
                required: [status, key_id, epoch, saved]
                properties:
                  status:
                    type: string
                    enum: [delivered]
                  key_id:
                    type: string
                  epoch:
                    type: integer
                  saved:
                    type: integer
        '400':
          description: Invalid JSON, or key_id, epoch or keys missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only the host can deliver room keys
        '404':
          description: Room not found

  /group-calls/{roomId}/screen-sharing:
    post:
      summary: Set the calling device's screen-sharing state in a room
      operationId: setGroupCallScreenSharing
      tags: [GroupCalls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  default: false
      responses:
        '200':
          description: State updated
          content:
            application/json:
              schema:
                type: object
                required: [status, active]
                properties:
                  status:
                    type: string
                    enum: [updated]
                  active:
                    type: boolean
        '400':
          description: Invalid JSON
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Backups ──────────────────────────────────────────────────
  /backups/:
    post:
      summary: Upload (replace) the caller's encrypted account backup envelope
      description: >-
        Refuses any body carrying `backup_key`, `passphrase` or
        `recovery_phrase`: the key never leaves the device.
      operationId: uploadBackup
      tags: [Backups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptedBackupUpload'
      responses:
        '200':
          description: Backup stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing envelope metadata, unsupported version, or key material in the body
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: Download the caller's encrypted backup envelope
      operationId: downloadBackup
      tags: [Backups]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Backup envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptedBackupDownload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No backup exists

  /backups/history:
    put:
      summary: Upload (replace) the automatic encrypted text-history backup
      description: >-
        One opaque blob per account, sealed by the app with a key derived from
        the account identity key. It is bound to the account's current
        identity public key and deleted when that key rotates.
      operationId: uploadHistoryBackup
      tags: [Backups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blob]
              properties:
                blob:
                  type: string
                  maxLength: 16777216
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [updated_at]
                properties:
                  updated_at:
                    type: integer
                    format: int64
        '400':
          description: Missing blob
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Account not found
        '413':
          description: Blob larger than 16 MB (`quota_exceeded`)
    get:
      summary: Download the history backup
      operationId: downloadHistoryBackup
      tags: [Backups]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: History backup
          content:
            application/json:
              schema:
                type: object
                required: [blob, updated_at]
                properties:
                  blob:
                    type: string
                  updated_at:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No history backup

  /backups/media:
    post:
      summary: Reserve encrypted backup media object storage
      description: >-
        Objects are at most 100 MB each and 1 GB per account, and are kept
        for 90 days.
      operationId: requestBackupMediaUpload
      tags: [Backups]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupMediaUploadRequest'
      responses:
        '200':
          description: Upload target created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupMediaUploadTarget'
        '400':
          description: >-
            Missing or invalid metadata, size not allowed, or media quota
            exceeded (400 with code `quota_exceeded`)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /backups/media/status/{objectId}:
    get:
      summary: Read encrypted backup media upload status
      operationId: getBackupMediaStatus
      tags: [Backups]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Upload status
          content:
            application/json:
              schema:
                type: object
                required: [object_id, uploaded_bytes, byte_size, status, sha256]
                properties:
                  object_id:
                    type: string
                  uploaded_bytes:
                    type: integer
                  byte_size:
                    type: integer
                  status:
                    type: string
                    enum: [PENDING, UPLOADING, COMPLETED, FAILED]
                  sha256:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Object not found (or owned by another account)

  /backups/media/{objectId}:
    put:
      summary: Upload or resume encrypted backup media bytes
      operationId: uploadBackupMediaObject
      tags: [Backups]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Upload progress or completion
          content:
            application/json:
              schema:
                type: object
                required: [object_id, uploaded_bytes, status]
                properties:
                  object_id:
                    type: string
                  uploaded_bytes:
                    type: integer
                  status:
                    type: string
                    enum: [UPLOADING, COMPLETED]
        '400':
          description: Cannot resume, offset beyond size, object exceeds declared size, or integrity check failed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Object not found
    get:
      summary: Download encrypted backup media bytes
      operationId: downloadBackupMediaObject
      tags: [Backups]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: Encrypted object stream
          headers:
            X-Content-SHA256:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Object not found, incomplete, or missing on disk

  /backups/attachments/upload-url:
    get:
      summary: Legacy query-string form of POST /backups/media
      description: The object id is the sha256.
      operationId: getBackupAttachmentUploadUrl
      deprecated: true
      tags: [Backups]
      security:
        - BearerAuth: []
      parameters:
        - name: file_size
          in: query
          required: true
          schema:
            type: integer
        - name: sha256
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload target created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupMediaUploadTarget'
        '400':
          description: Missing parameters, invalid metadata, or quota exceeded
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Health ───────────────────────────────────────────────────
  /health/live:
    get:
      summary: Liveness probe
      operationId: getLiveness
      tags: [Health]
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status, service, time]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                  time:
                    type: string
                    format: date-time

  /health/ready:
    get:
      summary: Readiness probe
      operationId: getReadiness
      tags: [Health]
      responses:
        '200':
          $ref: '#/components/responses/Readiness'
        '503':
          $ref: '#/components/responses/Readiness'

  # ─── Server ───────────────────────────────────────────────────
  /server/info:
    get:
      summary: >-
        Server facts a signed-in client may display to its user. Requires a
        session; people still joining read the same name from
        /accounts/invite/lookup instead.
      operationId: getServerInfo
      tags: [Server]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Server info
          content:
            application/json:
              schema:
                type: object
                required: [server_name]
                properties:
                  server_name:
                    type: string
                    description: Admin-set name, or a default derived from the server id.
                  max_attachment_bytes:
                    type: integer
                    nullable: true
                  account_quota_bytes:
                    type: integer
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /server/tos:
    get:
      summary: Return the current public legal documents
      description: Public, so it can be read before an account exists.
      operationId: getTermsOfService
      tags: [Server]
      responses:
        '200':
          description: Current Terms of Service and Privacy Policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentsResponse'

  # ─── Telemetry ────────────────────────────────────────────────
  /telemetry/crash:
    post:
      summary: >-
        Self-hosted, opt-in crash sink (MED-4). The client sends nothing unless
        the user has granted crash-reporting consent, and redacts before
        sending; the server truncates before logging, because it cannot verify
        that the client redacted. Rate-limited per device so one device in a
        crash loop cannot drown out the rest.
      operationId: reportCrash
      tags: [Telemetry]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, fields]
              properties:
                name:
                  type: string
                  description: Event name, e.g. app_crash.
                fields:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Redacted key/value detail. At most 8 entries are recorded
                    and each value is truncated to 512 characters.
      responses:
        '200':
          description: Report accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
        '400':
          description: Malformed body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Crash reporting is disabled (feature flag `crash_reporting_upload`)
        '429':
          description: Crash report rate exceeded

  # ─── Privacy & Account ────────────────────────────────────────
  /privacy/export:
    get:
      summary: Export everything the server holds for the authenticated account
      description: >-
        `export_version` 2: every account-scoped table, including password
        metadata and the encrypted history backup. Credential material
        (password verifier and wrapped key, refresh-token, recovery-code and
        invite-code hashes, push and link tokens) is withheld and listed under
        `withheld`.
      operationId: exportAccountData
      tags: [Privacy]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Exported data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AccountExport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /privacy/admin/audit:
    get:
      summary: Read audit records (admin accounts only)
      operationId: readAdminAudit
      tags: [Privacy]
      security:
        - BearerAuth: []
        - AdminAuth: []
      parameters:
        - name: account_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Audit records
          content:
            application/json:
              schema:
                type: object
                required: [audit]
                properties:
                  audit:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin privileges required

  /account/delete:
    delete:
      summary: Delete the authenticated account and all its data
      operationId: deleteAccount
      tags: [Account]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted, account_id]
                properties:
                  deleted:
                    type: boolean
                  account_id:
                    type: string
        '400':
          description: Invalid confirmation
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── WebSocket ────────────────────────────────────────────────
  /ws:
    get:
      summary: WebSocket upgrade endpoint for real-time events
      description: >-
        Exempt from the REST auth middleware; the handler itself requires an
        access token in the Authorization header. `since` is the client's
        current inbound device-event cursor, so only newer events are
        replayed.
      operationId: webSocketConnect
      tags: [WebSocket]
      security:
        - BearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)
        '403':
          description: Missing, invalid or expired token, or device inactive
        '429':
          description: WebSocket reconnect rate exceeded

  # ─── App links (served at the server root, not under /api/v1) ─
  /.well-known/assetlinks.json:
    servers:
      - url: https://api.remote.helix.com
        description: Server root
    get:
      summary: Android Digital Asset Links proof for shared invite/recovery links
      description: >-
        Empty array when no signing-certificate fingerprints are configured.
      operationId: getAssetLinks
      tags: [AppLinks]
      responses:
        '200':
          description: Asset links statements
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    relation:
                      type: array
                      items:
                        type: string
                    target:
                      type: object
                      properties:
                        namespace:
                          type: string
                          enum: [android_app]
                        package_name:
                          type: string
                          example: com.helix.remote
                        sha256_cert_fingerprints:
                          type: array
                          items:
                            type: string

  /open:
    servers:
      - url: https://api.remote.helix.com
        description: Server root
    get:
      summary: Landing page for shared links (`/open#HLX-INV-…` or `/open#HLX-REC-…`)
      description: >-
        Static HTML. The code travels in the URL fragment, so the server never
        sees it; the page's script hands it to the app via `helix://open?code=`
        (or an Android intent URL).
      operationId: getOpenPage
      tags: [AppLinks]
      responses:
        '200':
          description: HTML landing page (Cache-Control no-store, strict CSP)
          content:
            text/html:
              schema:
                type: string

  # ─── Admin (/admin) ───────────────────────────────────────────
  # /admin and /ops expose the same handlers (the admin console uses /admin);
  # /admin additionally has auth/login. Each admin route accepts the admin
  # credential (AdminAuth) or the session token of an account flagged admin.
  /admin/auth/login:
    post:
      summary: Exchange the master admin password for a 7-day admin JWT
      description: Public. Only the global per-IP rate limiter applies.
      operationId: adminLogin
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_in, server_name, server_id, status]
                properties:
                  token:
                    type: string
                    description: Admin JWT (the password itself if JWT signing is unavailable)
                  expires_in:
                    type: integer
                    example: 604800
                  server_name:
                    type: string
                  server_id:
                    type: string
                  status:
                    type: string
                    enum: [authenticated]
        '400':
          description: Invalid JSON or missing password
        '401':
          description: Invalid master admin password

  /admin/metrics:
    get:
      summary: Read operational metrics (Admin)
      operationId: adminReadMetrics
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: >-
            Metrics payload: service, schema_version, capabilities, database
            health and size, table counts, mailbox/attachment/outbox stats,
            websocket, calls, rate limiter, push/SMS provider, TURN,
            telemetry counters and alert thresholds
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/support-diagnostic:
    get:
      summary: Redacted support diagnostic bundle (Admin)
      operationId: adminSupportDiagnostic
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: >-
            Readiness, configuration summary, SLO targets, alert thresholds,
            metrics and a `redaction` statement (tokens, TURN secret, SDP and
            ICE candidates excluded; private IPs redacted)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/config:
    get:
      summary: Effective server configuration, secrets excluded (Admin)
      operationId: adminReadConfig
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  server_id:
                    type: string
                  server_public_key:
                    type: string
                  server_name:
                    type: string
                  default_server_name:
                    type: string
                  max_server_name_length:
                    type: integer
                  public_base_url:
                    type: string
                  port:
                    type: string
                  host:
                    type: string
                  dev_mode:
                    type: boolean
                  push_configured:
                    type: boolean
                  turn_configured:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/config/server-name:
    post:
      summary: >-
        Set or clear this server's display name (Admin). The name is shown
        to the server's own users, on the join screen and in app settings.
      operationId: adminSetServerName
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server_name:
                  type: string
                  nullable: true
                  maxLength: 60
                  description: >-
                    Empty, whitespace-only or null clears the name, after
                    which clients fall back to the default name.
      responses:
        '200':
          description: Stored name, normalized (empty string when cleared)
          content:
            application/json:
              schema:
                type: object
                required: [server_name]
                properties:
                  server_name:
                    type: string
        '400':
          description: >-
            Invalid JSON, not a string, name too long, or contains control or
            text-direction override characters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/backup:
    post:
      summary: Snapshot the database to backups/backup_<timestamp>.db on the server host (Admin)
      operationId: adminTriggerBackup
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Snapshot written
          content:
            application/json:
              schema:
                type: object
                required: [status, backup_file, timestamp]
                properties:
                  status:
                    type: string
                    enum: [success]
                  backup_file:
                    type: string
                  timestamp:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          description: Backup failed (`internal_error`)

  /admin/users:
    get:
      summary: List accounts with their devices (Admin)
      operationId: adminListUsers
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                required: [users, limit, offset]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid limit or offset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/users/{accountId}/suspend:
    post:
      summary: Suspend an account (sessions stay valid; activity is refused) (Admin)
      operationId: adminSuspendUser
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          $ref: '#/components/responses/AdminAccountStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Account not found

  /admin/users/{accountId}/unsuspend:
    post:
      summary: Lift a suspension (Admin)
      operationId: adminUnsuspendUser
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          $ref: '#/components/responses/AdminAccountStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Account not found

  /admin/users/{accountId}/delete:
    post:
      summary: Delete an account and all its data (Admin)
      operationId: adminDeleteUser
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [account_id, deleted]
                properties:
                  account_id:
                    type: string
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Account not found

  /admin/users/{accountId}/block:
    post:
      summary: Permanently block an account - ban its phone hash and delete its data (Admin)
      operationId: adminBlockUser
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Blocked and deleted
          content:
            application/json:
              schema:
                type: object
                required: [account_id, blocked, deleted]
                properties:
                  account_id:
                    type: string
                  blocked:
                    type: boolean
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Account not found

  /admin/users/{accountId}/recovery-code:
    post:
      summary: Issue a single-use 48-hour recovery code for an account (Admin)
      operationId: adminIssueRecoveryCode
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Recovery code issued
          content:
            application/json:
              schema:
                type: object
                required: [account_id, recovery_code, opaque_code, code, expires_at]
                properties:
                  account_id:
                    type: string
                  recovery_code:
                    type: string
                    description: Raw code (rec_…) for POST /accounts/recovery/redeem
                  opaque_code:
                    type: string
                    description: Shareable HLX-REC-… code naming the server and account
                  code:
                    type: string
                    description: Same as opaque_code
                  expires_at:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin privileges required, or the account is blocked
        '404':
          description: Account not found

  /admin/users/{accountId}/devices/{deviceId}/revoke:
    post:
      summary: Revoke one device of an account (Admin)
      operationId: adminRevokeUserDevice
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                type: object
                required: [success, account_id, device_id]
                properties:
                  success:
                    type: boolean
                  account_id:
                    type: string
                  device_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Account not found

  /admin/logs:
    get:
      summary: Tail the server log (Admin)
      operationId: adminReadLogs
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        '200':
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items:
                      type: string
                  source:
                    type: string
                    enum: [file, memory, none]
                  file_path:
                    type: string
                  message:
                    type: string
        '400':
          description: Invalid limit
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          description: Failed to read the log file (`internal_error`)

  /admin/logs/stream:
    get:
      summary: Live log stream over WebSocket (Admin)
      description: >-
        Exempt from the session middleware. The handler accepts only the admin
        credential (admin JWT or admin password) - a session token of an admin
        account is not enough - from the `token` query parameter or the
        Authorization header. Sends the last 50 lines, then each new line, as
        `{"type": "log", "line": "..."}` frames.
      operationId: adminStreamLogs
      tags: [Admin]
      security:
        - AdminAuth: []
        - AdminQueryToken: []
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)
        '403':
          description: Admin authorization required

  /admin/invites:
    post:
      summary: Issue a 7-day invite code (Admin)
      operationId: adminCreateInvite
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Invite issued (the raw code is returned only here)
          content:
            application/json:
              schema:
                type: object
                required: [invite_id, invite_code, shareable_code, shareable_url, expires_at]
                properties:
                  invite_id:
                    type: string
                  invite_code:
                    type: string
                  shareable_code:
                    type: string
                    description: HLX-INV-… code naming the server
                  shareable_url:
                    type: string
                  expires_at:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
    get:
      summary: List invites (Admin)
      operationId: adminListInvites
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, PENDING, EXPIRED, REDEEMED, CANCELLED]
      responses:
        '200':
          description: Page of invites
          content:
            application/json:
              schema:
                type: object
                required: [invites, limit, offset]
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminInvite'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid limit, offset or status filter
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/invites/{inviteId}/cancel:
    post:
      summary: Cancel a pending invite (Admin)
      operationId: adminCancelInvite
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [invite_id, status]
                properties:
                  invite_id:
                    type: string
                  status:
                    type: string
                    enum: [CANCELLED]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '409':
          description: Invite not found, already redeemed, or already cancelled

  /admin/reports:
    get:
      summary: List safety reports (Admin)
      operationId: adminListReports
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of reports
          content:
            application/json:
              schema:
                type: object
                required: [reports, limit, offset]
                properties:
                  reports:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid limit or offset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/reports/{reportId}/resolve:
    post:
      summary: Mark a report resolved (Admin)
      operationId: adminResolveReport
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          $ref: '#/components/responses/AdminReportStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/reports/{reportId}/dismiss:
    post:
      summary: Mark a report dismissed (Admin)
      operationId: adminDismissReport
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          $ref: '#/components/responses/AdminReportStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/audit:
    get:
      summary: Read audit logs (Admin)
      operationId: adminReadAuditLogs
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - name: account_id
          in: query
          required: false
          schema:
            type: string
        - name: include_read
          in: query
          required: false
          description: Include *_READ / *_POLL entries
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/federation:
    get:
      summary: Federation configuration (Admin)
      operationId: adminFederationStatus
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Federation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/federation/worldwide:
    post:
      summary: Turn worldwide (directory) federation on or off (Admin)
      description: >-
        Enabling registers this server and every local account
        (`account@domain`) with the federation directory.
      operationId: adminSetWorldwideMode
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                domain:
                  type: string
                address:
                  type: string
                directory_url:
                  type: string
      responses:
        '200':
          description: New federation status (plus `directory_registration` when enabled)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FederationConfig'
                  - type: object
                    properties:
                      directory_registration:
                        type: object
                        additionalProperties: true
        '400':
          description: Missing enabled flag, or domain/address/directory_url empty
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '503':
          description: Server identity is not initialized

  /admin/feature-flags:
    get:
      summary: Read the server-owned feature flags (Admin)
      operationId: adminReadFeatureFlags
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Map of flag name to current value
          content:
            application/json:
              schema:
                type: object
                required: [flags]
                properties:
                  flags:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/feature-flags/{name}:
    post:
      summary: Set one feature flag (Admin)
      description: >-
        The server allow-lists flag names, so an unknown name is a 404 rather
        than an arbitrary remotely-switchable capability. Only flags that gate
        a real code path have any effect.
      operationId: adminSetFeatureFlag
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Flag updated
          content:
            application/json:
              schema:
                type: object
                required: [name, enabled]
                properties:
                  name:
                    type: string
                  enabled:
                    type: boolean
        '400':
          description: 'Expected {"enabled": boolean}'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Unknown flag name

  /admin/maintenance:
    post:
      summary: Turn maintenance mode on or off (Admin)
      description: >-
        While on, every client route answers 503 (`status: maintenance`,
        Retry-After 3600). /ops, /admin, /server and /health stay reachable so
        the mode can be inspected and turned back off - otherwise the switch
        would be a one-way door.
      operationId: adminSetMaintenanceMode
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: New maintenance state
          content:
            application/json:
              schema:
                type: object
                required: [maintenance_mode]
                properties:
                  maintenance_mode:
                    type: boolean
        '400':
          description: 'Expected {"enabled": boolean}'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/admin-pin:
    post:
      summary: Replace the master admin password (Admin)
      description: >-
        Requires the current password, so a console left open on a shared
        machine cannot be used to take the server over. The salt is
        regenerated; neither value is echoed back.
      operationId: adminChangeAdminPin
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          $ref: '#/components/responses/SuccessFlag'
        '400':
          description: Missing field, or the new password is too short
        '401':
          description: The current password is incorrect
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/purge:
    post:
      summary: Delete expired operational data (Admin)
      description: >-
        Removes dead-letter and failed outbox rows older than a week and
        expired refresh tokens. Never touches accounts, devices, messages,
        contacts, or audit history. Returns per-table counts.
      operationId: adminPurgeOperationalData
      tags: [Admin]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Per-table removal counts and a total
          content:
            application/json:
              schema:
                type: object
                required: [removed, total]
                properties:
                  removed:
                    type: object
                    additionalProperties:
                      type: integer
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /admin/setup-status:
    get:
      summary: Whether first-time admin password setup is still needed (Admin)
      description: >-
        Not on the middleware exemption list under /admin, so any valid
        bearer token (session or admin) is needed; the handler checks nothing
        else. /ops/setup-status is the public form.
      operationId: adminSetupStatus
      tags: [Admin]
      security:
        - BearerAuth: []
        - AdminAuth: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                required: [needs_setup, server_id]
                properties:
                  needs_setup:
                    type: boolean
                  server_id:
                    type: string

  /admin/setup-admin-password:
    post:
      summary: Set the first admin password while setup is still needed (Admin)
      description: >-
        Not on the middleware exemption list under /admin, so any valid
        bearer token (session or admin) is needed; the handler checks nothing
        else. /ops/setup-admin-password is the public form. Refused with 409
        once a password exists.
      operationId: adminSetupAdminPassword
      tags: [Admin]
      security:
        - BearerAuth: []
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          $ref: '#/components/responses/SuccessFlag'
        '400':
          description: Invalid JSON, or password shorter than 6 characters
        '409':
          description: Admin password has already been configured

  # ─── Ops (/ops) ───────────────────────────────────────────────
  # Same handlers as /admin; setup-status and setup-admin-password are public here.
  /ops/metrics:
    get:
      summary: Read operational metrics (Ops)
      operationId: opsReadMetrics
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: >-
            Metrics payload: service, schema_version, capabilities, database
            health and size, table counts, mailbox/attachment/outbox stats,
            websocket, calls, rate limiter, push/SMS provider, TURN,
            telemetry counters and alert thresholds
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/support-diagnostic:
    get:
      summary: Redacted support diagnostic bundle (Ops)
      operationId: opsSupportDiagnostic
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: >-
            Readiness, configuration summary, SLO targets, alert thresholds,
            metrics and a `redaction` statement (tokens, TURN secret, SDP and
            ICE candidates excluded; private IPs redacted)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/config:
    get:
      summary: Effective server configuration, secrets excluded (Ops)
      operationId: opsReadConfig
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  server_id:
                    type: string
                  server_public_key:
                    type: string
                  server_name:
                    type: string
                  default_server_name:
                    type: string
                  max_server_name_length:
                    type: integer
                  public_base_url:
                    type: string
                  port:
                    type: string
                  host:
                    type: string
                  dev_mode:
                    type: boolean
                  push_configured:
                    type: boolean
                  turn_configured:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/config/server-name:
    post:
      summary: >-
        Set or clear this server's display name (Ops). The name is shown
        to the server's own users, on the join screen and in app settings.
      operationId: opsSetServerName
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server_name:
                  type: string
                  nullable: true
                  maxLength: 60
                  description: >-
                    Empty, whitespace-only or null clears the name, after
                    which clients fall back to the default name.
      responses:
        '200':
          description: Stored name, normalized (empty string when cleared)
          content:
            application/json:
              schema:
                type: object
                required: [server_name]
                properties:
                  server_name:
                    type: string
        '400':
          description: >-
            Invalid JSON, not a string, name too long, or contains control or
            text-direction override characters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/backup:
    post:
      summary: Snapshot the database to backups/backup_<timestamp>.db on the server host (Ops)
      operationId: opsTriggerBackup
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Snapshot written
          content:
            application/json:
              schema:
                type: object
                required: [status, backup_file, timestamp]
                properties:
                  status:
                    type: string
                    enum: [success]
                  backup_file:
                    type: string
                  timestamp:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          description: Backup failed (`internal_error`)

  /ops/users:
    get:
      summary: List accounts with their devices (Ops)
      operationId: opsListUsers
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                required: [users, limit, offset]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid limit or offset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/users/{accountId}/suspend:
    post:
      summary: Suspend an account (sessions stay valid; activity is refused) (Ops)
      operationId: opsSuspendUser
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          $ref: '#/components/responses/AdminAccountStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Account not found

  /ops/users/{accountId}/unsuspend:
    post:
      summary: Lift a suspension (Ops)
      operationId: opsUnsuspendUser
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          $ref: '#/components/responses/AdminAccountStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Account not found

  /ops/users/{accountId}/delete:
    post:
      summary: Delete an account and all its data (Ops)
      operationId: opsDeleteUser
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [account_id, deleted]
                properties:
                  account_id:
                    type: string
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Account not found

  /ops/users/{accountId}/block:
    post:
      summary: Permanently block an account - ban its phone hash and delete its data (Ops)
      operationId: opsBlockUser
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Blocked and deleted
          content:
            application/json:
              schema:
                type: object
                required: [account_id, blocked, deleted]
                properties:
                  account_id:
                    type: string
                  blocked:
                    type: boolean
                  deleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Account not found

  /ops/users/{accountId}/recovery-code:
    post:
      summary: Issue a single-use 48-hour recovery code for an account (Ops)
      operationId: opsIssueRecoveryCode
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Recovery code issued
          content:
            application/json:
              schema:
                type: object
                required: [account_id, recovery_code, opaque_code, code, expires_at]
                properties:
                  account_id:
                    type: string
                  recovery_code:
                    type: string
                    description: Raw code (rec_…) for POST /accounts/recovery/redeem
                  opaque_code:
                    type: string
                    description: Shareable HLX-REC-… code naming the server and account
                  code:
                    type: string
                    description: Same as opaque_code
                  expires_at:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin privileges required, or the account is blocked
        '404':
          description: Account not found

  /ops/users/{accountId}/devices/{deviceId}/revoke:
    post:
      summary: Revoke one device of an account (Ops)
      operationId: opsRevokeUserDevice
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPath'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device revoked
          content:
            application/json:
              schema:
                type: object
                required: [success, account_id, device_id]
                properties:
                  success:
                    type: boolean
                  account_id:
                    type: string
                  device_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Account not found

  /ops/logs:
    get:
      summary: Tail the server log (Ops)
      operationId: opsReadLogs
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        '200':
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items:
                      type: string
                  source:
                    type: string
                    enum: [file, memory, none]
                  file_path:
                    type: string
                  message:
                    type: string
        '400':
          description: Invalid limit
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '500':
          description: Failed to read the log file (`internal_error`)

  /ops/logs/stream:
    get:
      summary: Live log stream over WebSocket (Ops)
      description: >-
        Exempt from the session middleware. The handler accepts only the admin
        credential (admin JWT or admin password) - a session token of an admin
        account is not enough - from the `token` query parameter or the
        Authorization header. Sends the last 50 lines, then each new line, as
        `{"type": "log", "line": "..."}` frames.
      operationId: opsStreamLogs
      tags: [Ops]
      security:
        - AdminAuth: []
        - AdminQueryToken: []
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)
        '403':
          description: Admin authorization required

  /ops/invites:
    post:
      summary: Issue a 7-day invite code (Ops)
      operationId: opsCreateInvite
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Invite issued (the raw code is returned only here)
          content:
            application/json:
              schema:
                type: object
                required: [invite_id, invite_code, shareable_code, shareable_url, expires_at]
                properties:
                  invite_id:
                    type: string
                  invite_code:
                    type: string
                  shareable_code:
                    type: string
                    description: HLX-INV-… code naming the server
                  shareable_url:
                    type: string
                  expires_at:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
    get:
      summary: List invites (Ops)
      operationId: opsListInvites
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, PENDING, EXPIRED, REDEEMED, CANCELLED]
      responses:
        '200':
          description: Page of invites
          content:
            application/json:
              schema:
                type: object
                required: [invites, limit, offset]
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminInvite'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid limit, offset or status filter
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/invites/{inviteId}/cancel:
    post:
      summary: Cancel a pending invite (Ops)
      operationId: opsCancelInvite
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [invite_id, status]
                properties:
                  invite_id:
                    type: string
                  status:
                    type: string
                    enum: [CANCELLED]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '409':
          description: Invite not found, already redeemed, or already cancelled

  /ops/reports:
    get:
      summary: List safety reports (Ops)
      operationId: opsListReports
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of reports
          content:
            application/json:
              schema:
                type: object
                required: [reports, limit, offset]
                properties:
                  reports:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid limit or offset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/reports/{reportId}/resolve:
    post:
      summary: Mark a report resolved (Ops)
      operationId: opsResolveReport
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          $ref: '#/components/responses/AdminReportStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/reports/{reportId}/dismiss:
    post:
      summary: Mark a report dismissed (Ops)
      operationId: opsDismissReport
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          $ref: '#/components/responses/AdminReportStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/audit:
    get:
      summary: Read audit logs (Ops)
      operationId: opsReadAuditLogs
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - name: account_id
          in: query
          required: false
          schema:
            type: string
        - name: include_read
          in: query
          required: false
          description: Include *_READ / *_POLL entries
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/federation:
    get:
      summary: Federation configuration (Ops)
      operationId: opsFederationStatus
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Federation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/federation/worldwide:
    post:
      summary: Turn worldwide (directory) federation on or off (Ops)
      description: >-
        Enabling registers this server and every local account
        (`account@domain`) with the federation directory.
      operationId: opsSetWorldwideMode
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                domain:
                  type: string
                address:
                  type: string
                directory_url:
                  type: string
      responses:
        '200':
          description: New federation status (plus `directory_registration` when enabled)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FederationConfig'
                  - type: object
                    properties:
                      directory_registration:
                        type: object
                        additionalProperties: true
        '400':
          description: Missing enabled flag, or domain/address/directory_url empty
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '503':
          description: Server identity is not initialized

  /ops/feature-flags:
    get:
      summary: Read the server-owned feature flags (Ops)
      operationId: opsReadFeatureFlags
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Map of flag name to current value
          content:
            application/json:
              schema:
                type: object
                required: [flags]
                properties:
                  flags:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/feature-flags/{name}:
    post:
      summary: Set one feature flag (Ops)
      description: >-
        The server allow-lists flag names, so an unknown name is a 404 rather
        than an arbitrary remotely-switchable capability. Only flags that gate
        a real code path have any effect.
      operationId: opsSetFeatureFlag
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Flag updated
          content:
            application/json:
              schema:
                type: object
                required: [name, enabled]
                properties:
                  name:
                    type: string
                  enabled:
                    type: boolean
        '400':
          description: 'Expected {"enabled": boolean}'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Unknown flag name

  /ops/maintenance:
    post:
      summary: Turn maintenance mode on or off (Ops)
      description: >-
        While on, every client route answers 503 (`status: maintenance`,
        Retry-After 3600). /ops, /admin, /server and /health stay reachable so
        the mode can be inspected and turned back off - otherwise the switch
        would be a one-way door.
      operationId: opsSetMaintenanceMode
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: New maintenance state
          content:
            application/json:
              schema:
                type: object
                required: [maintenance_mode]
                properties:
                  maintenance_mode:
                    type: boolean
        '400':
          description: 'Expected {"enabled": boolean}'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/admin-pin:
    post:
      summary: Replace the master admin password (Ops)
      description: >-
        Requires the current password, so a console left open on a shared
        machine cannot be used to take the server over. The salt is
        regenerated; neither value is echoed back.
      operationId: opsChangeAdminPin
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          $ref: '#/components/responses/SuccessFlag'
        '400':
          description: Missing field, or the new password is too short
        '401':
          description: The current password is incorrect
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/purge:
    post:
      summary: Delete expired operational data (Ops)
      description: >-
        Removes dead-letter and failed outbox rows older than a week and
        expired refresh tokens. Never touches accounts, devices, messages,
        contacts, or audit history. Returns per-table counts.
      operationId: opsPurgeOperationalData
      tags: [Ops]
      security:
        - AdminAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Per-table removal counts and a total
          content:
            application/json:
              schema:
                type: object
                required: [removed, total]
                properties:
                  removed:
                    type: object
                    additionalProperties:
                      type: integer
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /ops/setup-status:
    get:
      summary: Whether first-time admin password setup is still needed (Ops)
      description: >-
        Public (exempt from the session middleware).
      operationId: opsSetupStatus
      tags: [Ops]
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                required: [needs_setup, server_id]
                properties:
                  needs_setup:
                    type: boolean
                  server_id:
                    type: string

  /ops/setup-admin-password:
    post:
      summary: Set the first admin password while setup is still needed (Ops)
      description: >-
        Public (exempt from the session middleware). Refused with 409 once a
        password exists.
      operationId: opsSetupAdminPassword
      tags: [Ops]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          $ref: '#/components/responses/SuccessFlag'
        '400':
          description: Invalid JSON, or password shorter than 6 characters
        '409':
          description: Admin password has already been configured

  # ─── Server-to-server federation (/s2s) ───────────────────────
  # Called by peer Helix servers, never by apps. Exempt from the session
  # middleware; every request must carry the S2S signature headers (see the
  # S2SSignature security scheme). Account ids cross the boundary qualified
  # as `user@domain`.
  /s2s/prekeys/bundle:
    get:
      summary: Fetch prekey bundles for a local account on behalf of a remote server
      operationId: s2sGetPreKeyBundle
      tags: [S2S]
      security:
        - S2SSignature: []
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Prekey bundle
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PreKeyBundleResponse'
                  - type: object
                    properties:
                      qualified_account_id:
                        type: string
                      account_identity_key:
                        type: string
                        nullable: true
        '400':
          description: Missing account_id parameter
        '401':
          $ref: '#/components/responses/S2SUnauthorized'
        '404':
          description: No active devices found for this account

  /s2s/messages/proxy:
    post:
      summary: Deliver one federated ciphertext envelope to a local device
      operationId: s2sProxyMessage
      tags: [S2S]
      security:
        - S2SSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/S2SProxiedEnvelope'
      responses:
        '200':
          description: Delivered
          content:
            application/json:
              schema:
                type: object
                required: [message, sequence]
                properties:
                  message:
                    type: string
                  sequence:
                    type: integer
        '400':
          description: Missing proxy message fields
        '401':
          $ref: '#/components/responses/S2SUnauthorized'
        '403':
          description: Recipient device mailbox quota exceeded
        '404':
          description: Recipient device not found

  /s2s/messages/proxy-batch:
    post:
      summary: Deliver a batch of federated envelopes; results are per envelope
      operationId: s2sProxyMessageBatch
      tags: [S2S]
      security:
        - S2SSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelopes]
              properties:
                envelopes:
                  type: array
                  items:
                    $ref: '#/components/schemas/S2SProxiedEnvelope'
      responses:
        '200':
          description: Per-envelope results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [ok]
                      properties:
                        ok:
                          type: boolean
                        status:
                          type: integer
                          description: HTTP-style status of a failed envelope (400, 403, 404)
                        error:
                          type: string
                        sequence:
                          type: integer
                        recipient_device_id:
                          type: string
        '400':
          description: Missing envelopes
        '401':
          $ref: '#/components/responses/S2SUnauthorized'

  /s2s/conversations/event-relay-batch:
    post:
      summary: Fan out remote edits, reactions, receipts (durable) and typing (transient) to local devices
      operationId: s2sRelayConversationEvents
      tags: [S2S]
      security:
        - S2SSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  items:
                    type: object
                    required: [recipient_account_id, event_type, payload]
                    properties:
                      conversation_id:
                        type: string
                      recipient_account_id:
                        type: string
                      event_type:
                        type: string
                      event_key:
                        type: string
                      persist:
                        type: boolean
                        default: true
                      payload:
                        type: object
                        additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/S2SDeliveredCount'
        '400':
          description: Missing events
        '401':
          $ref: '#/components/responses/S2SUnauthorized'

  /s2s/groups/sync:
    post:
      summary: Home server pushes a group's state (and optionally an event and pending invites) to this participant server
      description: Refused unless `home_server_id` equals the authenticated sending server.
      operationId: s2sSyncGroup
      tags: [S2S]
      security:
        - S2SSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, home_server_id, home_domain]
              properties:
                group_id:
                  type: string
                home_server_id:
                  type: string
                home_domain:
                  type: string
                name:
                  type: string
                creator_id:
                  type: string
                encryption_key_id:
                  type: string
                status:
                  type: string
                  default: ACTIVE
                add_policy:
                  type: string
                  default: EVERYONE
                created_at:
                  type: integer
                  format: int64
                members:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                event:
                  type: object
                  additionalProperties: true
                pending_invites:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: Synced
          content:
            application/json:
              schema:
                type: object
                required: [status, group_id]
                properties:
                  status:
                    type: string
                    enum: [synced]
                  group_id:
                    type: string
        '400':
          description: Missing group_id, home_server_id or home_domain
        '401':
          description: Signature invalid, or group home server mismatch

  /s2s/groups/state:
    get:
      summary: Read authoritative state of a group homed on this server
      operationId: s2sGetGroupState
      tags: [S2S]
      security:
        - S2SSignature: []
      parameters:
        - $ref: '#/components/parameters/GroupIdQuery'
      responses:
        '200':
          description: Group state
          content:
            application/json:
              schema:
                type: object
                required: [group_id, members]
                properties:
                  group_id:
                    type: string
                  name:
                    type: string
                  creator_id:
                    type: string
                  encryption_key_id:
                    type: string
                  status:
                    type: string
                  add_policy:
                    type: string
                  created_at:
                    type: integer
                    format: int64
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id:
                          type: string
                        role:
                          type: string
        '400':
          description: Missing group_id
        '401':
          $ref: '#/components/responses/S2SUnauthorized'
        '404':
          description: This server is not home for that group

  /s2s/groups/action:
    post:
      summary: A participant server proxies a member's group action to the home server
      description: >-
        `action` is one of invite, invite_respond, update, member_role, leave,
        remove, delete, set_add_policy, transfer_ownership,
        admin_delete_message, block_member; `payload` is that route's request
        body. The acting account's domain must match the sending server's
        verified domain. The response is the local handler's response.
      operationId: s2sApplyGroupAction
      tags: [S2S]
      security:
        - S2SSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, action, acting_account_id]
              properties:
                group_id:
                  type: string
                action:
                  type: string
                  enum:
                    - invite
                    - invite_respond
                    - update
                    - member_role
                    - leave
                    - remove
                    - delete
                    - set_add_policy
                    - transfer_ownership
                    - admin_delete_message
                    - block_member
                acting_account_id:
                  type: string
                payload:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Result of the matching /groups/* handler
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Missing fields or unknown action
        '401':
          description: Signature invalid, or acting account domain does not match the sending server
        '409':
          description: This server is not the home server for that group
        '503':
          description: Group federation is not configured

  /s2s/groups/epoch-key/deliver-batch:
    post:
      summary: Deliver wrapped group Sender Keys to local member devices
      operationId: s2sDeliverGroupEpochKeys
      tags: [S2S]
      security:
        - S2SSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveries]
              properties:
                deliveries:
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/EpochKeyDelivery'
                      - type: object
                        required: [group_id, epoch, key_id]
                        properties:
                          group_id:
                            type: string
                          epoch:
                            type: integer
                          key_id:
                            type: string
                          sender_account_id:
                            type: string
      responses:
        '200':
          $ref: '#/components/responses/S2SDeliveredCount'
        '400':
          description: Missing deliveries
        '401':
          $ref: '#/components/responses/S2SUnauthorized'

  /s2s/calls/signal:
    post:
      summary: Relay a call signal from a remote caller or callee to a local account
      description: >-
        Status mapping as for /calls/signal, except that a `dropped` result
        is not in this handler's 200 list and so maps to 400.
      operationId: s2sRelayCallSignal
      tags: [S2S]
      security:
        - S2SSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender_account_id, sender_device_id, signal]
              properties:
                sender_account_id:
                  type: string
                sender_device_id:
                  type: string
                request_id:
                  type: string
                signal:
                  $ref: '#/components/schemas/CallSignalPayload'
      responses:
        '200':
          description: Delivered, queued, partial or duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallSignalResult'
        '400':
          description: Missing fields or rejected signal
        '401':
          $ref: '#/components/responses/S2SUnauthorized'
        '409':
          description: No active devices, or answered elsewhere
        '410':
          description: Call expired
        '429':
          description: Rate limited
        '503':
          description: Call federation is not configured

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Device session access token from login, refresh, device linking or password sign-in.
    AdminAuth:
      type: http
      scheme: bearer
      description: >-
        Admin JWT from POST /admin/auth/login, or the master admin password
        itself (break-glass). A session token of an account flagged admin is
        also accepted by admin handlers (listed as BearerAuth).
    AdminQueryToken:
      type: apiKey
      in: query
      name: token
      description: Admin credential passed as a query parameter (log stream WebSocket only).
    S2SSignature:
      type: apiKey
      in: header
      name: X-Helix-S2S-Signature
      description: >-
        Ed25519 signature (base64) over
        `serverId|timestamp|requestPath|sha256hex(body)`, sent with
        `X-Helix-S2S-Server-Id`, `X-Helix-S2S-Public-Key` (base64) and
        `X-Helix-S2S-Timestamp`. Stale timestamps and replayed signatures are
        refused. A dotted server id must prove domain ownership on first
        contact; the key is then pinned.

  parameters:
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
    ObjectId:
      name: objectId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]{16,128}$'
    CallId:
      name: call_id
      in: path
      required: true
      schema:
        type: string
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
    ScheduledCallId:
      name: id
      in: path
      required: true
      schema:
        type: string
    GroupIdQuery:
      name: group_id
      in: query
      required: true
      schema:
        type: string
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  requestBodies:
    ContactRequestId:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [request_id]
            properties:
              request_id:
                type: string
    PeerAccountId:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [peer_account_id]
            properties:
              peer_account_id:
                type: string
    GroupIdBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [group_id]
            properties:
              group_id:
                type: string

  responses:
    Unauthorized:
      description: >-
        Missing, invalid or expired access token (`token_invalid`), or the
        device is no longer active (`device_inactive`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdminRequired:
      description: Admin privileges required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    S2SUnauthorized:
      description: Missing, expired, replayed or invalid S2S signature, or pinned key mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InviteLookupResult:
      description: Lookup result (valid or not - never a 404)
      content:
        application/json:
          schema:
            type: object
            required: [valid]
            properties:
              valid:
                type: boolean
              reason:
                type: string
                enum: [not_found, already_used, cancelled, expired]
              issuer_type:
                type: string
                enum: [ADMIN, SYSTEM_GLOBAL]
              server_name:
                type: string
                description: >-
                  Admin-chosen display name for the server this invite is
                  for, or the default name derived from the server id.
    CallStatusResult:
      description: Pending call state changed
      content:
        application/json:
          schema:
            type: object
            required: [status, call_id]
            properties:
              status:
                type: string
                enum: [declined, cancelled, expired]
              call_id:
                type: string
    RoomStatusResult:
      description: Room state changed
      content:
        application/json:
          schema:
            type: object
            required: [status, room_id]
            properties:
              status:
                type: string
                enum: [joined, left, ended]
              room_id:
                type: string
    AdminAccountStatus:
      description: New account status
      content:
        application/json:
          schema:
            type: object
            required: [account_id, status]
            properties:
              account_id:
                type: string
              status:
                type: string
                enum: [SUSPENDED, ACTIVE]
    AdminReportStatus:
      description: New report status
      content:
        application/json:
          schema:
            type: object
            required: [success, report_id, status]
            properties:
              success:
                type: boolean
              report_id:
                type: string
              status:
                type: string
                enum: [RESOLVED, DISMISSED]
    SuccessFlag:
      description: Done
      content:
        application/json:
          schema:
            type: object
            required: [success]
            properties:
              success:
                type: boolean
    S2SDeliveredCount:
      description: Number of local deliveries
      content:
        application/json:
          schema:
            type: object
            required: [delivered]
            properties:
              delivered:
                type: integer
    Readiness:
      description: Readiness report (200 when the database is usable, else 503)
      content:
        application/json:
          schema:
            type: object
            required: [status, api_ready]
            properties:
              status:
                type: string
                enum: [ready, not_ready]
              api_ready:
                type: boolean
              call_ready:
                type: boolean
              websocket_ready:
                type: boolean
              push_ready:
                type: boolean
              dependencies:
                type: object
                additionalProperties:
                  type: string
              turn:
                type: object
                additionalProperties: true
              schema_version:
                type: integer
              capabilities:
                type: object
                additionalProperties: true

  schemas:
    # ─── Common ─────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message; do not branch on it
        code:
          type: string
          description: >-
            Machine-readable code (RemoteErrorCode in
            backend/lib/src/app_error.dart, plus the middleware's
            token_invalid and device_inactive). Absent on some legacy
            responses.
          enum:
            - unauthorized
            - forbidden
            - not_a_member
            - not_found
            - bad_request
            - conflict
            - quota_exceeded
            - service_unavailable
            - federation_error
            - push_delivery_failed
            - push_token_not_found
            - sms_delivery_failed
            - invalid_otp
            - phone_already_registered
            - terms_acceptance_required
            - terms_version_outdated
            - discovery_salt_stale
            - account_suspended
            - account_blocked
            - phone_blocked
            - device_revoked
            - password_incorrect
            - password_locked
            - device_list_stale
            - internal_error
            - token_invalid
            - device_inactive
        details:
          type: object
          additionalProperties: true

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    EventEnvelope:
      type: object
      description: Realtime/device-event envelope, as sent over the WebSocket
      required: [event_id, schema_version, timestamp, type, payload]
      properties:
        event_id:
          type: string
        schema_version:
          type: integer
        timestamp:
          type: integer
          format: int64
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        server_sequence:
          type: integer
          nullable: true

    # ─── Auth Schemas ───────────────────────────────────────────
    RegisterRequest:
      type: object
      required:
        - account_id
        - phone_hash
        - otp_code
        - display_name
        - registration_version
        - account_identity_public_key
        - device_id
        - device_signing_public_key
        - device_agreement_public_key
        - account_registration_signature
        - device_registration_signature
        - device_name
      properties:
        registration_version:
          type: integer
          enum: [3]
        account_id:
          type: string
        phone_hash:
          type: string
          description: >-
            Salted HMAC-SHA256 hash of the account's E.164 phone number (see
            GET /contacts/discovery-salt). The server never sees a raw
            phone number.
        phone_number:
          type: string
          description: >-
            Optional E.164 number kept for the admin console and account
            security only (stored in the historical `phone_last4` column;
            `phone_last4` is accepted as an alias). Not part of the signed
            transcript; silently dropped when malformed.
        otp_code:
          type: string
          description: >-
            The one-time code obtained from POST /accounts/phone/otp/request
            for this phone_hash.
        otp_challenge_id:
          type: string
          description: >-
            Optional challenge identifier from the OTP request. When present,
            registration verifies this exact challenge instead of whichever
            challenge was issued most recently.
        invite_code:
          type: string
          description: >-
            A redeemable invite credential. Required by personal/self-hosted
            servers (admin-issued), where an empty or missing value is
            rejected with 400 and invalid/expired/already-used codes are
            rejected with 403. Helix Global bypasses invitations entirely: this
            field is omitted and the SMS OTP for the phone number is the sole
            credential, for both new accounts and for signing an existing
            account in on a new device.
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        tos_accepted:
          type: boolean
          description: >-
            Required and must be true when the server runs in Global instance
            mode. Personal/self-hosted registrations may omit it.
        tos_version:
          type: string
          description: >-
            Version of the Terms of Service presented to the user. Global
            servers record their current authoritative version.
        account_identity_public_key:
          type: string
          description: Base64url-encoded Ed25519 account identity public key
        device_id:
          type: string
        device_signing_public_key:
          type: string
          description: Base64url-encoded Ed25519 device authentication public key
        device_agreement_public_key:
          type: string
          description: Base64url-encoded X25519 device agreement public key
        account_registration_signature:
          type: string
          description: Ed25519 signature over the v3 registration transcript using the account identity key
        device_registration_signature:
          type: string
          description: Ed25519 signature over the v3 registration transcript using the device signing key
        device_name:
          type: string

    LegalDocumentsResponse:
      type: object
      required:
        - version
        - effective_date
        - terms_title
        - terms
        - privacy_version
        - privacy_title
        - privacy_policy
      properties:
        version:
          type: string
        effective_date:
          type: string
        terms_title:
          type: string
        terms:
          type: string
        privacy_version:
          type: string
        privacy_title:
          type: string
        privacy_policy:
          type: string

    LoginRequest:
      type: object
      required:
        - account_id
        - device_id
        - signature
      properties:
        account_id:
          type: string
        device_id:
          type: string
        signature:
          type: string
          description: Signature of the bound login challenge signed with the device signing key
        purpose:
          type: string
          default: login
          description: Must match the challenge purpose; only `login` is accepted

    ChallengeResponse:
      type: object
      required:
        - challenge
        - purpose
        - expires_at
        - audience
      properties:
        challenge:
          type: string
          description: >-
            Base64url JSON {version, account_id, device_id, nonce, purpose,
            issued_at, expires_at, audience}; sign this exact string
        purpose:
          type: string
        expires_at:
          type: integer
          format: int64
        audience:
          type: string

    TokenResponse:
      type: object
      required:
        - token
        - refresh_token
      properties:
        token:
          type: string
          description: Access token, valid for 1 hour
        refresh_token:
          type: string
          description: Refresh token, valid for 60 days from the last refresh
        refresh_expires_at:
          type: integer
          format: int64

    PasswordKdfParams:
      type: object
      required: [alg, memory_kib, iterations, parallelism, length]
      properties:
        alg:
          type: string
          enum: [argon2id]
        memory_kib:
          type: integer
          minimum: 19456
          maximum: 262144
          example: 19456
        iterations:
          type: integer
          minimum: 1
          maximum: 10
          example: 2
        parallelism:
          type: integer
          minimum: 1
          maximum: 4
          example: 1
        length:
          type: integer
          enum: [64]

    # ─── Device ─────────────────────────────────────────────────
    Device:
      type: object
      required:
        - device_id
        - device_name
        - device_signing_public_key
        - device_agreement_public_key
        - status
        - created_at
      properties:
        device_id:
          type: string
        account_id:
          type: string
        device_name:
          type: string
        device_signing_public_key:
          type: string
        device_agreement_public_key:
          type: string
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        push_token:
          type: string
          nullable: true
          description: The device's push token as stored (returned to every device of the account)
        created_at:
          type: integer
          format: int64
        last_seen_at:
          type: integer
          format: int64
          nullable: true

    # ─── Prekey Schemas ─────────────────────────────────────────
    PrekeyPublishRequest:
      type: object
      required:
        - signed_prekey_id
        - signed_prekey
        - signature
        - one_time_prekeys
      properties:
        signed_prekey_id:
          type: integer
        signed_prekey:
          type: string
        signature:
          type: string
        one_time_prekeys:
          type: array
          items:
            $ref: '#/components/schemas/OneTimePrekey'

    OneTimePrekey:
      type: object
      required:
        - key_id
        - public_key
      properties:
        key_id:
          type: integer
        public_key:
          type: string

    PreKeyBundleResponse:
      type: object
      required:
        - account_id
        - devices
      properties:
        account_id:
          type: string
        devices:
          type: array
          description: One entry per active device that has published prekeys
          items:
            type: object
            required:
              - device_id
              - identity_key
              - device_key
              - signed_prekey
            properties:
              device_id:
                type: string
              identity_key:
                type: string
                description: Account identity public key
              device_key:
                type: string
                description: Device agreement (X25519) public key
              signed_prekey:
                type: object
                required: [key_id, public_key, signature]
                properties:
                  key_id:
                    type: integer
                  public_key:
                    type: string
                  signature:
                    type: string
              one_time_prekey:
                allOf:
                  - $ref: '#/components/schemas/OneTimePrekey'
                nullable: true
                description: One claimed one-time prekey, or null when exhausted

    # ─── Contact Schemas ────────────────────────────────────────
    ContactRequest:
      type: object
      required: [peer_account_id]
      properties:
        peer_account_id:
          type: string
        request_id:
          type: string
          description: Client-chosen id; generated when omitted

    Visibility:
      type: string
      enum: [EVERYONE, CONTACTS, NOBODY]
      default: CONTACTS

    PrivacySettings:
      type: object
      properties:
        account_id:
          type: string
        search_discoverable:
          type: boolean
        presence_visibility:
          $ref: '#/components/schemas/Visibility'
        last_seen_visibility:
          $ref: '#/components/schemas/Visibility'
        phone_discoverable:
          type: boolean
          description: >-
            Whether this account can be found via the /contacts/match
            phone-contacts-sync flow.
        profile_version:
          type: integer

    # Call signaling schemas
    CallSignalPayload:
      type: object
      required:
        - call_id
        - signal_type
      properties:
        call_id:
          type: string
          maxLength: 128
        caller_account_id:
          type: string
          readOnly: true
          description: Server-injected account identity of the authenticated sender.
        caller_device_id:
          type: string
          readOnly: true
          description: Server-injected device identity of the authenticated sender.
        caller_display_name:
          type: string
          readOnly: true
          description: Server-injected from the caller's profile on offers.
        callee_account_id:
          type: string
          description: Required for offers; server may also copy target_account_id into this field.
        target_device_id:
          type: string
          description: Concrete delivery target when the signal is for one device.
        signal_type:
          type: string
          enum: [offer, answer, ice, decline, busy, cancel, end, answered_elsewhere]
        is_video:
          type: boolean
          default: false
        ip_privacy:
          type: string
          enum: [direct_and_relay, direct_if_verified, relay_only]
          default: relay_only
          description: >-
            Declared media policy. Unknown or absent values mean relay_only;
            the stricter of both sides' policies applies, and ICE candidates
            that violate it are dropped.
        sdp:
          type: string
          maxLength: 65536
        candidate:
          type: string
          maxLength: 4096
        sdp_mid:
          type: string
        mline_index:
          type: integer
          minimum: 0
          maximum: 64
        created_at:
          type: integer
          format: int64
          readOnly: true
        expires_at:
          type: integer
          format: int64
          readOnly: true

    CallSignalResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [delivered, partial, queued, duplicate, dropped, rejected, rate_limited, no_active_devices, answered_elsewhere, expired]
        delivered:
          type: boolean
        call_id:
          type: string
        delivered_count:
          type: integer
        queued_count:
          type: integer
        target_device_id:
          type: string
        target_device_ids:
          type: array
          items:
            type: string
        expires_at:
          type: integer
          format: int64
        request_id:
          type: string
        reason:
          type: string

    PendingCall:
      type: object
      required:
        - call_id
        - caller_account_id
        - caller_device_id
        - callee_account_id
        - is_video
        - status
        - created_at
        - expires_at
      properties:
        call_id:
          type: string
        caller_account_id:
          type: string
        caller_device_id:
          type: string
        callee_account_id:
          type: string
        is_video:
          type: integer
          enum: [0, 1]
        status:
          type: string
          enum: [RINGING, ANSWERED, DECLINED, BUSY, CANCELLED, END, EXPIRED]
        created_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        answered_by_device_id:
          type: string
          nullable: true
        sdp:
          type: string
          description: The stored offer SDP, when present
        caller_display_name:
          type: string

    # ─── Message Schemas ────────────────────────────────────────
    MessageSendRequest:
      type: object
      required:
        - message_id
        - conversation_id
        - envelopes
      properties:
        message_id:
          type: string
        conversation_id:
          type: string
        envelopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/MessageEnvelope'

    MessageEnvelope:
      type: object
      required:
        - recipient_device_id
        - ciphertext
      description: Must not contain plaintext, message_text or body keys
      properties:
        recipient_device_id:
          type: string
        recipient_account_id:
          type: string
          description: Required for federated recipients (`user@other-domain`)
        ciphertext:
          type: string
          minLength: 1

    DeviceListStaleError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            code:
              type: string
              enum: [device_list_stale]
            details:
              type: object
              required: [missing_device_count, missing_device_ids]
              properties:
                missing_device_count:
                  type: integer
                missing_device_ids:
                  type: array
                  items:
                    type: string

    SyncResponse:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              message_id:
                type: string
              conversation_id:
                type: string
              sender_account_id:
                type: string
              sender_device_id:
                type: string
              recipient_device_id:
                type: string
              ciphertext:
                type: string
              server_sequence:
                type: integer
              timestamp:
                type: integer
                format: int64

    # ─── Attachment Schemas ─────────────────────────────────────
    AttachmentUploadRequest:
      type: object
      required:
        - file_size
        - file_hash
      properties:
        file_size:
          type: integer
          minimum: 1
        file_hash:
          type: string
          description: SHA-256 hash of the ciphertext file; also becomes the file_id

    # ─── Group Schemas ──────────────────────────────────────────
    GroupInfo:
      type: object
      required: [group_id]
      properties:
        group_id:
          type: string
        name:
          type: string
        creator_id:
          type: string
        encryption_key_id:
          type: string
        status:
          type: string
        created_at:
          type: integer
          format: int64
        home_domain:
          type: string
          nullable: true
        add_policy:
          type: string
          enum: [EVERYONE, CONTACTS, CONTACTS_EXCEPT, NOBODY]
        is_federated:
          type: boolean
          description: Present (true) when served from this server's read-model of a remote group

    EpochKeyDelivery:
      type: object
      required: [recipient_account_id, recipient_device_id, wrapped_key]
      description: Entries missing a field are skipped
      properties:
        recipient_account_id:
          type: string
        recipient_device_id:
          type: string
        wrapped_key:
          type: string

    GroupCallRoom:
      type: object
      required: [room_id, host_account_id, status, participants]
      properties:
        room_id:
          type: string
        host_account_id:
          type: string
        host_device_id:
          type: string
        status:
          type: string
          example: ACTIVE
        is_video:
          type: integer
          enum: [0, 1]
        max_participants:
          type: integer
        room_key_id:
          type: string
          nullable: true
        room_key_epoch:
          type: integer
          nullable: true
        created_at:
          type: integer
          format: int64
        started_at:
          type: integer
          format: int64
          nullable: true
        ended_at:
          type: integer
          format: int64
          nullable: true
        participants:
          type: array
          items:
            type: object
            properties:
              room_id:
                type: string
              account_id:
                type: string
              device_id:
                type: string
              role:
                type: string
              status:
                type: string
              is_screen_sharing:
                type: integer
              joined_at:
                type: integer
                format: int64
              left_at:
                type: integer
                format: int64
                nullable: true

    # ─── Account Schemas ────────────────────────────────────────
    AccountDeleteRequest:
      type: object
      required:
        - confirmation
      properties:
        confirmation:
          type: string
          description: Must equal "DELETE" or "DELETE <accountId>"

    AccountExport:
      type: object
      required: [export_version, exported_at, withheld]
      additionalProperties: true
      description: >-
        One key per account-scoped data set (account, profile, privacy,
        password metadata, devices, device_revocations, pending_device_links,
        sessions, push_registrations, device_events, sync_cursors,
        recovery_codes, invite_redeemed, public_prekeys, contacts,
        contact_requests, contact_discovery, blocked, conversations,
        memberships, federated_memberships, message_mailbox, groups, the
        history backup, and more).
      properties:
        export_version:
          type: integer
          enum: [2]
        exported_at:
          type: integer
          format: int64
        withheld:
          type: array
          description: Table.column names deliberately excluded (credential material)
          items:
            type: string
          example:
            - account_passwords.auth_hash
            - account_passwords.wrapped_identity_key
            - refresh_tokens.token_hash
            - devices.push_token
        account:
          type: object
          additionalProperties: true
        profile:
          type: object
          nullable: true
          additionalProperties: true
        privacy:
          type: object
          additionalProperties: true
        password:
          type: object
          required: [has_password]
          additionalProperties: true
          properties:
            has_password:
              type: boolean
        devices:
          type: array
          items:
            type: object
            additionalProperties: true

    AuditLogEntry:
      type: object
      additionalProperties: true
      properties:
        event_id:
          type: string
        account_id:
          type: string
          nullable: true
        device_id:
          type: string
          nullable: true
        action:
          type: string
        client_ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        timestamp:
          type: integer
          format: int64

    # ─── Admin Schemas ──────────────────────────────────────────
    AdminUser:
      type: object
      properties:
        account_id:
          type: string
        created_at:
          type: integer
          format: int64
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, BLOCKED]
        phone_number:
          type: string
          description: Also returned as `phone` and `phone_last4` (same value)
        display_name:
          type: string
        invite_id:
          type: string
          nullable: true
        invite_issuer_label:
          type: string
          nullable: true
        invite_redeemed_at:
          type: integer
          format: int64
          nullable: true
        device_count:
          type: integer
          description: Active devices
        devices:
          type: array
          items:
            type: object
            properties:
              device_id:
                type: string
              device_name:
                type: string
              status:
                type: string
              created_at:
                type: integer
                format: int64
              last_seen_at:
                type: integer
                format: int64
                nullable: true
              push_enabled:
                type: boolean

    AdminInvite:
      type: object
      properties:
        invite_id:
          type: string
        issuer_type:
          type: string
          enum: [ADMIN, SYSTEM_GLOBAL]
        issuer_label:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, EXPIRED, REDEEMED, CANCELLED]
        created_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        redeemed_at:
          type: integer
          format: int64
          nullable: true
        redeemed_by_account_id:
          type: string
          nullable: true
        redeemed_by_display_name:
          type: string
          nullable: true

    FederationConfig:
      type: object
      required: [worldwide_mode, domain, directory_url, public_base_url, server_identity_ready]
      properties:
        worldwide_mode:
          type: boolean
        domain:
          type: string
        directory_url:
          type: string
        public_base_url:
          type: string
        server_identity_ready:
          type: boolean

    # ─── S2S Schemas ────────────────────────────────────────────
    S2SProxiedEnvelope:
      type: object
      required:
        - message_id
        - conversation_id
        - sender_account_id
        - sender_device_id
        - recipient_account_id
        - recipient_device_id
        - ciphertext
      properties:
        message_id:
          type: string
        conversation_id:
          type: string
        sender_account_id:
          type: string
        sender_device_id:
          type: string
        recipient_account_id:
          type: string
        recipient_device_id:
          type: string
        ciphertext:
          type: string

    # ─── Backup Schema ──────────────────────────────────────────
    EncryptedBackupUpload:
      type: object
      required:
        - backup_id
        - version
        - kdf
        - salt
        - backup_data
      properties:
        backup_id:
          type: string
        version:
          type: integer
          minimum: 1
        kdf:
          type: string
          example: Argon2id-v1-m8192-t2-p1
        salt:
          type: string
          description: Base64url encoded KDF salt
        backup_key_hint:
          type: string
          default: ''
        deletion_watermark:
          type: integer
          format: int64
          default: 0
        backup_data:
          type: string
          description: Opaque encrypted backup payload

    EncryptedBackupDownload:
      allOf:
        - $ref: '#/components/schemas/EncryptedBackupUpload'
        - type: object
          required: [requires_reupload]
          properties:
            created_at:
              type: integer
              format: int64
            requires_reupload:
              type: boolean
              description: True when the server asks the client to upload a fresh backup

    BackupMediaUploadRequest:
      type: object
      required: [byte_size, sha256]
      properties:
        object_id:
          type: string
          pattern: '^[a-zA-Z0-9_-]{16,128}$'
          description: Defaults to sha256
        byte_size:
          type: integer
          minimum: 1
          maximum: 104857600
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          description: Hex SHA-256 of the encrypted media object

    BackupMediaUploadTarget:
      type: object
      required: [object_id, upload_url, status_url, download_url, headers]
      properties:
        object_id:
          type: string
        upload_url:
          type: string
        status_url:
          type: string
        download_url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
