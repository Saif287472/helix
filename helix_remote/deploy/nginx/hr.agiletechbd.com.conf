# Nginx reverse proxy config for the Helix Remote backend, production VPS.
#
# Deploy: copy this file to /etc/nginx/sites-available/hr.agiletechbd.com on
# the VPS (symlinked into sites-enabled/), then `nginx -t && systemctl reload
# nginx`. See helix-remote-vps-handoff.md for full server context.
#
# IMPORTANT: Connection/Upgrade headers must stay scoped to the /api/v1/ws
# location only. Setting them on the catch-all `location /` block (as an
# earlier version of this file did) makes nginx send `Connection: upgrade`
# on every proxied request, including plain POSTs. Dart's HTTP server
# (shelf_io) then detaches the socket expecting a protocol upgrade, the
# request body never reaches the handler, and every POST endpoint
# (register, login, etc.) fails with a generic 500 that the backend doesn't
# even log (see backend/lib/src/modules/auth/registration.dart's catch-all).
# Fixed 2026-07-26.
server {
    server_name hr.agiletechbd.com;

    # Attachment uploads arrive as one PUT carrying the whole ciphertext, so
    # nginx's 1m default was the real attachment ceiling - every file over
    # ~1 MB was rejected with a 413 here, before the backend ever saw it, and
    # the client surfaced that only as a bare "Chunk upload failed with
    # status 413". Kept above the backend's own limit so the app's error
    # message is always the one users see.
    client_max_body_size 110m;

    # Stream request bodies straight through instead of spooling the whole
    # upload to disk first. At 100 MB the default doubles disk I/O and adds
    # the entire upload duration to the backend's time-to-first-byte.
    proxy_request_buffering off;

    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        # A 100 MB upload over a phone uplink runs for minutes; without this
        # nginx gives up on the slow client at the 60s default.
        send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hr.agiletechbd.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hr.agiletechbd.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = hr.agiletechbd.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name hr.agiletechbd.com;
    return 404; # managed by Certbot


}
