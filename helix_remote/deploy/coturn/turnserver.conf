# coturn configuration for Helix Remote, co-hosted with the backend.
#
# This file is a TEMPLATE. deploy/coturn/entrypoint.sh substitutes the
# ${...} placeholders from the environment at container start and writes
# the result to a tmpfs, so the shared secret never lands on disk or in
# the container's argv (where `docker inspect` and `ps` would show it).
#
# Lines whose placeholder resolves to an empty value are dropped by the
# entrypoint, which is how the TLS block below becomes optional.

# ---------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------
# The container runs with network_mode: host, so these bind directly to
# the VPS's interfaces. That is deliberate: TURN needs a wide range of
# relay ports, and publishing a range that size through Docker's
# userland proxy costs one process per port.
listening-port=3478
tls-listening-port=5349

# The public address clients should be told to send media to. On a VPS
# with the public IP bound directly to the interface this is just that
# IP. Behind a NAT it must be the public address, not the private one.
external-ip=${TURN_EXTERNAL_IP}

# Pin both the listeners and the relay to the public address.
#
# Left unset, coturn enumerates every local interface and happily uses
# loopback and Docker's bridge (172.17.0.1) as relay addresses - which
# with host networking means handing clients relay candidates that are
# unreachable at best. These lines are dropped when TURN_EXTERNAL_IP is
# empty, and coturn falls back to that discovery.
listening-ip=${TURN_EXTERNAL_IP}
relay-ip=${TURN_EXTERNAL_IP}

realm=${TURN_REALM}

# Relay port range. 40 ports is ample for a server this size - each
# concurrent relayed stream takes one. Widen it (and the matching ufw
# rule) before growing much past ~20 simultaneous callers.
min-port=49160
max-port=49200

# ---------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------
# TURN REST API mode: no user accounts exist on the TURN server at all.
# The backend mints short-lived credentials from this same shared secret
# (CallsModule._handleTurnCredentials: username "<expiry>:<account>:
# <device>", password base64(HMAC-SHA1(secret, username))), which is
# exactly the scheme use-auth-secret verifies. The secret here and
# HELIX_REMOTE_TURN_SECRET in the backend's environment must match.
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Credentials the backend issues are valid for an hour; stale-nonce
# keeps a long call from being pinned to one nonce for all of it.
stale-nonce=600

fingerprint

# ---------------------------------------------------------------------
# TLS (turns:) - optional
# ---------------------------------------------------------------------
# Populated only when certificates are present. See
# deploy/coturn/certbot-deploy-hook.sh for how they get here and stay
# fresh across renewals.
cert=${TURN_CERT_FILE}
pkey=${TURN_PKEY_FILE}
no-tlsv1
no-tlsv1_1

# ---------------------------------------------------------------------
# Hardening
# ---------------------------------------------------------------------
# An open TURN relay is an SSRF proxy. With host networking, a relay to
# 127.0.0.1:8080 would reach the backend directly, bypassing nginx, TLS
# and the rate limiter - and 169.254.169.254 is the cloud metadata
# endpoint. Deny every non-public destination; TURN only ever needs to
# reach other call participants on the public internet.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Quotas. The backend already rate-limits credential issuance per
# account and per device; these are the second line of defence, capping
# what any single credential can consume if one leaks.
user-quota=12
total-quota=100

# No telnet/CLI listener, and the web admin stays off by simply never
# setting `web-admin` - nothing should be able to reconfigure the relay
# at runtime.
no-cli

# Don't advertise the coturn version to the internet.
no-software-attribute

# Log to stdout so `docker compose logs helix-turn` works and nothing
# accumulates inside the container.
log-file=stdout
simple-log
