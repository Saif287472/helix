name: helix_remote
description: Helix Remote — internet messaging with end-to-end encryption, ephemeral
  LAN messaging, and secure group communication.
publish_to: none
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  helix_remote_domain:
    path: ../packages/helix_remote_domain
  helix_remote_crypto:
    path: ../packages/helix_remote_crypto
  helix_remote_api:
    path: ../packages/helix_remote_api
  helix_remote_storage:
    path: ../packages/helix_remote_storage
  helix_remote_sync:
    path: ../packages/helix_remote_sync
  helix_remote_calls:
    path: ../packages/helix_remote_calls
  flutter_webrtc: ^1.5.1
  helix_remote_groups:
    path: ../packages/helix_remote_groups
  helix_remote_ui:
    path: ../packages/helix_remote_ui
  path: ^1.9.1
  path_provider: ^2.1.6
  # Stable 13.x resolves alongside share_plus ^13.1.0, which closes the
  # prerelease exception recorded in
  # docs/adr/024-file-picker-prerelease-exception.md.
  file_picker: ^13.1.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.0.0
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  share_plus: ^13.1.0
  flutter_local_notifications: ^22.3.1
  # Push wake for incoming calls. Without a registered push token the
  # server's wake notification has nowhere to go and a closed app never
  # rings - see services/push_registration_service.dart. Both degrade to
  # "push unavailable" when google-services.json is absent, which is the
  # state of any checkout that has not been given deployment material.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  connectivity_plus: ^7.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  flutter_contacts: ^2.5.0
  device_info_plus: ^13.2.0
  url_launcher: ^6.3.2
  local_auth: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0
  sqlite3: ^3.3.3
  helix_remote_backend:
    path: ../backend
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/logo.png
  android: true
  windows:
    generate: true
    image_path: assets/logo.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
