org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Deliberately no `org.gradle.java.home`. It used to point at
# `C:/Program Files/Android/Android Studio/jbr`, one developer's local
# Android Studio install, which meant `flutter build apk` failed for anyone
# without that exact path - including CI, where the Android build step has
# never once succeeded ("Java home supplied is invalid"). Gradle resolves the
# JDK from JAVA_HOME (or `flutter config --jdk-dir`) instead, which works on
# every machine. If you need a specific JDK locally, set it there rather than
# committing a machine-specific path here.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.daemon=false
