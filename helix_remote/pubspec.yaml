name: helix_remote_workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - app
  - admin
  - server
  - tool
  - packages/helix_remote_domain
  - packages/helix_remote_api
  - packages/helix_remote_crypto
  - packages/helix_remote_calls
  - packages/helix_remote_cli
  - packages/helix_remote_ui
  - packages/helix_remote_architecture_rules
  - packages/helix_remote_protocol
  - packages/helix_remote_db
  - packages/helix_remote_engine

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
