name: helix_remote_backend
description: Secure, operational backend monolith for Helix Remote.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  sqlite3: ^3.3.3
  crypto: ^3.0.7
  cryptography: ^2.9.0
  # FCM HTTP v1 authenticates with a short-lived Google OAuth2 token, which
  # means signing a JWT with the service account's RSA key. package:crypto
  # is hash/HMAC only and package:cryptography has no pure-Dart RSA on the
  # VM, so this is the alternative to hand-rolling PKCS#1 v1.5 signing.
  googleapis_auth: ^2.3.3
  http: ^1.2.0
  web_socket_channel: ^3.0.3
  meta: ^1.18.0
  path: ^1.9.0
  qr: ^3.0.2
  helix_remote_domain:
    path: ../packages/helix_remote_domain

dev_dependencies:
  test: ^1.31.0

hooks:
  user_defines:
    sqlite3:
      source: system
