name: helix_remote_backend
description: Secure, operational backend monolith for Helix Remote.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  sqlite3: ^3.3.3
  crypto: ^3.0.7
  cryptography: ^2.9.0
  web_socket_channel: ^3.0.3
  meta: ^1.18.0
  helix_remote_domain:
    path: ../packages/helix_remote_domain

dev_dependencies:
  test: ^1.31.0

hooks:
  user_defines:
    sqlite3:
      source: system
