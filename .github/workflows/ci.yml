name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: helix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      local: ${{ steps.filter.outputs.local }}
      remote: ${{ steps.filter.outputs.remote }}
      backend: ${{ steps.filter.outputs.backend }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common:
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - '.github/workflows/ci.yml'
              - 'docs/**'
              - 'contracts/**'
            local:
              - 'apps/helix_local/**'
              - 'packages/local/**'
            remote:
              - 'apps/helix_remote/**'
              - 'packages/remote/**'
              - 'contracts/**'
            backend:
              - 'services/helix_remote_backend/**'
              - 'contracts/**'
            tooling:
              - 'tool/**'
              - 'scripts/**'

  verify-windows:
    needs: changes
    if: >-
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.local == 'true' ||
      needs.changes.outputs.remote == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.tooling == 'true'
    runs-on: windows-latest
    env:
      CI: "true"
      HELIX_VERIFY_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify with mandatory Windows and Android debug builds
        shell: pwsh
        run: ./scripts/verify.ps1

  verify-linux:
    needs: changes
    if: >-
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.local == 'true' ||
      needs.changes.outputs.remote == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify on Linux
        shell: bash
        run: ./scripts/verify.sh

  no-source-changes:
    needs: changes
    if: >-
      needs.changes.outputs.common != 'true' &&
      needs.changes.outputs.local != 'true' &&
      needs.changes.outputs.remote != 'true' &&
      needs.changes.outputs.backend != 'true' &&
      needs.changes.outputs.tooling != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Helix source, contract, docs, CI, script, or tooling changes detected."
