name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: helix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `pull-requests: read` is what the `changes` job actually needs. On a push,
# dorny/paths-filter diffs with git and needs nothing; on a pull_request it
# calls the "list PR files" API instead, which the default GITHUB_TOKEN does
# not grant. Without this the filter job fails with "Resource not accessible
# by integration", and because every verify job is gated on its outputs,
# they all skip - so a PR reports no verification at all rather than a
# failure. Declaring the block also pins the rest to read-only instead of
# inheriting whatever the repository default happens to be.
permissions:
  contents: read
  pull-requests: read

jobs:
  # INVARIANT (AUD-18-2): `dorny/paths-filter` describes a *diff*. On push and
  # pull_request that is the push range or the PR file list, but a scheduled or
  # manually dispatched run has no such range - with `base` left at its default
  # (the repository default branch, which is also what the run checks out) the
  # action documents that "changes are detected from the last commit", so the
  # filters describe only the tip commit. On the two events whose whole purpose
  # is to re-verify an unchanged tree (a new OSV advisory, a runner image bump,
  # an expired pinned action) every filter would be false and the run would
  # consist of the `no-source-changes` echo: green, having verified nothing.
  # The `forced` output below is therefore the bypass, and `tool/test/` asserts
  # that every verifying job ORs it in and that `no-source-changes` excludes it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      local: ${{ steps.filter.outputs.local }}
      remote: ${{ steps.filter.outputs.remote }}
      forced: ${{ steps.forced.outputs.forced }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common:
              - 'docs/**'
              - '.github/workflows/ci.yml'
            local:
              - 'helix_local/**'
            remote:
              - 'helix_remote/**'
      - name: A scheduled or dispatched run verifies the tree, not a diff
        id: forced
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'forced=true' >> "$GITHUB_OUTPUT"
          else
            echo 'forced=false' >> "$GITHUB_OUTPUT"
          fi

  verify-windows:
    needs: changes
    if: >-
      needs.changes.outputs.forced == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.remote == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: helix_remote
    env:
      CI: "true"
      HELIX_VERIFY_BUILD: "1"
      # The drift codegen check runs once, as its own step in verify-linux.
      HELIX_VERIFY_SKIP_CODEGEN: "1"
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than left to the runner image: the Android build needs a
      # JDK that matches app/build.gradle.kts's Java 17 source/target level,
      # and relying on whatever JAVA_HOME the image happens to ship makes this
      # job fail on an image bump for reasons unrelated to the change under
      # test.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Pinned for the same reason as the JDK above, and additionally because
      # `--enforce-lockfile` below is only meaningful against a known SDK: a
      # floating `stable` can resolve a different package set and turn a
      # reproducibility gate into a random failure. Bump this deliberately,
      # together with helix_remote/pubspec.lock.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      # --enforce-lockfile makes the committed pubspec.lock authoritative:
      # CI fails on drift instead of silently building against whatever the
      # caret ranges resolve to today.
      - run: flutter pub get --enforce-lockfile
      - name: Verify with mandatory Windows and Android debug builds
        shell: pwsh
        run: ./scripts/verify.ps1

  verify-linux:
    needs: changes
    if: >-
      needs.changes.outputs.forced == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.remote == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helix_remote
    # PostgreSQL for the server tests (ADR-025). The credentials only exist
    # inside this throwaway service container. HELIX_REQUIRE_TEST_DATABASE
    # turns a missing database into a failure instead of skipped tests, so
    # this job is where the database suites are guaranteed to run. The
    # Windows job cannot run Linux service containers and skips them.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: helix
          POSTGRES_PASSWORD: helix-ci
          POSTGRES_DB: helix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helix -d helix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      HELIX_TEST_DATABASE_URL: postgresql://helix:helix-ci@127.0.0.1:5432/helix_test?sslmode=disable
      HELIX_REQUIRE_TEST_DATABASE: "1"
      # Covered by the dedicated codegen step below.
      HELIX_VERIFY_SKIP_CODEGEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Generated drift code is committed (ADR-027). Regenerate it and fail if
      # the result differs from the commit: a schema change without
      # regenerated code, schema dump and schema helpers cannot merge.
      - name: Verify generated drift code is current (helix_remote_db)
        working-directory: helix_remote/packages/helix_remote_db
        run: dart run tool/codegen.dart --check
      - name: Verify on Linux
        shell: bash
        run: ./scripts/verify.sh
      # The integration_test suites are NOT run here, and removing the steps
      # that pretended to is the point.
      #
      # `flutter test integration_test` drives a real app on a real device.
      # This runner has none - Flutter reports "No supported devices
      # connected", since the project targets android and windows and the
      # runner offers linux desktop and web. The two steps were added with
      # the Phase 8 work and failed on every run from the day they landed,
      # which also meant the coverage ratchet below never executed: it sits
      # after them and was skipped every time.
      #
      # Restoring them needs an emulator in this job
      # (reactivecircus/android-emulator-runner or equivalent) AND journeys
      # worth ~10 minutes of runner time. Today's two files pump a widget
      # each; see helix_remote/app/integration_test/README.md.
      # The governance control evidence check (tool/check_governance_controls.dart)
      # runs inside verify.sh above.
      - name: Enforce coverage ratchet
        shell: bash
        run: ./scripts/coverage.sh
      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: helix-remote-coverage
          path: helix_remote/coverage/
          if-no-files-found: ignore

  performance-budgets:
    needs: changes
    if: >-
      needs.changes.outputs.forced == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.remote == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helix_remote
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Verify declared performance budgets
        run: dart tool/check_performance_budgets.dart
      - name: Enforce message-list burst budget on the CI reference runner
        run: flutter test app/test/performance_budget_test.dart
      # A day label is a calendar day across a clock change (AUD-14i-1): the
      # test only means something in a zone that has one, so it runs in two.
      - name: Day labels across a spring clock change (northern zone)
        env:
          TZ: America/New_York
        run: flutter test app/test/day_labels_dst_test.dart
      - name: Day labels across a spring clock change (southern zone)
        env:
          TZ: Australia/Sydney
        run: flutter test app/test/day_labels_dst_test.dart

  no-source-changes:
    needs: changes
    if: >-
      needs.changes.outputs.forced != 'true' &&
      needs.changes.outputs.common != 'true' &&
      needs.changes.outputs.local != 'true' &&
      needs.changes.outputs.remote != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Helix Remote source, docs, or CI changes detected (helix_local changes are not yet wired into this workflow)."

  supply-chain:
    needs: changes
    if: >-
      needs.changes.outputs.forced == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.remote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: helix_remote
    steps:
      - uses: actions/checkout@v4
      - name: No keys or tokens in the tree
        # Private keys and the key formats of the services Helix uses. The
        # documented example key of the AWS docs (...EXAMPLE) is the one
        # allowed hit, in a signing test.
        working-directory: .
        run: |
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[0-9A-Za-z-]{10,}|ghp_[0-9A-Za-z]{36}|AKIA[0-9A-Z]{16}' -- . | grep -v EXAMPLE; then
            echo '::error::A key or token looks committed (see above). Remove it and rotate it.'
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Generate resolved CycloneDX SBOM
        run: dart run tool/generate_sbom.dart pubspec.lock build/sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: helix-remote-sbom
          path: helix_remote/build/sbom.cdx.json
          if-no-files-found: error
      - name: Scan resolved dependency files for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./helix_remote
