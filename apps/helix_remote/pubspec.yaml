name: helix_remote
description: Helix Remote — internet messaging with end-to-end encryption, ephemeral
  LAN messaging, and secure group communication.
publish_to: none
version: 1.0.0

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  helix_remote_domain:
    path: ../../packages/remote/helix_remote_domain
  helix_remote_crypto:
    path: ../../packages/remote/helix_remote_crypto
  helix_remote_api:
    path: ../../packages/remote/helix_remote_api
  helix_remote_storage:
    path: ../../packages/remote/helix_remote_storage
  helix_remote_sync:
    path: ../../packages/remote/helix_remote_sync
  helix_remote_calls:
    path: ../../packages/remote/helix_remote_calls
  helix_remote_groups:
    path: ../../packages/remote/helix_remote_groups
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^12.0.0-beta.5
  cryptography: ^2.9.0
  crypto: ^3.0.7
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.31.0
  sqlite3: ^3.3.3
  helix_remote_backend:
    path: ../../services/helix_remote_backend

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
