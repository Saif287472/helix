# NOTE (documented during the helix_remote phone/invite/contacts-sync
# overhaul's Phase 12, not fixed here - out of that phase's scope): every
# `areas` path below is a helix_local path. helix_remote (app/, backend/,
# admin/, packages/helix_remote_*) is not classified anywhere in this file,
# so none of its changes get a classification-driven minimum_verification
# from this mechanism. This does not exempt helix_remote work from
# AI_GUARDRAILS' non-negotiable protections, which apply repo-wide per their
# own header - every phase of that overhaul still produced its own explicit
# risk note (behavior changed / verification performed / manual review
# remaining) in its commit message regardless of this gap. Classifying
# helix_remote here properly is follow-up work, not part of that overhaul.
version: 1
default_verification: "scripts/verify.ps1"

classifications:
  - classification: Critical
    areas:
      - packages/helix_transport/lib/services/transport/secure_channel.dart
      - lib/providers/controllers/profile_service.dart
      - lib/providers/controllers/trust_service.dart
      - lib/core/identity_phrase.dart
      - lib/main.dart
      - lib/app.dart
      - pubspec.yaml
      - android/**
      - windows/**
    minimum_verification:
      - dart format --set-exit-if-changed lib test tool
      - flutter analyze
      - dart run tool/check_boundaries.dart
      - dart run tool/check_secrets.dart
      - flutter test
      - explicit risk report
    notes: "Identity, crypto, bootstrap, platform permissions, and release configuration require human review."

  - classification: High
    areas:
      - packages/helix_protocol/lib/protocol/**
      - lib/providers/controllers/request_service.dart
      - lib/providers/controllers/group_service.dart
      - lib/data/database.dart
      - lib/routing/**
      - lib/ui/app_router.dart
      - lib/providers/controllers/secret_code_service.dart
    minimum_verification:
      - dart format --set-exit-if-changed lib test tool
      - flutter analyze
      - dart run tool/check_boundaries.dart
      - dart run tool/check_secrets.dart
      - flutter test
    notes: "Protocol, request, group, database, and navigation changes can alter user-visible contracts."

  - classification: Medium
    areas:
      - lib/providers/controllers/messaging_service.dart
      - lib/providers/controllers/file_transfer_service.dart
      - lib/providers/controllers/ephemeral_media_service.dart
      - lib/providers/controllers/reconnect_service.dart
      - lib/providers/controllers/session_service.dart
      - lib/providers/controllers/notification_service.dart
      - lib/providers/controllers/tcp_server_service.dart
      - lib/providers/controllers/diagnostics_service.dart
      - packages/helix_discovery/**
      - packages/helix_messaging/**
      - packages/helix_transfer/**
      - future/webrtc/**
    minimum_verification:
      - targeted tests for affected service
      - flutter analyze
      - flutter test
    notes: "Application behavior, timers, sockets, and media paths require targeted regression tests."

  - classification: Low
    areas:
      - lib/ui/**
      - lib/theme/**
      - assets/**
      - docs/**
    minimum_verification:
      - flutter analyze
      - affected widget/unit tests
    notes: "UI and docs still need visual/manual review when behavior is visible."
