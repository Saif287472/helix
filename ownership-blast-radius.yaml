# Package Ownership and Blast-Radius Classification
# Phase 4 — P4-018
#
# risk_level:
#   critical  — change breaks trust, crypto, storage isolation, or wipe contracts
#   high      — change breaks protocol, identity, session, or group state machines
#   medium    — change breaks UI behaviour or platform integration
#   low       — change is purely additive or cosmetic
#
# classification: local | remote | shared | tooling
#
# allowed_consumers: who may import this package

packages:

  apps/helix_local:
    classification: local
    owner: local-team
    risk_level: medium
    description: Helix Local Flutter application shell and composition root
    allowed_consumers: []
    notes: Must not import any packages/remote/** or packages/shared/** that carry product state.

  apps/helix_remote:
    classification: remote
    owner: remote-team
    risk_level: medium
    description: Helix Remote Flutter application shell and composition root
    allowed_consumers: []
    notes: Must not import any packages/local/** packages.

  packages/helix_domain:
    classification: local
    owner: local-team
    risk_level: critical
    description: >
      Local domain contracts — ProductDescriptor, channel constants, identity
      models, trust models, peer models, session contracts.  Contains
      LocalProductDescriptor and RemoteProductDescriptor but is classified Local
      because the descriptor pattern itself is a Local-originated abstraction.
    allowed_consumers:
      - apps/helix_local
      - packages/helix_storage
      - packages/helix_platform
      - packages/helix_groups
      - packages/helix_discovery
      - packages/helix_calls
      - packages/helix_messaging
      - packages/helix_transfer
      - packages/helix_transport
      - packages/helix_protocol
      - packages/helix_crypto
    notes: >
      Phase 4 rename target: helix_local_domain.  Remote will get its own
      helix_remote_domain package in Phase 8.

  packages/helix_protocol:
    classification: local
    owner: local-team
    risk_level: critical
    description: LAN wire protocol — frames, codecs, capability flags, fixture tests
    allowed_consumers:
      - apps/helix_local
      - packages/helix_transport
      - packages/helix_calls
      - packages/helix_messaging
      - packages/helix_transfer
      - packages/helix_groups
    notes: >
      Phase 4 rename target: helix_local_protocol.  Remote protocol is a
      separate design (Phase 8 / Phase 9).

  packages/helix_crypto:
    classification: local
    owner: local-team
    risk_level: critical
    description: Cryptographic primitives used by the Local LAN protocol
    allowed_consumers:
      - apps/helix_local
      - packages/helix_protocol
      - packages/helix_transport
      - packages/helix_domain
    notes: >
      Phase 4 rename target: helix_local_crypto.  Must not be reused for
      Remote E2EE without a separate security review (see Phase 9).

  packages/helix_transport:
    classification: local
    owner: local-team
    risk_level: high
    description: Secure LAN channel — TCP framing, TLS-equivalent, channel lifecycle
    allowed_consumers:
      - apps/helix_local
      - packages/helix_calls
      - packages/helix_messaging
      - packages/helix_transfer
      - packages/helix_groups
    notes: Phase 4 rename target: helix_local_transport.

  packages/helix_discovery:
    classification: local
    owner: local-team
    risk_level: high
    description: mDNS peer discovery (NsdManager on Android, WinRT DNS-SD on Windows)
    allowed_consumers:
      - apps/helix_local
      - packages/helix_groups
    notes: >
      Phase 4 rename target: helix_local_discovery.  Must stay out of Remote;
      Remote uses server-assisted signaling, not LAN broadcast.

  packages/helix_storage:
    classification: local
    owner: local-team
    risk_level: critical
    description: >
      Local secure storage adapters — profile, identity, trust, session
      repositories backed by flutter_secure_storage with helix_local_v1_ prefix.
    allowed_consumers:
      - apps/helix_local
    notes: >
      Phase 4 rename target: helix_local_storage.  Remote gets its own
      helix_remote_storage in Phase 11.  The two storage packages must never
      share a key prefix or a SQLite database file.

  packages/helix_platform:
    classification: local
    owner: local-team
    risk_level: high
    description: >
      Platform integration — Android foreground service, Windows tray, local
      notifications, platform notification gateway.
    allowed_consumers:
      - apps/helix_local
    notes: >
      Phase 4 rename target: helix_local_platform.  Remote will need its own
      platform package for push, background fetch, and Remote notifications.

  packages/helix_groups:
    classification: local
    owner: local-team
    risk_level: high
    description: Session-only LAN group lobby — multicast lock, host election, lobby service
    allowed_consumers:
      - apps/helix_local
    notes: >
      Phase 4 rename target: helix_local_groups.  Remote persistent groups are
      a separate design (Phase 16).  The Local group model (session-only,
      no server) must not be reused as Remote group infrastructure.

  packages/helix_messaging:
    classification: local
    owner: local-team
    risk_level: high
    description: Ephemeral LAN messaging — in-RAM chat threads, message dispatch
    allowed_consumers:
      - apps/helix_local
    notes: >
      Phase 4 rename target: helix_local_messaging.  Phase 6 will enforce
      RAM-only retention.  Remote messaging is a separate design (Phase 12).

  packages/helix_calls:
    classification: local
    owner: local-team
    risk_level: high
    description: >
      LAN WebRTC call engine — private/loopback candidate filtering, no STUN/TURN,
      Local secure-channel signaling.
    allowed_consumers:
      - apps/helix_local
    notes: >
      Phase 4 rename target: helix_local_calls.  Remote calls require a
      separate engine with STUN/TURN and Remote signaling (Phase 15).

  packages/helix_transfer:
    classification: local
    owner: local-team
    risk_level: medium
    description: LAN file transfer — chunked send/receive over Local secure channel
    allowed_consumers:
      - apps/helix_local
    notes: Phase 4 rename target: helix_local_transfer.

  packages/shared:
    classification: shared
    owner: both-teams
    risk_level: medium
    description: >
      PLACEHOLDER — no packages exist here yet.  Packages may be added only
      after passing the shared-code eligibility checklist in section 3.3 of the
      master plan.  No package in this boundary may import helix_local_* or
      helix_remote_*.
    allowed_consumers:
      - apps/helix_local
      - apps/helix_remote
    notes: Phase 4 task P4-006 defines extraction criteria.

  packages/remote:
    classification: remote
    owner: remote-team
    risk_level: critical
    description: >
      PLACEHOLDER — no packages exist here yet.  Remote domain, application,
      storage, sync, and platform packages will be created here in Phases 8–11.
      Must never import packages/local/**.
    allowed_consumers:
      - apps/helix_remote
    notes: Remote package creation begins in Phase 8.

  packages/local/helix_local_domain:
    classification: local
    owner: local-team
    risk_level: critical
    description: Local domain contracts, ProductDescriptor values, identity and trust models
    allowed_consumers:
      - apps/helix_local
      - packages/local/helix_local_storage
      - packages/local/helix_local_platform
      - packages/local/helix_local_groups
      - packages/local/helix_local_discovery
      - packages/local/helix_local_calls
      - packages/local/helix_local_messaging
      - packages/local/helix_local_transfer
      - packages/local/helix_local_transport
      - packages/local/helix_local_protocol

  packages/local/helix_local_protocol:
    classification: local
    owner: local-team
    risk_level: critical
    description: LAN wire protocol, frames, codecs, capability flags, and fixtures
    allowed_consumers:
      - apps/helix_local
      - packages/local/helix_local_transport
      - packages/local/helix_local_calls
      - packages/local/helix_local_messaging
      - packages/local/helix_local_transfer
      - packages/local/helix_local_groups

  packages/local/helix_local_crypto:
    classification: local
    owner: local-team
    risk_level: critical
    description: Local LAN cryptographic primitives
    allowed_consumers:
      - packages/local/helix_local_transport
      - apps/helix_local

  packages/local/helix_local_transport:
    classification: local
    owner: local-team
    risk_level: high
    description: Secure LAN channel and frame transport
    allowed_consumers:
      - apps/helix_local
      - packages/local/helix_local_calls
      - packages/local/helix_local_messaging
      - packages/local/helix_local_transfer
      - packages/local/helix_local_groups

  packages/local/helix_local_discovery:
    classification: local
    owner: local-team
    risk_level: high
    description: mDNS and UDP LAN peer discovery
    allowed_consumers:
      - apps/helix_local
      - packages/local/helix_local_groups

  packages/local/helix_local_storage:
    classification: local
    owner: local-team
    risk_level: critical
    description: Local secure storage, RAM repositories, and storage isolation guards
    allowed_consumers:
      - apps/helix_local

  packages/local/helix_local_platform:
    classification: local
    owner: local-team
    risk_level: high
    description: Local platform notifications, foreground service, diagnostics, and tray integration
    allowed_consumers:
      - apps/helix_local

  packages/local/helix_local_groups:
    classification: local
    owner: local-team
    risk_level: high
    description: Session-only LAN group lobby and membership behavior
    allowed_consumers:
      - apps/helix_local

  packages/local/helix_local_messaging:
    classification: local
    owner: local-team
    risk_level: high
    description: Ephemeral LAN messaging behavior and in-memory message lifecycle
    allowed_consumers:
      - apps/helix_local

  packages/local/helix_local_calls:
    classification: local
    owner: local-team
    risk_level: high
    description: LAN WebRTC call service with Local signaling and private-candidate handling
    allowed_consumers:
      - apps/helix_local

  packages/local/helix_local_transfer:
    classification: local
    owner: local-team
    risk_level: medium
    description: LAN file transfer send/receive coordination
    allowed_consumers:
      - apps/helix_local

  packages/remote/helix_remote_domain:
    classification: remote
    owner: remote-team
    risk_level: critical
    description: Remote account, device, conversation, message, attachment, and call domain models
    allowed_consumers:
      - apps/helix_remote
      - packages/remote/helix_remote_api
      - packages/remote/helix_remote_storage
      - packages/remote/helix_remote_sync

  packages/remote/helix_remote_crypto:
    classification: remote
    owner: remote-team
    risk_level: critical
    description: Remote E2EE, attachment encryption, backup envelope crypto, and key storage wrappers
    allowed_consumers:
      - apps/helix_remote

  packages/remote/helix_remote_api:
    classification: remote
    owner: remote-team
    risk_level: high
    description: Remote REST models, realtime envelopes, and compatibility fixtures
    allowed_consumers:
      - apps/helix_remote
      - packages/remote/helix_remote_sync

  packages/remote/helix_remote_storage:
    classification: remote
    owner: remote-team
    risk_level: critical
    description: Remote persistent SQLite database, migrations, tombstones, and backup snapshots
    allowed_consumers:
      - apps/helix_remote
      - packages/remote/helix_remote_sync
      - packages/remote/helix_remote_groups

  packages/remote/helix_remote_sync:
    classification: remote
    owner: remote-team
    risk_level: high
    description: Remote inbound/outbound sync engine, cursors, idempotency, and realtime dispatch
    allowed_consumers:
      - apps/helix_remote

  packages/remote/helix_remote_calls:
    classification: remote
    owner: remote-team
    risk_level: high
    description: Remote WebRTC call service using internet signaling, STUN, and TURN
    allowed_consumers:
      - apps/helix_remote

  packages/remote/helix_remote_groups:
    classification: remote
    owner: remote-team
    risk_level: high
    description: Remote persistent group lifecycle, roles, invites, and group sync operations
    allowed_consumers:
      - apps/helix_remote

  services/helix_remote_backend:
    classification: remote
    owner: remote-team
    risk_level: critical
    description: Remote modular monolith backend, REST/WebSocket gateways, server queues, privacy, and operability
    allowed_consumers: []

  tool:
    classification: tooling
    owner: architecture-team
    risk_level: high
    description: Boundary, release, secret, SBOM, dependency, and governance verification tools
    allowed_consumers: []
