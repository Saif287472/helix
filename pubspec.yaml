name: helix_workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - apps/helix_local
  - apps/helix_remote
  - tool
  - packages/local/helix_domain
  - packages/local/helix_protocol
  - packages/local/helix_crypto
  - packages/local/helix_transport
  - packages/local/helix_storage
  - packages/local/helix_platform
  - packages/local/helix_calls
  - packages/local/helix_messaging
  - packages/local/helix_transfer
  - packages/local/helix_groups
  - packages/local/helix_discovery

dependencies:
  helix_domain:
    path: packages/local/helix_domain
  helix_protocol:
    path: packages/local/helix_protocol
