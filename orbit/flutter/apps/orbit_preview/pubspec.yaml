name: orbit_preview
description: The Flutter twin of the HTML prototype viewer - the screen index, the theme picker and the device frames, on fake data.
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  orbit_ui:
    path: ../../packages/orbit_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The other six themes' fonts, loaded from local files here and declared at
  # runtime with FontLoader - the way a downloaded theme pack will be, because
  # an app may not fetch a font and only Orbit and Orbit Night ship inside
  # orbit_ui (PORT_PLAN.md Phase 2). Weights follow the upstream files: a
  # variable family declares one asset and its axis is set with
  # `fontVariations`; a family split into static files declares one asset per
  # weight. See orbit/flutter/fonts/MANIFEST.md.
  fonts:
    - family: 'DM Sans'
      fonts:
        - asset: fonts/DMSans[opsz,wght].ttf
        - asset: fonts/DMSans-Italic[opsz,wght].ttf
          style: italic
    - family: 'DM Mono'
      fonts:
        - asset: fonts/DMMono-Regular.ttf
          weight: 400
        - asset: fonts/DMMono-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/DMMono-Medium.ttf
          weight: 500
        - asset: fonts/DMMono-MediumItalic.ttf
          weight: 500
          style: italic
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces[SOFT,WONK,opsz,wght].ttf
        - asset: fonts/Fraunces-Italic[SOFT,WONK,opsz,wght].ttf
          style: italic
    - family: Nunito
      fonts:
        - asset: fonts/Nunito[wght].ttf
        - asset: fonts/Nunito-Italic[wght].ttf
          style: italic
    - family: 'EB Garamond'
      fonts:
        - asset: fonts/EBGaramond[wght].ttf
        - asset: fonts/EBGaramond-Italic[wght].ttf
          style: italic
    - family: Cinzel
      fonts:
        - asset: fonts/Cinzel[wght].ttf
    # Cinzel, Rajdhani, Share Tech Mono and Black Ops One have no upstream
    # italic, so nothing synthesises one: a theme that wants a slanted wordmark
    # from them will have to say so in DEVIATIONS.md.
    - family: Rajdhani
      fonts:
        - asset: fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: 'Exo 2'
      fonts:
        - asset: fonts/Exo2[wght].ttf
        - asset: fonts/Exo2-Italic[wght].ttf
          style: italic
    - family: 'Share Tech Mono'
      fonts:
        - asset: fonts/ShareTechMono-Regular.ttf
    - family: 'JetBrains Mono'
      fonts:
        - asset: fonts/JetBrainsMono[wght].ttf
        - asset: fonts/JetBrainsMono-Italic[wght].ttf
          style: italic
    - family: 'Black Ops One'
      fonts:
        - asset: fonts/BlackOpsOne-Regular.ttf
    - family: Barlow
      fonts:
        - asset: fonts/Barlow-Regular.ttf
          weight: 400
        - asset: fonts/Barlow-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/Barlow-Medium.ttf
          weight: 500
        - asset: fonts/Barlow-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: fonts/Barlow-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/Barlow-Bold.ttf
          weight: 700
        - asset: fonts/Barlow-BoldItalic.ttf
          weight: 700
          style: italic