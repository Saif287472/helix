<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F7FA" />
<title>Orbit Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Theme fonts: loaded from Google here for the prototype only; the app bundles them (no runtime fetch). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=DM+Sans:opsz,wght@9..40,400..700&family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Nunito:wght@400..900&family=EB+Garamond:wght@400..700&family=Cinzel:wght@500..700&family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400..700&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400..700&family=Black+Ops+One&family=Barlow:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/shell.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/screens.css" />
<link rel="stylesheet" href="css/pages.css" />
<link rel="stylesheet" href="css/window.css" />
</head>
<body class="bg-plain">
<div class="viewer" id="viewer">
  <!-- Prototype chrome: screen index (not part of the app design) -->
  <aside class="v-index" id="vIndex" aria-label="Screens">
    <div class="v-brand">
      <div class="v-mark" aria-hidden="true" style="background:url(assets/orbit-mark.svg) center/cover"></div>
      <div>
        <div class="v-name">Orbit</div>
        <div class="v-sub">UI prototype · direction B</div>
      </div>
    </div>
    <div class="v-search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><input id="vFilter" placeholder="Find a screen" aria-label="Find a screen" /></div>
    <nav class="v-list" id="vList"></nav>
  </aside>

  <!-- The phone -->
  <main class="v-stage">
    <div class="v-stage-top">
      <button class="v-chip" id="vIndexToggle" title="Show the screen list"><i class="ph ph-list"></i> Screens</button>
      <div class="v-current" id="vCurrent"></div>
      <div class="v-device" id="vDevice" role="group" aria-label="Device">
        <button data-device="phone" title="Phone (412 × 866)"><i class="ph ph-device-mobile"></i>Phone</button>
        <button data-device="window-m" title="Windows, two panes (960 × 720)"><i class="ph ph-app-window"></i>960</button>
        <button data-device="window-l" title="Windows, wide with the info pane (1280 × 800)"><i class="ph ph-monitor"></i>1280</button>
      </div>
      <button class="v-chip" id="vTweaksToggle" title="Show the tweaks panel"><i class="ph ph-sliders-horizontal"></i> Tweaks</button>
    </div>
    <div class="phone-holder" id="phoneHolder"><div class="phone" id="phone">
      <div class="phone-screen" id="phoneScreen">
        <div class="winbar" aria-hidden="true">
          <span class="wb-app"><span class="wb-mark"></span>Orbit</span>
          <span class="wb-caps"><span><i class="ph-light ph-minus"></i></span><span><i class="ph-light ph-square"></i></span><span class="wb-close"><i class="ph-light ph-x"></i></span></span>
        </div>
        <div class="statusbar" id="statusbar" aria-hidden="true">
          <span class="sb-time">9:41</span>
          <span class="sb-icons"><i class="ph-fill ph-cell-signal-full"></i><i class="ph-fill ph-wifi-high"></i><i class="ph-fill ph-battery-high"></i></span>
        </div>
        <div class="stack" id="stack"></div>
        <div class="overlay-root" id="overlayRoot"></div>
        <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>
        <div class="gesture-bar" aria-hidden="true"></div>
      </div>
    </div></div>
  </main>

  <!-- Tweaks: live design knobs, saved in this browser only -->
  <aside class="v-tweaks" id="vTweaks" aria-label="Tweaks">
    <div class="v-tweaks-head">
      <div class="v-name">Tweaks</div>
      <button class="v-link" id="tReset">Reset</button>
    </div>
    <div class="v-tweaks-body" id="tBody"></div>
    <p class="v-note">Tweaks change the design tokens live. When you settle on values, tell me and I'll make them the defaults.</p>
  </aside>
</div>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
<script src="js/kit.js"></script>
<script src="js/screens/signin.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/conversation.js"></script>
<script src="js/screens/chat_pages.js"></script>
<script src="js/screens/calls.js"></script>
<script src="js/screens/people.js"></script>
<script src="js/screens/groups.js"></script>
<script src="js/screens/settings.js"></script>
<script src="js/screens/devices_backup.js"></script>
<script src="js/screens/you.js"></script>
<script src="js/screens/topics.js"></script>
<script src="js/screens/appearance.js"></script>
<script src="js/screens/states.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
